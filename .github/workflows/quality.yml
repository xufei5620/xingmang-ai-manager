name: quality

# A branch push with an open pull request used to fire both events and run the
# whole matrix twice. pull_request already reruns on every push to the branch,
# so restricting push to main keeps identical coverage at half the minutes.
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are wasted minutes, and one run bills ~49 of them. main is
# included: while the project is pre-release, a burst of merges would otherwise
# run the full matrix once per merge with no way to supersede an obsolete one,
# and only the final state actually needs validating. Revisit when releases
# start — then every main commit wants its own verified run so a bad one can be
# bisected out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      cliVersions: ${{ steps.scope.outputs.cliVersions }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # This is the only job that checks out full history — so the guard can
      # diff the unreleased sections against the base — and the only one that
      # also runs for a documentation-only change, which is exactly when a
      # direct CHANGELOG.md edit needs catching.
      - name: Validate unreleased change fragments
        run: npm run changelog:check
      - id: scope
        run: node scripts/ci-change-scope.cjs

  # One serial Windows job used to own every Windows check, and at ~27 minutes
  # it was the whole pipeline's wall clock: `npm test` (~11m) and test:v2
  # (~9m) ran back to back while five other runners sat idle. The shards below
  # run the same commands, with the same timeouts, on runners that start at the
  # same moment. Nothing is skipped, shortened or reordered within a shard.
  #
  # The two vitest suites are cut with `--shard`, which sorts the resolved test
  # files by a hash of their path and slices that list, so the shards are a
  # stable partition whose union is exactly the file set the unsharded command
  # ran. `--no-file-parallelism` stays on inside each shard: it is what keeps
  # the filesystem-heavy files from racing each other under Defender, and
  # sharding across runners preserves it rather than working around it.
  #
  # The cost is runner slots, not minutes: this repository is public, so Actions
  # bills nothing, but the account's concurrent-job ceiling is shared across
  # every open pull request. With twenty-odd of them in flight the shards queue
  # rather than fail, and a queued job is not running, so the caps below are
  # untouched by the wait — `timeout-minutes` measures execution, not time spent
  # waiting for a runner. Nothing here needs to grow if a run sits in the queue.
  windows-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # The longest shard is ~9 minutes. This is a backstop for a wedged runner,
    # not a bound anything is expected to approach.
    timeout-minutes: 25
    strategy:
      # A failing shard must not cancel its siblings. Splitting the job is only
      # worth it if one run still reports every failure it found, rather than
      # surfacing them one push at a time.
      fail-fast: false
      matrix:
        include:
          # The vitest half of `npm test`: ~10 of its ~11 minutes. Almost all
          # of that is per-file environment setup rather than assertions, so
          # splitting by file count — which is what --shard does — splits the
          # time with it.
          - shard: vitest-1
            command: npm run test:vitest:1
            timeout: 15
          - shard: vitest-2
            command: npm run test:vitest:2
            timeout: 15
          # The node --test half of `npm test`: the build and release script
          # suites, then the two browser suites that ride along with them. Under
          # a minute together, so they share one runner rather than a shard each.
          - shard: node
            command: npm run test:scripts && npm run test:browser
            timeout: 10
          # test:v2 stays on the shipping platform; test:canvas and the legacy
          # test:ui suites live in linux-test, because neither asserts anything
          # platform-specific and these are the least stable runners. Its two
          # halves are wildly lopsided — the vitest one is seconds, the browser
          # one is effectively all of test:v2's ~9 minutes — so only the
          # browser one is split further.
          - shard: renderer-v2
            command: npm run test:v2:vitest
            timeout: 10
          # Deliberately NOT split further, even though app-check.mjs is half
          # of it on its own. Every file here builds a Vite dev server with the
          # same `configFile: false` root, so they share one on-disk
          # node_modules/.vite dependency cache and the earlier files warm it
          # for the later ones — app-check.mjs runs last and inherits all of
          # it. Splitting them across runners gave app-check a cold cache, and
          # a mid-run re-optimisation then blew the 90s fixture mount budget on
          # the NewAPI announcement-collection test (run 35420361508). The
          # suite is ~10 minutes whole, which still clears the target.
          - shard: renderer-v2-browser
            command: npm run test:v2:browser
            timeout: 18
    name: windows-test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx --no-install playwright install chromium
      - name: Enable Windows Developer Mode for symlink security tests
        shell: pwsh
        run: |
          $unlockKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $unlockKey -Force | Out-Null
          New-ItemProperty -Path $unlockKey -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Run the ${{ matrix.shard }} shard
        # Roughly twice the shard's observed run. A suite that stalls rather
        # than fails — test:v2 sat for 42 minutes on #172 and took a whole
        # 45-minute job down with it — now costs this one shard and reports
        # which one, instead of cancelling the job at its cap with no verdict.
        timeout-minutes: ${{ matrix.timeout }}
        run: ${{ matrix.command }}
      - name: Fail if the test run left files in the working tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty after the test run"
            git status --porcelain
            exit 1
          fi

  # The compile, smoke and packaging half of the old job. It stays one job
  # rather than joining the matrix above because each smoke carries its own
  # step timeout, and because every step here depends on the compile before it.
  windows-package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      # No `npx playwright install chromium` here on purpose: every smoke below
      # drives the application through _electron.launch, which uses the
      # Electron binary the install already placed, not a downloaded Chromium.
      - run: npm run typecheck
      - run: npm run compile
      - name: Verify the default compile selected renderer v2
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist/renderer-v2.flag' -PathType Leaf)) {
            throw 'npm run compile did not produce dist/renderer-v2.flag'
          }
      - name: Run isolated signed-out startup smoke test
        # Same three-layer bound as the smoke below: the script budgets itself
        # to 3 minutes, this is the backstop if it somehow outlives that.
        timeout-minutes: 5
        run: node e2e/electron-ci-smoke.mjs
      - name: Verify tray and forced exit with isolated application state
        # The script budgets itself to 4 minutes and prints a process tree when
        # it overruns. This is the backstop for a hang that outlives even that.
        timeout-minutes: 6
        run: node e2e/window-close-smoke.mjs
      - name: Verify dual-site account isolation with an isolated fixture
        # The only end-to-end coverage of the two account backends (D-12). It
        # drives three cold starts, so it budgets itself to 8 minutes; this is
        # the backstop for a hang that outlives even that.
        timeout-minutes: 10
        run: node e2e/realm-account-smoke.mjs
      - run: node e2e/onboarding-smoke.mjs
      # T-G5: the two smokes below were written, documented and then never wired
      # to anything, so the only thing that ran them was a person who remembered
      # they existed. Each covers a Windows-only guarantee that no other suite
      # asserts: the Electron profile that holds the OSCrypt key stays inside
      # the temporary directory, and an account vault survives a safeStorage key
      # rotation across real process lifetimes. They need the compile above and
      # print SKIP and exit 0 elsewhere, which is why they belong here and not
      # in linux-test.
      #
      # The step bounds are backstops, not budgets: each of these is a couple of
      # minutes. They stay well under the job cap on purpose, so a single wedged
      # smoke names itself instead of taking the job down at 25 minutes with no
      # verdict on which step hung.
      - name: Verify the acceleration profile stays inside its temporary directory
        timeout-minutes: 6
        run: node e2e/acceleration-profile-isolation-smoke.mjs
      - name: Verify account vault recovery across a safeStorage key rotation
        # Bundles its fixture and boots Electron three times over, so it gets
        # more room than the two either side of it.
        timeout-minutes: 8
        run: node e2e/realm-vault-recovery-smoke.mjs
      # T-G5: the last two of the never-wired smokes. Both were blocked on the
      # same two things and both were fixed rather than worked around: they
      # assumed a desktop large enough that resolveWindowPlacement would not
      # maximize the window (a maximized window ignores setContentSize on
      # Windows, so every resize silently did nothing), and neither bounded a
      # single wait, so a wedged Electron would have taken the job down at its
      # cap with nothing printed. They now pin their own window state and run
      # through the shared smoke runtime like the smokes above.
      #
      # Windows only on purpose: the zoom the first one asserts is written by
      # electron/platform/renderer-v2.ts, whose title-bar overlay half is
      # win32-specific, and macos-test is already the longest job in the matrix.
      # Together they are a couple of seconds.
      - name: Verify the native window zoom, star canvas and preference persistence
        # The script budgets itself to 4 minutes. This is the backstop for a
        # hang that outlives even that.
        timeout-minutes: 6
        run: node e2e/renderer-v2-native.mjs
      - name: Verify a close during a committing reload does not wait for the renderer
        # Budgets itself to 3 minutes; the whole run is under a second when the
        # close path is healthy, and the point of the smoke is that it is not
        # fifteen seconds.
        timeout-minutes: 5
        run: node e2e/renderer-v2-native-close-race.mjs
      - run: npm run build:win:ci
      - run: node scripts/verify-packaged-hardening.cjs release/win-unpacked
      - run: node e2e/packaged-hardening-smoke.mjs "release/win-unpacked/星芒AI管理工具.exe"
      - run: node e2e/asar-tamper-smoke.mjs release/win-unpacked
      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-smoke-artifacts
          # Smokes that write their evidence into a subdirectory of artifacts/
          # were dropped entirely by the flat globs alone.
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/**/*.png
            artifacts/**/*.json
            output/realm-account-review/*
          if-no-files-found: ignore
          retention-days: 7

  # Folds the Windows shards back into the single `test` check they replaced.
  # Two things depend on that name surviving: a branch protection rule may name
  # it, and a reader scanning a pull request should still find one check that
  # answers "is Windows green" without counting six. It evaluates the change
  # scope itself, so it reports success — never "skipped" — for a
  # documentation-only change, which is what the aggregate below relies on.
  test:
    # `!cancelled()` rather than `always()`: a superseded run — this workflow
    # cancels those on every new push — would otherwise run this job anyway,
    # find the shards cancelled, and post a red `test` against a commit nobody
    # is looking at any more. A job that blows its own `timeout-minutes` is
    # cancelled at the job level, not the workflow level, so that still lands
    # here as a failure. When the whole run is cancelled this job is skipped,
    # and the aggregate below refuses a skipped `test`, so a cancelled run
    # still cannot read as a pass.
    if: ${{ !cancelled() }}
    needs: [changes, windows-test, windows-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Windows shard to match the change scope
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS)
          const code = jobs.changes.outputs.code
          if (jobs.changes.result !== 'success' || !['true', 'false'].includes(code)) process.exit(1)
          const expected = code === 'true' ? 'success' : 'skipped'
          if (['windows-test', 'windows-package'].some(name => jobs[name].result !== expected)) process.exit(1)
          NODE

  macos-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    # 35 until the packaged app was actually launched at the end of the job;
    # that step has its own 6 minute bound and everything before it already
    # needed most of the old cap.
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx --no-install playwright install chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mac:free-signing
      - name: Rehearse the release signing keychain on a throwaway certificate
        # publish-release.yml 的 macos-build 挂 environment: release，PR 上从来不跑，
        # 于是那条链路唯一的验证机会就是真的发一次版。2026-09-20 连红四次，其中两次
        # 都该在这里就红。脚本不读任何 secret，用现场生成的一次性证书。
        timeout-minutes: 5
        run: npm run test:mac:release-keychain
      - name: Verify macOS native network component with isolated preferences
        run: npm run test:mac:proxy
      - run: npm run test:mac:dev-origin
      - name: Verify tray and forced exit with isolated application state
        # The script budgets itself to 4 minutes and prints a process tree when
        # it overruns. This is the backstop for a hang that outlives even that.
        timeout-minutes: 6
        run: node e2e/window-close-smoke.mjs
      - name: Fail if the test run left files in the working tree
        # Windows path math evaluated on a POSIX host yields a backslash
        # relative name, which lands as a stray directory in the repository
        # root instead of under the temporary directory it was meant for.
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty after the test run"
            git status --porcelain
            exit 1
          fi
      # P-20: this used to be `if: github.event_name == 'push'`, on the grounds
      # that macOS bills at 10x and this one step was half the cost of a run.
      # This repository is public, so Actions bills nothing at all, and the
      # saving bought a gate that only fires after a merge: a pull request that
      # broke macOS packaging — the signing preflight, the electron-builder
      # config, the artifact verifier — went green and surfaced on main, where
      # the fix needs its own pull request through the same gate. ~150s on a
      # runner that is not the pipeline's critical path is worth catching it
      # before the merge instead.
      - name: Build and verify free macOS distribution with ephemeral signing
        # The job cap is 35 minutes and everything before this step needs most
        # of it. Without a step bound, one wedged `security` or `codesign` call
        # takes the whole job down at its cap with no verdict on which step hung.
        timeout-minutes: 12
        # --ci-keep-package only skips the cleanup, so the launch check below
        # runs against the very bundle the verifier just accepted rather than a
        # second build of its own. The directory it leaves matches release-*/
        # in .gitignore.
        run: node scripts/run-macos-free-build.cjs --ci-temporary-signing --ci-keep-package
      - name: Launch the packaged macOS app and require it to stay alive
        # The 2026-09-19 package passed every check in the step above and was
        # killed by dyld on launch. No artifact check can see that; only
        # starting it can.
        timeout-minutes: 6
        run: node e2e/macos-launch-smoke.mjs

  macos-release-rehearsal:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    # publish-release.yml 的 macos-build 挂 environment: release，PR 上从来不跑，
    # 于是整条发布路径此前唯一的验证机会就是真的发一次版，而每次都要产品所有者点
    # 一次批准。2026-09-20 连红四次，前两次红在签名身份、后两次红在它下游。这个
    # 作业把那条路整段搬到 PR 上，用现场生成的一次性证书，不读任何 secret。
    #
    # 与 macos-test 里那条 --ci-temporary-signing 的区别正是发布路径独有的四件事：
    # electron-builder 按 CSC_NAME 自己在 keychain 里找身份（而不是走自定义 sign
    # 钩子）、publishedIdentity 口径的签名预检、按架构分两次构建再合并、带私有
    # 加速线路。这四件事以前在 PR 上一件都没跑过。
    #
    # 它与 macos-test 并行，所以这十几分钟不落在流水线的关键路径上。
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      # 与 publish-release.yml 同样的先后：暂存工具用的是主进程里那套安全读写与内核
      # 校验，所以它跑之前必须先有 dist-electron；少了这一步它会在第一秒就报
      # 「请先编译主进程」。
      - name: Compile the main process the staging tool needs
        run: node node_modules/typescript/bin/tsc -p tsconfig.electron.json
      - name: Prepare the private acceleration bundles
        env:
          ACCELERATION_ARM64: ${{ runner.temp }}/acceleration-darwin-arm64
          ACCELERATION_X64: ${{ runner.temp }}/acceleration-darwin-x64
        run: |
          node scripts/prepare-acceleration-bundle.cjs --target darwin-arm64 --output "$ACCELERATION_ARM64"
          node scripts/prepare-acceleration-bundle.cjs --target darwin-x64 --output "$ACCELERATION_X64"
      # 排练不重跑 typecheck 与 npm test（macos-test 与 Windows 分片已经跑过），但
      # electron-builder 打的是编译产物。发布那条路径由 dist:mac:free 自己跑这一步，
      # 排练跳过了检查，所以要自己补上。
      - run: npm run compile
      - name: Rehearse the whole release path on a throwaway certificate
        # 两个架构各跑一遍 electron-builder，再加产物校验与一次真启动。步骤自己有
        # 上界，否则一处 codesign 卡住会在作业上限才失败，而且说不出卡在哪一步。
        timeout-minutes: 40
        env:
          REHEARSAL_ACCELERATION_ARM64: ${{ runner.temp }}/acceleration-darwin-arm64
          REHEARSAL_ACCELERATION_X64: ${{ runner.temp }}/acceleration-darwin-x64
        run: npm run test:mac:release-path

  linux-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Took on test:v2, test:canvas, test:ui and check:v2 from the Windows job.
    # These are the cheapest billed minutes in the matrix, so the coverage the
    # shipping renderer needs belongs here rather than behind the one job that
    # Defender timeouts already make unreliable.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      # --with-deps (Linux-only flag) installs Chromium's shared-library
      # dependencies via apt; the hosted Windows/macOS runners don't need it
      # because those OSes ship the libraries Chromium links against.
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # The renderer v2 browser suites are plain Chromium, so they need no
      # Electron and no display server here.
      - run: npm run test:v2
      - run: npm run test:canvas
      # The legacy rollback UI suites. They assert rendered markup only, so one
      # platform answers the question three platforms used to.
      - run: npm run test:ui
      # Without --report this writes no files, which is what lets it sit in
      # front of the dirty-tree guard below.
      - run: npm run check:v2
      # R-G12: `legacy` is the rollback renderer, and until this step nothing
      # in CI ever built it — its React 18 alias table in vite.config.ts only
      # resolves when XINGMANG_RENDERER=legacy, so a dropped pinned dependency
      # or an import the shipping tree no longer has would surface on the day
      # the rollback is needed. The bundle is thrown away; what is being
      # asserted is that the build still completes.
      - run: npm run check:legacy
      - name: Fail if the test run left files in the working tree
        # Windows path math evaluated on a POSIX host yields a backslash
        # relative name, which lands as a stray directory in the repository
        # root instead of under the temporary directory it was meant for.
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty after the test run"
            git status --porcelain
            exit 1
          fi

  # N1 的已验证版本名单说「这个版本在我们的中转上能用」，而在这个作业存在之前
  # 那句话只有上游 changelog 作背书 —— 名单挡住的两次回归都是 CLI 发出的请求被
  # 第三方端点拒掉，只有真的跑一次 `claude -p` 才答得了。所以改名单的 PR 要自己
  # 证明这一句，而不是留给客户去发现。
  #
  # 只在名单（或它的说明文档）被改动时跑：别的 PR 改不动这个答案，不值得对生产
  # 中转发真实请求。没有配探测密钥时作业照常通过，但 job summary 会写明「未在
  # 中转实测」—— 一句诚实的「没验证」比一个看着绿的空作业有用。
  #
  # 密钥只从同仓分支的 PR 拿得到（GitHub 不把仓库密钥给 fork 的 pull_request），
  # 这正好是本项目的工作方式；fork 上这个作业会走进「没有密钥」那条分支。
  cli-relay-probe:
    needs: changes
    if: needs.changes.outputs.cliVersions == 'true'
    runs-on: ubuntu-latest
    # One install plus one real request per pinned CLI per relay site. Three
    # pinned CLIs and two sites is six requests, each bounded at two minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - name: Probe every pinned CLI version against every relay site
        env:
          XINGMANG_CLI_PATROL_KEY: ${{ secrets.XINGMANG_CLI_PATROL_KEY }}
        run: node scripts/probe-cli-relay.cjs

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # No `cache: npm` on purpose (P-32): this job never runs `npm ci`,
          # because `npm audit` resolves the advisory set from the lockfile
          # alone. Caching a node_modules tree nothing restores into only buys
          # a cache lookup and an upload of the same key every other job writes.
      - run: npm run audit:production
      - name: Report development dependency advisories
        run: npm run audit:ci

  quality-gate:
    if: always()
    needs: [changes, test, macos-test, macos-release-rehearsal, linux-test, audit, cli-relay-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a verified documentation-only change
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS)
          const code = jobs.changes.outputs.code
          if (jobs.changes.result !== 'success' || !['true', 'false'].includes(code)) process.exit(1)
          const expected = code === 'true' ? 'success' : 'skipped'
          if (['macos-test', 'macos-release-rehearsal', 'linux-test', 'audit'].some(name => jobs[name].result !== expected)) process.exit(1)
          // `test` folds the Windows shards together and applies that same
          // expectation itself, so it reports success — never "skipped" — for a
          // documentation-only change.
          if (jobs.test.result !== 'success') process.exit(1)
          // The relay probe has its own trigger (the verified-version list), so
          // it is skipped on almost every pull request. A red one still has to
          // block: catching a bad pin before it reaches a customer is the only
          // reason the job exists.
          if (!['success', 'skipped'].includes(jobs['cli-relay-probe'].result)) process.exit(1)
          NODE
