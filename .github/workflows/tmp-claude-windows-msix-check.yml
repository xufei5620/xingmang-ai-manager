# 临时：在 GitHub 的 Windows 机器上从 Claude 官网下一次 Windows 安装包，核对星芒认的发布者
# （pzs8sxrjxfjjc）对不对得上真包，并照 A014（没有系统安装组件）的路子用星芒自己的代码真装一遍。
# 只在本线程分支上跑，核完删掉，不进 main。
name: tmp-claude-windows-msix-check

on:
  push:
    branches: [claude/windows-desktop-install-routes-pt0t50]
    paths: [.github/workflows/tmp-claude-windows-msix-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci --registry=https://registry.npmjs.org/

      # external-client-runtime 经 system-shell 引到 electron，第一次 require 时才现下二进制。
      - name: Install the Electron binary
        timeout-minutes: 20
        run: node scripts/ci-ensure-electron-binary.cjs

      - name: Compile the main process
        run: npx tsc -p tsconfig.electron.json

      - name: Download, check and install the official Claude package with the app's own code
        shell: bash
        run: |
          node <<'NODE'
          const path = require('node:path')
          const { execFileSync } = require('node:child_process')
          const compiled = (name) => require(path.join(process.cwd(), 'dist-electron', `${name}.js`))
          const { installClaudeDesktopFromOfficial, windowsPackagePublisherId } = compiled('claude-desktop-msix-installer')
          const { addWindowsDesktopAppxPackage } = compiled('codex-desktop-appx')
          const { createExternalClientRuntime } = compiled('external-client-runtime')
          const { runCommand } = compiled('command-runner')
          const { resolveWindowsCliExecutionMode, encodeWindowsPowerShellCommand } = compiled('windows-elevation')

          const expectedPublisherId = 'pzs8sxrjxfjjc'
          // 生产走 Electron 的 net.fetch，带 Chromium 的 User-Agent；这里照着带上，免得被当成脚本拦下。
          const userAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) xingmang-ai-manager/0.2.14 Chrome/146.0.0.0 Electron/43.6.0 Safari/537.36'
          function electronLikeFetch(input, init = {}) {
            const headers = new Headers(init.headers || {})
            if (!headers.has('user-agent')) headers.set('user-agent', userAgent)
            const url = typeof input === 'string' ? input : input.url
            console.log(`[fetch] ${init.method || 'GET'} ${url}${headers.has('range') ? ` range=${headers.get('range')}` : ''}`)
            return fetch(input, { ...init, headers }).then((response) => {
              console.log(`[fetch]   -> ${response.status} location=${response.headers.get('location') || '-'} type=${response.headers.get('content-type') || '-'} length=${response.headers.get('content-length') || '-'}`)
              return response
            })
          }
          async function loggedRunCommand(spec, options, dependencies) {
            const startedAt = Date.now()
            try {
              const result = await runCommand(spec, options, dependencies)
              console.log(`[command] ${path.basename(spec.executable)} exit=${result.exitCode} ${Date.now() - startedAt}ms stdout=${result.stdout.trim().slice(0, 3000)}`)
              return result
            } catch (error) {
              console.log(`[command] ${path.basename(spec.executable)} FAILED ${Date.now() - startedAt}ms: ${String(error && error.message).slice(0, 2000)} stderr=${String((error && error.stderr) || '').slice(0, 2000)}`)
              throw error
            }
          }
          // 只读：把清单里星芒用得着的几样都打出来（身份、依赖、能力、应用 ID、扩展类别、签名）。
          function dumpManifest(packagePath) {
            const script = [
              "$ErrorActionPreference = 'Stop'",
              'Add-Type -AssemblyName System.IO.Compression.FileSystem',
              '$zip = [IO.Compression.ZipFile]::OpenRead($env:CLAUDE_MSIX_PATH)',
              "try { $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' } | Select-Object -First 1; $reader = [IO.StreamReader]::new($entry.Open()); try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() } } finally { $zip.Dispose() }",
              '$xml = [xml]$text',
              '$identity = $xml.Package.Identity',
              '$deps = @($xml.Package.Dependencies.ChildNodes | Where-Object { $_.NodeType -eq "Element" } | ForEach-Object { [pscustomobject]@{ kind = $_.LocalName; name = $_.GetAttribute("Name"); min = $_.GetAttribute("MinVersion"); maxTested = $_.GetAttribute("MaxVersionTested"); publisher = $_.GetAttribute("Publisher") } })',
              '$caps = @($xml.Package.Capabilities.ChildNodes | Where-Object { $_.NodeType -eq "Element" } | ForEach-Object { $_.LocalName + ":" + $_.GetAttribute("Name") })',
              '$apps = @($xml.Package.Applications.ChildNodes | Where-Object { $_.NodeType -eq "Element" } | ForEach-Object { [pscustomobject]@{ id = $_.GetAttribute("Id"); executable = $_.GetAttribute("Executable"); entryPoint = $_.GetAttribute("EntryPoint") } })',
              '$categories = @($xml.SelectNodes("//*[@Category]") | ForEach-Object { $_.GetAttribute("Category") } | Sort-Object -Unique)',
              '$signature = Get-AuthenticodeSignature -LiteralPath $env:CLAUDE_MSIX_PATH',
              '[pscustomobject]@{ name = $identity.Name; publisher = $identity.Publisher; version = $identity.Version; architecture = $identity.ProcessorArchitecture; dependencies = $deps; capabilities = $caps; applications = $apps; extensionCategories = $categories; signatureStatus = [string]$signature.Status; signer = [string]$signature.SignerCertificate.Subject } | ConvertTo-Json -Depth 5 -Compress',
            ].join('\n')
            const output = execFileSync('powershell.exe', ['-NoLogo', '-NoProfile', '-NonInteractive', '-EncodedCommand', encodeWindowsPowerShellCommand(script)], {
              env: { ...process.env, CLAUDE_MSIX_PATH: packagePath }, encoding: 'utf8', maxBuffer: 4 * 1024 * 1024,
            })
            const manifest = JSON.parse(output.trim())
            manifest.publisherIdFromOurAlgorithm = windowsPackagePublisherId(manifest.publisher)
            console.log(`[manifest] ${JSON.stringify(manifest, null, 2)}`)
            return manifest
          }
          function powershellJson(command) {
            const output = execFileSync('powershell.exe', ['-NoLogo', '-NoProfile', '-NonInteractive', '-Command', command], { encoding: 'utf8', maxBuffer: 4 * 1024 * 1024 }).trim()
            return output ? JSON.parse(output) : null
          }

          async function main() {
            const findings = {}
            const mode = await resolveWindowsCliExecutionMode({ isPackaged: true })
            console.log(`execution mode the app would pick on this runner: ${mode}`)

            console.log('\n=== arm64: download and the app\'s package check only (same-user), no install ===')
            try {
              const result = await installClaudeDesktopFromOfficial({
                architecture: 'arm64', wingetTried: false, fetch: electronLikeFetch, windowsExecutionMode: 'same-user',
                runCommand: loggedRunCommand,
                onProgress: (event) => console.log(`[arm64 progress] ${event.phase} ${event.percent ?? ''} ${event.message}`),
                installPackage: async (packagePath) => { findings.arm64 = dumpManifest(packagePath) },
              })
              console.log(`arm64 passed the app's checks: ${JSON.stringify(result)}`)
            } catch (error) {
              findings.arm64Error = String(error && error.message)
              console.log(`arm64 FAILED: ${findings.arm64Error}`)
            }

            console.log(`\n=== x64: the A014 path end to end (no winget, ${mode}) ===`)
            const runtime = createExternalClientRuntime({
              platform: 'win32', architecture: 'x64', windowsExecutionMode: mode,
              resolveWingetExecutable: async () => ({ executable: null, reason: 'simulated: no winget on this machine, like A014' }),
              fetch: electronLikeFetch, runCommand: loggedRunCommand,
              installClaudeDesktopFromOfficial: (options) => installClaudeDesktopFromOfficial({
                ...options,
                installPackage: async (packagePath, appxOptions) => {
                  findings.x64 = dumpManifest(packagePath)
                  return addWindowsDesktopAppxPackage(packagePath, {
                    ...appxOptions,
                    onElevationRequired: () => { findings.x64ElevationRequired = true; console.log('[x64] Add-AppxPackage asked for elevation (0x80073D28)'); appxOptions.onElevationRequired?.() },
                  })
                },
              }),
            })
            const before = (await runtime.scan({ force: true })).find((entry) => entry.tool === 'claudeDesktop')
            console.log(`before: ${JSON.stringify(before)}`)
            try {
              const status = await runtime.install('claudeDesktop', (event) => console.log(`[x64 progress] ${event.phase} ${event.percent ?? ''} ${event.message}`))
              console.log(`install returned: ${JSON.stringify(status)}`)
            } catch (error) {
              findings.x64Error = String(error && error.message)
              console.log(`x64 install FAILED: ${findings.x64Error}`)
              const original = error && error.originalError
                console.log(`original error: ${String(JSON.stringify(original, Object.getOwnPropertyNames(original || {}))).slice(0, 3000)}`)
            }
            const after = (await runtime.scan({ force: true })).find((entry) => entry.tool === 'claudeDesktop')
            console.log(`after: ${JSON.stringify(after)}`)
            findings.detectedAfterInstall = Boolean(after && after.installed)
            findings.installedPackage = powershellJson('Get-AppxPackage -Name Claude | Select-Object Name, PackageFamilyName, Publisher, Version, Architecture, SignatureKind | ConvertTo-Json -Compress')

            console.log('\n=== summary ===')
            const checks = []
            for (const arch of ['arm64', 'x64']) {
              const manifest = findings[arch]
              if (manifest) checks.push([`${arch} publisher ID from our algorithm equals ${expectedPublisherId}`, manifest.publisherIdFromOurAlgorithm === expectedPublisherId, manifest.publisher])
              else checks.push([`${arch} package reached the install step`, false, findings[`${arch}Error`] || 'no manifest'])
            }
            const family = findings.installedPackage && findings.installedPackage.PackageFamilyName
            checks.push([`Windows registered the family as Claude_${expectedPublisherId}`, family === `Claude_${expectedPublisherId}`, family || 'not installed'])
            checks.push(['the app detects Claude Desktop after the install', findings.detectedAfterInstall, JSON.stringify(after)])
            for (const [name, ok, detail] of checks) console.log(`${ok ? 'PASS' : 'FAIL'}: ${name} (${detail})`)
            console.log(`elevation asked: ${Boolean(findings.x64ElevationRequired)}`)
            if (checks.some(([, ok]) => !ok)) process.exitCode = 1
          }
          main().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE

      - name: Windows' own word on the installed package
        if: always()
        shell: powershell
        run: |
          $package = Get-AppxPackage -Name Claude
          if (-not $package) {
            # 星芒那条路没装上时，绕开星芒的代码直接下、直接装，看 Windows 自己给的家族名。
            $file = Join-Path $env:RUNNER_TEMP 'Claude-x64.msix'
            Invoke-WebRequest -Uri 'https://claude.ai/api/desktop/win32/x64/msix/latest/redirect' -OutFile $file -UseBasicParsing
            (Get-AuthenticodeSignature -LiteralPath $file) | Format-List Status, SignerCertificate
            Add-AppxPackage -Path $file
            $package = Get-AppxPackage -Name Claude
          }
          $package | Format-List Name, PackageFamilyName, Publisher, PublisherId, Version, Architecture, SignatureKind, InstallLocation
