# 一次性探测（docs/COLLABORATION.md §3）：在真的 Windows、Mac 机器上跑一遍 agy 存储桶同步，桶换成内存里的假桶。
# 只读、不挂 environment、不读 secret，开 PR 前删掉。
name: tmp-agy-cos-probe

on:
  push:
    branches: [claude/project-thread-gwf95j]
    paths: ['.github/tmp-agy-cos-probe/**', '.github/workflows/tmp-agy-cos-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node .github/tmp-agy-cos-probe/probe.cjs
