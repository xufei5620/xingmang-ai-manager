# 手动触发的**正式发布**：出包、传更新源、打 tag、建 GitHub Release（2026-09-19
# 应「整条发版搬上 GitHub」的要求添加）。
#
# 与 package-for-testing.yml 的分工：那条出的是给发布者自己装机验收的包，产物只
# 躺在 Actions artifact 里；这条把包送到客户会更新到的地方。
#
# ## 为什么这条工作流可以自动上传，而 release-build.yml 明说不行
#
# `docs/RELEASING.md` 要求「上传文件、修改 Cloudflare R2 或切换线上 latest.yml
# 必须获得产品所有者针对当前版本的明确发布授权」，release-build.yml 因此干脆不配
# 任何对象存储凭据。这条工作流没有取消那道授权，而是把它变成一次点击：上传发生在
# `publish` 作业里，该作业挂 `environment: release`，而 release 环境配了 required
# reviewers —— 运行会停在那里等产品所有者按下 Approve，批准的正是这一次运行、这一个
# 版本。没有那一下，什么都不会被上传。
#
# **所以 release 环境的 required reviewers 是承重墙，不是可选的加固。** 环境不存在
# 时 GitHub 会在首次运行时自动创建一个同名环境，而自动创建出来的环境**没有任何保护
# 规则**，那会把上面这段话变成一句空话。配置步骤见 docs/RELEASING.md 的「CI 发布」。
#
# ## 两个平台，两次批准
#
# macOS 必须用**已发布的那张证书**签：Squirrel.Mac 按已装应用的指定要求校验候选更新，
# 而指定要求钉着叶证书的 SHA-1，换一张证书等于让所有已装的 Mac 客户失去自动更新。所以
# macOS 作业要读 release 环境里的 .p12，也就同样会停下来等一次 Approve。一次发布因此
# 有两次批准：一次放行「用真证书出包」，一次放行「传到更新源」。第一次批准之后什么都
# 还没有对外发生，产物只躺在 Actions artifact 里。
#
# runner 现场生成的一次性身份（见 package-for-testing.yml）**绝不能**进更新源：老用户的
# 机器不认它会拒绝更新，新装用户拿到的又是一个没人认得的发布者。本工作流不走那条路径。
#
# ## Linux：先出包，开关打开才对外发
#
# 选 all 或 linux 时，Linux 的 x64 与 arm64 两个 deb 跟着出包、过门禁、真装真开，
# 产物进这次运行的 Actions artifact（linux-release-<架构>-<版本>），供发布者装机验收。
# **传不传到更新目录和 GitHub Release，看仓库变量 XINGMANG_PUBLISH_LINUX**：不是
# true（包括没建这个变量）时，publish 作业不下载 Linux 的包，客户看不到任何 Linux
# 的东西，Linux 两个作业红了也不挡 Windows / macOS。Linux 第一次对外发要产品所有者
# 点头、先在真机上过一遍，这个变量由他自己在仓库设置里打开（docs/LINUX.md）。Linux
# 不签名，出包作业不读任何 secret、不挂 environment，所以不会多出批准。
#
# ## 上传顺序
#
# `latest.yml` / `latest-mac.yml` / `latest-linux*.yml` 是客户端用来判断"有没有新版本"
# 的清单。它一旦先落地，用户会在安装包还没传完时就被告知有新版本，点下载拿到 404。所以
# 顺序固定为：**先传安装包与 blockmap → 逐字节确认它们能从客户会用的地址下载下来 →
# 最后才覆盖清单**。这三步在下面是三个独立的步骤，顺序由
# scripts/publish-workflow-config.test.cjs 钉住。
name: publish-release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: '要发布的版本号，必须与 package.json 完全一致（防止误发）'
        required: true
        type: string
      platforms:
        description: '这次发布哪些平台的包（all 是全部；Linux 开关没打开时只出包、不上传）'
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

concurrency:
  # 两个并发发布会产出两套同版本却不同哈希的产物，而 latest.yml 里只能有一份 SHA-512。
  group: publish-release
  cancel-in-progress: false

jobs:
  windows-build:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    # 这个作业不读任何 secret，也不挂 environment：它只是出包。凭据集中在 publish
    # 作业里，那里才有需要保护的东西。
    timeout-minutes: 120
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Confirm the requested version matches package.json
        id: metadata
        shell: pwsh
        env:
          # P-26：写进 run 正文的 ${{ }} 是文本替换，不是变量绑定。带单引号的取值
          # 会闭合字符串并执行后面的内容。绑进 env: 再用 $env: 读，PowerShell 看到
          # 的就只是数据。
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          $declared = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($declared -ne $env:CONFIRM_VERSION) {
            Write-Error "版本不一致：package.json 是 $declared，本次触发填的是 $env:CONFIRM_VERSION"
            exit 1
          }
          "version=$declared" >> $env:GITHUB_OUTPUT

      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Install the Chromium the layout tests need
        run: npx --no-install playwright install chromium

      - name: Compile the main process the staging tool needs
        run: node node_modules/typescript/bin/tsc -p tsconfig.electron.json

      - name: Prepare the private acceleration bundle
        env:
          ACCELERATION_BUNDLE_DIR: ${{ runner.temp }}\acceleration-win32-x64
        run: node scripts/prepare-acceleration-bundle.cjs --target win32-x64 --output "$env:ACCELERATION_BUNDLE_DIR"

      - name: Build the installer through the full release gate
        env:
          XINGMANG_ACCELERATION_BUNDLE_DIR: ${{ runner.temp }}\acceleration-win32-x64
        run: npm run release:build:unsigned

      - name: Upload the release artifacts for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ steps.metadata.outputs.version }}
          path: |
            release-${{ steps.metadata.outputs.version }}/*Setup.exe
            release-${{ steps.metadata.outputs.version }}/*.blockmap
            release-${{ steps.metadata.outputs.version }}/latest.yml
          retention-days: 14
          if-no-files-found: error


  macos-build:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-15
    # 这个作业要读发布证书的 .p12，所以也挂 release 环境，也就同样停下来等批准。
    # 批准它放行的只是「用真证书出一份包」，产物仍然只进 Actions artifact。
    environment: release
    timeout-minutes: 150
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Confirm the requested version matches package.json
        id: metadata
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "$CONFIRM_VERSION" ]; then
            echo "::error::版本不一致：package.json 是 $declared，本次触发填的是 $CONFIRM_VERSION"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - run: npm ci --registry=https://registry.npmjs.org/

      # dist:mac:free 自己会跑 npm test，其中的浏览器套件要这个。
      - run: npx --no-install playwright install chromium

      # prepare-acceleration-bundle.cjs 用的是主进程里那套安全读写与内核校验，
      # 所以它跑之前必须先有 dist-electron。少了这一步，它会在第一秒就报
      # 「请先编译主进程」（2026-09-20 首次正式发布就红在这里）。dist:mac:free
      # 随后还会自己跑一次完整的 npm run compile，这一次只是给暂存工具用的。
      - name: Compile the main process the staging tool needs
        run: node node_modules/typescript/bin/tsc -p tsconfig.electron.json

      # 两个架构各准备一份：Mac 的资源清单里记着架构，内核也是按架构的 Mach-O，
      # 混用会被打包前的校验直接拒掉。
      - name: Prepare the private acceleration bundles
        env:
          ACCELERATION_ARM64: ${{ runner.temp }}/acceleration-darwin-arm64
          ACCELERATION_X64: ${{ runner.temp }}/acceleration-darwin-x64
        run: |
          node scripts/prepare-acceleration-bundle.cjs --target darwin-arm64 --output "$ACCELERATION_ARM64"
          node scripts/prepare-acceleration-bundle.cjs --target darwin-x64 --output "$ACCELERATION_X64"

      - name: Import the published signing identity into a throwaway keychain
        env:
          CSC_NAME: ${{ secrets.CSC_NAME }}
          XINGMANG_MAC_SIGNING_P12_BASE64: ${{ secrets.XINGMANG_MAC_SIGNING_P12_BASE64 }}
          XINGMANG_MAC_SIGNING_P12_PASSWORD: ${{ secrets.XINGMANG_MAC_SIGNING_P12_PASSWORD }}
          XINGMANG_MAC_SIGNING_SHA256: ${{ secrets.XINGMANG_MAC_SIGNING_SHA256 }}
          SIGNING_STATE: ${{ runner.temp }}/release-signing-state.json
        run: node scripts/macos-release-keychain.cjs --import --state "$SIGNING_STATE"

      - name: Build and verify the macOS packages with the published identity
        # 签名预检会把这张证书的 SHA-256 跟 scripts/macos-published-signing-identity.cjs
        # 里登记的已发布身份对账，对不上直接失败 —— 换证书就是全部已装 Mac 客户静默
        # 失去自动更新，这一关是专门用来挡住它的。
        timeout-minutes: 75
        env:
          CSC_NAME: ${{ secrets.CSC_NAME }}
          XINGMANG_MAC_SIGNING_SHA256: ${{ secrets.XINGMANG_MAC_SIGNING_SHA256 }}
          ACCELERATION_ARM64: ${{ runner.temp }}/acceleration-darwin-arm64
          ACCELERATION_X64: ${{ runner.temp }}/acceleration-darwin-x64
        run: npm run dist:mac:free -- --acceleration-arm64 "$ACCELERATION_ARM64" --acceleration-x64 "$ACCELERATION_X64"

      - name: Launch the packaged macOS app and require it to stay alive
        # 2026-09-19 那份每一项产物校验都绿的包，装上去一启动就被 dyld 杀掉。读产物
        # 的检查看不见这件事，只有真的把它跑起来才看得见。
        timeout-minutes: 6
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: node e2e/macos-launch-smoke.mjs "release-free-$PACKAGE_VERSION"

      - name: Revoke the signing keychain and its trust setting
        # 失败、取消都要走到这里：用户 keychain 搜索列表是全局状态，不能停在指向一个
        # 已被回收的 keychain 上。
        if: ${{ always() }}
        env:
          SIGNING_STATE: ${{ runner.temp }}/release-signing-state.json
        run: |
          if [ -f "$SIGNING_STATE" ]; then
            node scripts/macos-release-keychain.cjs --release --state "$SIGNING_STATE"
          fi

      - name: Print artifact checksums
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: cat "release-free-$PACKAGE_VERSION/SHA256SUMS"

      - name: Upload the macOS release artifacts for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ steps.metadata.outputs.version }}
          path: |
            release-free-${{ steps.metadata.outputs.version }}/*.dmg
            release-free-${{ steps.metadata.outputs.version }}/*.zip
            release-free-${{ steps.metadata.outputs.version }}/*.blockmap
            release-free-${{ steps.metadata.outputs.version }}/latest-mac.yml
          retention-days: 14
          if-no-files-found: error

  # Linux 的两个出包作业共用一份源码，类型检查和测试在 x64 上跑一遍就够，和
  # package-for-testing 的 Linux 那半一样。跑的是 Windows 那条 release:build:unsigned
  # 里同样会跑的套件；Electron 开发目录冒烟与 ASAR 篡改校验为什么不在 Linux 上跑，见
  # scripts/run-linux-release-package.cjs。
  linux-checks:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Confirm the requested version matches package.json
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "$CONFIRM_VERSION" ]; then
            echo "::error::版本不一致：package.json 是 $declared，本次触发填的是 $CONFIRM_VERSION"
            exit 1
          fi

      - run: npm ci --registry=https://registry.npmjs.org/

      - run: npx --no-install playwright install chromium

      - name: Install Chromium's system libraries
        # 与 quality.yml 的 linux-test 同一个脚本：每次尝试限时，卡住就清掉 apt
        # 残留进程再重试一次。
        timeout-minutes: 13
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network-timeouts > /dev/null
          bash scripts/ci-install-chromium-deps.sh

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:v2

      - run: npm run test:canvas

      - run: npm run test:ui

  linux-build:
    needs: linux-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 用 GitHub 的原生 arm 机器：x64 机器上装不了 arm64 的包，模拟器里起
          # Electron 也说明不了真机。
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # 与 windows-build 一样不读任何 secret、不挂 environment：Linux 不签名，出包不需要
    # 凭据，也就不会多出一次批准。
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Confirm the requested version matches package.json
        id: metadata
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "$CONFIRM_VERSION" ]; then
            echo "::error::版本不一致：package.json 是 $declared，本次触发填的是 $CONFIRM_VERSION"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Build the deb through the Linux release gate
        # 线上清单比本次旧 → 编译 → 出 deb → 加固校验 → deb 与更新清单校验。
        timeout-minutes: 20
        run: npm run release:package:linux -- --arch "$PACKAGE_ARCH"

      # 与 quality.yml 的 linux-package 一样：像客户那样用 apt 装上，再以普通用户真开
      # 一次、确认渲染进程在沙箱里，最后卸干净，过了才上传。只看产物的检查看不见「装
      # 上去打不开」，2026-09-19 的 macOS 包就是这么漏过去的。
      - name: Install the deb the way a customer would
        timeout-minutes: 10
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network-timeouts > /dev/null
          # 绝对路径：apt 会把相对的「目录/文件名」当成包名。
          deb="$(node -p "require('node:path').resolve('release-' + process.env.PACKAGE_VERSION, require('./scripts/linux-artifact-names.cjs').debFileName(process.env.PACKAGE_VERSION, process.env.PACKAGE_ARCH))")"
          sudo timeout --kill-after=20s 240 apt-get update
          sudo timeout --kill-after=20s 300 apt-get install -y --no-install-recommends xvfb "$deb"

      - name: Turn on Ubuntu 24.04's user-namespace restriction
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          fi

      - name: Launch the installed app as an ordinary user and require its sandbox
        timeout-minutes: 5
        run: xvfb-run -a node e2e/linux-deb-smoke.mjs /usr/bin/xingmang-ai-manager

      - name: Run the packaged hardening smoke against the installed app
        timeout-minutes: 6
        run: xvfb-run -a node e2e/packaged-hardening-smoke.mjs /usr/bin/xingmang-ai-manager

      - name: Remove the deb and require that nothing is left behind
        timeout-minutes: 5
        run: |
          sudo timeout --kill-after=20s 240 apt-get remove -y xingmang-ai-manager
          for leftover in /opt/xingmang-ai-manager /usr/bin/xingmang-ai-manager /etc/alternatives/xingmang-ai-manager \
            /usr/share/applications/xingmang-ai-manager.desktop /etc/apparmor.d/xingmang-ai-manager; do
            if [ -e "$leftover" ] || [ -L "$leftover" ]; then
              echo "::error::removing the package left $leftover behind"
              exit 1
            fi
          done

      - name: Print artifact checksums
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: sha256sum "release-$PACKAGE_VERSION"/*.deb "release-$PACKAGE_VERSION"/latest-linux*.yml

      - name: Upload the Linux release artifacts for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-${{ matrix.arch }}-${{ steps.metadata.outputs.version }}
          path: |
            release-${{ steps.metadata.outputs.version }}/*.deb
            release-${{ steps.metadata.outputs.version }}/latest-linux*.yml
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [windows-build, macos-build, linux-checks, linux-build]
    # 只发一个平台时另一个作业是 skipped，而被跳过的 needs 默认会把依赖它的作业也
    # 跳过。这里显式写出「没取消、没有失败的依赖、至少有一个出了包」。
    #
    # Linux 只在仓库变量 XINGMANG_PUBLISH_LINUX 为 true 时算数：关着时 Linux 两个作业
    # 红了也不挡 Windows / macOS，它的包也不会被下载；只选了 linux 又关着，这个作业
    # 整个跳过，连批准都不会要。开着且这次选了 Linux 时，要求 linux-build 成功，而不只
    # 是「没失败」：超时的作业结果是 cancelled 而不是 failure，linux-checks 失败或超时
    # 时 linux-build 又是 skipped，只挡 failure 会让 Windows / macOS 悄悄不带 Linux 发出去。
    # GitHub 比较字符串不分大小写，TRUE、True 也算打开。
    if: >-
      ${{ !cancelled()
      && needs.windows-build.result != 'failure'
      && needs.macos-build.result != 'failure'
      && (vars.XINGMANG_PUBLISH_LINUX != 'true'
        || (inputs.platforms != 'all' && inputs.platforms != 'linux')
        || needs.linux-build.result == 'success')
      && (needs.windows-build.result == 'success' || needs.macos-build.result == 'success'
        || (vars.XINGMANG_PUBLISH_LINUX == 'true' && needs.linux-build.result == 'success')) }}
    # 写更新目录的三条工作流（这里、rollback-release、service-status）共用这个并发组
    # （#492）。它们都是「读线上的清单或状态 → 算出新内容 → 写回去」，交错执行时后写
    # 的会盖掉先写的：回滚刚把清单换回旧版、发布又把新版盖上去，撤回名单里却还写着它。
    # 挂在作业上而不是整条工作流上：出包要一个多小时，不该在这段时间里挡住维护开关。
    concurrency:
      group: update-feed
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 产品所有者按下 Approve 的那一刻，就是 RELEASING.md 要求的「针对当前版本的
    # 明确发布授权」。没有这一行，凭据会对任意分支可见，而 workflow_dispatch 允许
    # 指定任意 ref。
    environment: release
    permissions:
      # 只有这一段需要写权限：打 tag 和建 Release。出包那一段仍是只读。
      contents: write
    timeout-minutes: 60
    env:
      # 出包作业各自核对过 confirm_version 与 package.json 一致，取跑过的那个。
      PACKAGE_VERSION: ${{ needs.windows-build.outputs.version || needs.macos-build.outputs.version || needs.linux-build.outputs.version }}
      # R2 桶里的前缀，也是 R2 凭据被限制到的那个前缀。
      OBJECT_PREFIX: xingmang-manager
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Fail early when the R2 credentials are not configured
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # 只判断非空，绝不回显取值。缺哪个就报哪个的名字，省得对着一条 403 猜。
          missing=""
          for name in R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::release 环境缺少这些 secret：$missing（见 docs/RELEASING.md 的「CI 发布」一节）"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.windows-build.result == 'success' }}
        with:
          name: windows-release-${{ needs.windows-build.outputs.version }}
          path: release-artifacts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.macos-build.result == 'success' }}
        with:
          name: macos-release-${{ needs.macos-build.outputs.version }}
          path: release-artifacts

      # Linux 开关关着时不下载 Linux 的包，下面每一步就都碰不到它：护栏、上传、复核、
      # 清单和 Release 附件都只按 release-artifacts 里实际有什么来做。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ vars.XINGMANG_PUBLISH_LINUX == 'true' && needs.linux-build.result == 'success' }}
        with:
          pattern: linux-release-*-${{ needs.linux-build.outputs.version }}
          merge-multiple: true
          path: release-artifacts

      - name: List what is about to be published
        run: |
          ls -l release-artifacts
          sha256sum release-artifacts/*

      - name: Resolve the address clients will actually fetch from
        id: feed
        # 更新地址随版本迁移过一次（update-release-utils.cjs 的 resolveUpdateUrlForVersion），
        # 在这里抄一份字面量就等于埋下「下次迁移后复核的是旧地址」。
        run: |
          set -euo pipefail
          base=$(node -p "require('./scripts/update-release-utils.cjs').resolveUpdateUrlForVersion(require('./package.json').version)")
          echo "base=${base%/}" >> "$GITHUB_OUTPUT"

      # 第零步：往更新目录写任何东西之前，确认这一版可以发（#493）。放在上传前而不是
      # 收尾：只发 Mac 时原来要到最后打 tag 才发现版本号撞车，线上的 Mac 包那时已经被
      # 同名覆盖了。两件事：
      #   1. tag 已存在且指向别的 commit：同一个版本号已经从别处出过包，停下。先发
      #      Windows、之后在同一个 commit 上补发 Mac 仍然放行。
      #   2. 线上清单已经是这个版本或更高：只有和本次是同一批文件（同一次出包的发布
      #      作业被重跑）才放行，见 scripts/publish-guard.cjs。
      #   3. 这个版本已经在 service-status.json 的撤回名单里（#548）：回退之后重跑它的
      #      发布会把清单又指回坏版本，停下。这里只读状态文件，不改它。
      # 任何一样查不清（GitHub 接口报错、线上文件读不到）都当成「不能发」，不当成
      # 「没有」（#493）：此刻线上还是旧版本，停下没有代价。
      - name: Refuse to overwrite a version that already shipped
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPPED_SHA: ${{ github.sha }}
          PUBLIC_BASE: ${{ steps.feed.outputs.base }}
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"
          # matching-refs 没有这个 tag 时回空列表而不是 404，于是任何报错都只能是真的
          # 查不了（权限、网络、GitHub 故障），不会和「没有这个 tag」混在一起。它按前缀
          # 匹配，所以下面再按完整的 ref 名挑出这一个。
          if ! refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --paginate \
            --jq '.[] | [.ref, .object.type, .object.sha] | join(" ")'); then
            echo "::error::查不了 $tag 是否已存在（不是「没有这个 tag」，是 GitHub 接口报错），确认不了会不会和已发过的版本撞车，线上什么都没改；过几分钟重跑"
            exit 1
          fi
          object=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$tag" '$1 == ref { print $2 " " $3 }')
          existing=''
          case "$object" in
            '') ;;
            'tag '*) existing=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#tag }" --jq '.object.sha') ;;
            'commit '*) existing=${object#commit } ;;
            *) echo "::error::$tag 指向的不是 commit 也不是附注 tag（$object），线上什么都没改"; exit 1 ;;
          esac
          if [ -n "$object" ] && ! printf '%s' "$existing" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::读不出 $tag 指向哪个 commit，线上什么都没改"
            exit 1
          fi
          if [ -n "$existing" ] && [ "$existing" != "$SHIPPED_SHA" ]; then
            echo "::error::$tag 已存在且指向 $existing，与本次出包的 $SHIPPED_SHA 不一致；同一个版本号不能从别的 commit 再发，请先提升版本号。线上什么都没改"
            exit 1
          fi
          # 不用数组传参：macOS 自带的 bash 3.2 在 set -u 下把空数组当成未定义变量。
          status_file=''
          code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/guard-service-status.json" \
            --write-out '%{http_code}' "$PUBLIC_BASE/service-status.json")
          case "$code" in
            200) status_file="$RUNNER_TEMP/guard-service-status.json" ;;
            404) echo "线上还没有 service-status.json，没有撤回名单" ;;
            *) echo "::error::读取线上 service-status.json 失败（HTTP $code），确认不了这一版有没有被撤回，线上什么都没改"; exit 1 ;;
          esac
          guard() {
            if [ -n "$status_file" ]; then
              node scripts/publish-guard.cjs "$@" --status "$status_file"
            else
              node scripts/publish-guard.cjs "$@"
            fi
          }
          # Linux 两个架构同一次发布：只有一份清单，说明另一个架构的包没到，宁可停下也
          # 不要让一半的 Linux 客户看到新版本、另一半看不到。
          linux_manifests=0
          for manifest in latest-linux.yml latest-linux-arm64.yml; do
            if [ -f "release-artifacts/$manifest" ]; then linux_manifests=$((linux_manifests + 1)); fi
          done
          if [ "$linux_manifests" -eq 1 ]; then
            echo "::error::产物里只有一个架构的 Linux 更新清单，x64 与 arm64 必须一起发，线上什么都没改"
            exit 1
          fi
          checked=0
          for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            [ -f "release-artifacts/$manifest" ] || continue
            code=$(curl --silent --show-error --max-time 60 --output "$RUNNER_TEMP/guard-live-$manifest" \
              --write-out '%{http_code}' "$PUBLIC_BASE/$manifest")
            case "$code" in
              200) guard --local "release-artifacts/$manifest" --name "$manifest" --live "$RUNNER_TEMP/guard-live-$manifest" ;;
              404) guard --local "release-artifacts/$manifest" --name "$manifest" ;;
              *) echo "::error::读取线上 $manifest 失败（HTTP $code），确认不了会不会覆盖已发布的版本，线上什么都没改"; exit 1 ;;
            esac
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::产物里没有任何更新清单，线上什么都没改"
            exit 1
          fi

      # 第一步：安装包与 blockmap。这些文件先落地，客户端此刻还不知道有新版本。
      - name: Upload the installers and their blockmaps
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          # 只发一个平台时另一半的通配符不该展开成字面量再被 aws 当成文件名。
          shopt -s nullglob
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          for file in release-artifacts/*Setup.exe release-artifacts/*.dmg release-artifacts/*.zip release-artifacts/*.blockmap release-artifacts/*.deb; do
            case "$file" in
              *Setup.exe) type=application/vnd.microsoft.portable-executable ;;
              *.dmg) type=application/x-apple-diskimage ;;
              *.zip) type=application/zip ;;
              *.deb) type=application/vnd.debian.binary-package ;;
              *) type=application/octet-stream ;;
            esac
            aws s3 cp "$file" "s3://$R2_BUCKET/$OBJECT_PREFIX/$(basename "$file")" \
              --endpoint-url "$endpoint" \
              --content-type "$type"
          done

      # 第二步：确认它们真的能从客户会用的那个地址下载下来，而且字节一致。R2 写入
      # 成功不等于自定义域已经能取到，中间还隔着一层缓存和路由。
      - name: Verify the uploaded files are downloadable and byte-identical
        env:
          PUBLIC_BASE: ${{ steps.feed.outputs.base }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          checked=0
          for file in release-artifacts/*Setup.exe release-artifacts/*.dmg release-artifacts/*.zip release-artifacts/*.blockmap release-artifacts/*.deb; do
            name=$(basename "$file")
            curl --fail --silent --show-error --location --max-time 900 \
              --output "$RUNNER_TEMP/$name" "$PUBLIC_BASE/$name"
            if ! cmp -s "$file" "$RUNNER_TEMP/$name"; then
              echo "::error::$name 上传后的内容与本地产物不一致，已停在覆盖更新清单之前"
              exit 1
            fi
            checked=$((checked + 1))
          done
          # 一个都没核到，说明产物目录是空的或者名字变了，绝不能继续去覆盖清单。
          if [ "$checked" -eq 0 ]; then
            echo "::error::没有任何产物通过下载复核，已停在覆盖更新清单之前"
            exit 1
          fi
          echo "已逐字节复核 $checked 个产物"

      # 第三步，且必须是最后一步：更新清单。到这里为止线上仍是旧版本，随时可以放弃。
      # 每份清单都在这一步，别的步骤一律不许碰它们 —— 顺手 cp 一次就让上面这道顺序
      # 形同虚设，由 scripts/publish-workflow-config.test.cjs 钉住。
      #
      # 覆盖之前先把线上那一份按它自己的版本号备份到 manifests/<版本>/，新清单也同样
      # 留一份：根目录的清单一覆盖就没了，发现坏版本时 rollback-release 工作流要靠这些
      # 备份退回去（docs/SERVICE-STATUS.md「坏版本回退」）。线上读不到（404，第一次发
      # 这个平台）就不备份；别的读取失败一律停下——此刻线上还是旧版本，停下没有代价，
      # 而丢了备份就等于放弃了这一版的回退能力。
      - name: Publish the update manifests
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PUBLIC_BASE: ${{ steps.feed.outputs.base }}
        run: |
          set -euo pipefail
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            [ -f "release-artifacts/$manifest" ] || continue
            code=$(curl --silent --show-error --max-time 60 --output "$RUNNER_TEMP/live-$manifest" \
              --write-out '%{http_code}' "$PUBLIC_BASE/$manifest")
            case "$code" in
              200)
                live=$(node scripts/rollback-release.cjs version --manifest "$RUNNER_TEMP/live-$manifest" --name "$manifest")
                aws s3 cp "$RUNNER_TEMP/live-$manifest" \
                  "s3://$R2_BUCKET/$OBJECT_PREFIX/manifests/$live/$manifest" \
                  --endpoint-url "$endpoint" \
                  --content-type text/yaml \
                  --cache-control 'no-cache'
                echo "已备份线上的 $manifest（$live）"
                ;;
              404) echo "线上还没有 $manifest，这次不用备份" ;;
              *) echo "::error::读取线上 $manifest 失败（HTTP $code），没能备份，已停在覆盖清单之前"; exit 1 ;;
            esac
            aws s3 cp "release-artifacts/$manifest" \
              "s3://$R2_BUCKET/$OBJECT_PREFIX/manifests/$PACKAGE_VERSION/$manifest" \
              --endpoint-url "$endpoint" \
              --content-type text/yaml \
              --cache-control 'no-cache'
          done
          for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            [ -f "release-artifacts/$manifest" ] || continue
            aws s3 cp "release-artifacts/$manifest" \
              "s3://$R2_BUCKET/$OBJECT_PREFIX/$manifest" \
              --endpoint-url "$endpoint" \
              --content-type text/yaml \
              --cache-control 'no-cache'
          done

      - name: Re-verify the published Windows update feed end to end
        # 重新下载远端 latest.yml 和安装程序、重算 SHA-512、确认 blockmap 可访问。
        # 这一步失败就意味着线上处于半发布状态，必须立刻按 RELEASING.md 第 8 节
        # 恢复旧的清单。
        if: ${{ needs.windows-build.result == 'success' }}
        run: npm run update:verify-feed -- --platform=windows

      - name: Re-verify the published macOS update feed end to end
        if: ${{ needs.macos-build.result == 'success' }}
        run: npm run update:verify-feed -- --platform=macos

      - name: Re-verify the published Linux update feed end to end
        # 两个架构一起查：同一次发布、同一次回滚，只查一个的话另一个架构的客户拿到
        # 半发布的清单要等他们点更新才暴露。
        if: ${{ vars.XINGMANG_PUBLISH_LINUX == 'true' && needs.linux-build.result == 'success' }}
        run: npm run update:verify-feed -- --platform=linux

      - name: Tag the commit that shipped and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPPED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"
          # 这一步会跑第二次：platforms 选单个平台时，一个版本要分两次发（先出
          # Windows，之后补发 macOS），tag 与 Release 那时都已经存在。而它排在上传
          # 产物与覆盖清单**之后**——在这里失败，线上已经是新版本了，作业却报红，
          # 正是最难判断的那种半完成状态。所以两件事都写成「没有就建，有就补」。
          #
          # 打标不走 git push。GITHUB_TOKEN 是 GitHub App 令牌，推一个新的 ref 会撞上
          # 「没有 workflows 权限就不许创建或更新 .github/workflows/*」这条 pre-receive
          # 规则——0.2.8 就是这样红在最后一步的，那时更新源已经切过去了。而 workflows
          # 不在 GITHUB_TOKEN 可以被授予的权限里，加不上。`gh release create --target`
          # 由服务端给一个已存在的 commit 建 ref，不引入任何 blob，不受那条规则约束。
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            --jq '[.object.type, .object.sha] | join(" ")' 2> /dev/null || true)
          existing=''
          case "$object" in
            # 附注 tag 的 ref 指向的是 tag 对象，要再解一层才拿得到 commit。
            'tag '*) existing=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#tag }" --jq '.object.sha') ;;
            'commit '*) existing=${object#commit } ;;
          esac
          if [ -n "$existing" ] && [ "$existing" != "$SHIPPED_SHA" ]; then
            # 已存在的 tag 指着别的 commit，说明同一个版本号发过两份不同的产物。
            # 这必须有人来看，不能默默接着传。tag 本身不动：移动一个已发布的 tag
            # 会让所有按 tag 取源码的人拿到和当初不同的东西。
            echo "::error::$tag 已存在且指向 $existing，与本次出包的 $SHIPPED_SHA 不一致"
            exit 1
          fi
          # release-notes.md 里是从 0.1.x 起的全部历史，Release 正文只要这一版那一节。
          node scripts/extract-release-notes.cjs --version "$PACKAGE_VERSION" --output "$RUNNER_TEMP/release-section.md"
          shopt -s nullglob
          assets=(release-artifacts/*Setup.exe release-artifacts/*.dmg release-artifacts/*.deb)
          if gh release view "$tag" > /dev/null 2>&1; then
            # Release 已经在了，只把这一次出的包挂上去。正文不重写：发布者可能已经
            # 在上面补过话，补发一个平台不该把那些改动冲掉。
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              echo "没有可上传的安装包，Release 保持原样"
            fi
          else
            # tag 不在就顺手建在本次实际出包的那个 commit 上，不是「今天的 main」——
            # 提升版本号之后、构建之前可能又合进了别的改动。tag 已经在了就忽略
            # --target，上面已经核过它指向同一个 commit。
            gh release create "$tag" \
              --target "$SHIPPED_SHA" \
              --title "$PACKAGE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-section.md" \
              "${assets[@]}"
          fi
