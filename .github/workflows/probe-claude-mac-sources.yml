# Temporary read-only probe (removed before the PR): which official Claude Mac
# installer files exist now that the update feed lists per-architecture ZIPs.
name: probe-claude-mac-sources

on:
  push:
    branches: [claude/project-thread-fm2a5f]
    paths: ['.github/workflows/probe-claude-mac-sources.yml']

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official feed and package locations
        run: |
          set -u
          for os in 12.7.6 13.6.9 14.7.5 15.5 26.0; do
            for arch in arm64 x64; do
              body=$(curl -sS -m 30 -H 'accept: application/json' "https://api.anthropic.com/api/desktop/darwin/$arch/squirrel/update?device_id=$(cat /proc/sys/kernel/random/uuid)&version=2.19675.0&os_version=$os" || true)
              echo "feed os=$os arch=$arch $(echo "$body" | jq -c '{currentRelease, url: .releases[0].updateTo.url, size: .releases[0].updateTo.size}' 2>/dev/null || echo "$body" | head -c 300)"
            done
          done
          body=$(curl -sS -m 30 -H 'accept: application/json' "https://api.anthropic.com/api/desktop/darwin/arm64/squirrel/update?device_id=$(cat /proc/sys/kernel/random/uuid)&version=2.19675.0&os_version=15.5")
          ver=$(echo "$body" | jq -r .currentRelease)
          rid=$(echo "$body" | jq -r '.releases[0].updateTo.url' | sed -E 's#.*/Claude-([0-9a-f]{40})\.zip#\1#')
          echo "current=$ver release=$rid"
          probe() { printf '%s ' "$1"; curl -sS -m 30 -o /dev/null -I -w '%{http_code} len=%header{content-length} type=%header{content-type}\n' "$1" || echo failed; }
          for a in universal arm64 x64; do
            for e in dmg pkg zip; do
              probe "https://downloads.claude.ai/releases/darwin/$a/$ver/Claude-$rid.$e"
            done
          done
          echo control:
          probe https://downloads.claude.ai/releases/darwin/universal/2.19675.0/Claude-5706e5524dba58b23e105c31c358df8ab0a95852.dmg
          probe https://downloads.claude.ai/releases/darwin/universal/2.19675.0/Claude-5706e5524dba58b23e105c31c358df8ab0a95852.pkg
          for a in universal arm64 x64; do
            for f in dmg pkg zip; do
              printf 'redirect %s/%s ' "$a" "$f"
              curl -sS -m 30 -o /dev/null -D - "https://claude.ai/api/desktop/darwin/$a/$f/latest/redirect" | grep -i -E '^(HTTP|location|cf-mitigated)' | tr '\r\n' '  '; echo
            done
          done
