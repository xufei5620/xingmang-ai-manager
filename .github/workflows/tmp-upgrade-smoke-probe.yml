# 临时：核「旧版升新版」冒烟（upgrade-smoke.yml）在真的 Windows / macOS runner 上能不能从头跑通，核完就删
#
# 只在这条分支的 push 上跑，只读，不挂 environment，不读 secret，不往外写；旧版本只从公开
# Release 下载，假更新源在 runner 本机，旧版本和新版本打开之前就断了外网。被调用的工作流
# 里每个作业都有自己的 timeout-minutes（调用方这一层 GitHub 不许写）。
name: tmp-upgrade-smoke-probe

on:
  push:
    branches:
      - claude/project-thread-r7jv89
    paths-ignore:
      - 'docs/**'
      - 'changes/**'

permissions:
  contents: read

jobs:
  probe:
    uses: ./.github/workflows/upgrade-smoke.yml
    with:
      platforms: macos
