# 临时：核受限语言模式下安装、更新、签名这批 PowerShell 脚本怎么失败、改法管不管用，核完就删
name: tmp-clm-install-probe

on:
  push:
    branches:
      - claude/project-thread-6htq3g

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full language
        shell: cmd
        run: node tmp-clm-install-probe\probe.cjs full
      - name: Turn on the system lockdown debug policy
        shell: powershell
        run: "[Environment]::SetEnvironmentVariable('__PSLockdownPolicy', '4', 'Machine')"
      - name: System lockdown
        shell: cmd
        run: node tmp-clm-install-probe\probe.cjs lockdown
