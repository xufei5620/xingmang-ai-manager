# 临时探针，不合进 main。
#
# 回答一个问题：在 GitHub 托管的 macOS runner 上，要怎么设置信任，才能让
# `security find-identity -v -p codesigning` 列出一张自签的代码签名身份。
#
# 这是 2026-09-20 正式发布连红四次里唯一还没弄清的一环：用户域的
# add-trusted-cert 会挂死（没有图形会话可以确认授权），管理员域返回成功却没能让
# 身份通过策略评估，而管理员域的 remove-trusted-cert 反过来又挂死。这些都只能在
# 真的 runner 上测出来，本地和沙箱都复现不了。
#
# 探针不读任何 secret，用的是现场生成的一次性证书，所以不需要 release 环境的批准，
# 也就不用每试一次就找产品所有者点一次。
name: mac-trust-probe

on:
  push:
    branches:
      - claude/mac-keep-published-signing-identity-9mudp7

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Probe how a self-signed code signing identity becomes valid
        run: |
          set -eu
          work="$RUNNER_TEMP/trust-probe"
          mkdir -p "$work"
          cd "$work"
          name='XingMang Probe Identity'
          p12pass='ProbeP12Pass1234!aA'
          kcpass='ProbeKeychainPass1234!aA'
          kc="$work/probe.keychain-db"

          # 用 printf 而不是 heredoc：YAML 块里的缩进会原样进 heredoc，openssl 的
          # 配置解析器不该被这种事绊倒。
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'prompt = no' \
            '[dn]' "CN = $name" \
            '[ca_ext]' \
            'basicConstraints = critical,CA:TRUE,pathlen:0' \
            'keyUsage = critical,digitalSignature,keyCertSign' \
            'extendedKeyUsage = critical,codeSigning' \
            'subjectKeyIdentifier = hash' > probe.cnf
          cat probe.cnf

          echo "::group::生成与旧发布证书同 profile 的一次性证书"
          /usr/bin/openssl version
          /usr/bin/openssl req -x509 -newkey rsa:2048 -keyout probe.key -out probe.crt \
            -days 7300 -nodes -config probe.cnf -extensions ca_ext
          /usr/bin/openssl x509 -in probe.crt -noout -text | sed -n '/X509v3/,/Signature Algorithm/p'
          /usr/bin/openssl pkcs12 -export -inkey probe.key -in probe.crt -out probe.p12 \
            -name "$name" -passout "pass:$p12pass"
          echo "::endgroup::"

          echo "::group::导入一次性 keychain 并接进用户搜索列表"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import probe.p12 -k "$kc" -f pkcs12 -P "$p12pass" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          orig=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          echo "原始搜索列表：$orig"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$kc" $orig
          security list-keychains -d user
          echo "::endgroup::"

          # 每一条都限时并吞掉失败，目的是把四种设法的结果一次看全，而不是停在第一条。
          # runner 的默认 shell 带 -e，不关掉的话第一条挂死或报错就把整个探针结束了。
          set +e
          # macOS 不带 GNU 的 timeout（第一次跑探针就栽在这里，四条命令全是 127）。
          # perl 的 alarm 是系统自带的等价物。
          attempt() {
            label="$1"; shift
            echo "--- $label"
            start=$(date +%s)
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 25 "$@"
            status=$?
            echo "--- $label 退出码=$status 用时=$(( $(date +%s) - start ))s"
          }
          attempt60() {
            label="$1"; shift
            echo "--- $label"
            start=$(date +%s)
            /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 "$@"
            status=$?
            echo "--- $label 退出码=$status 用时=$(( $(date +%s) - start ))s"
          }
          report() {
            # 不过滤的那份会把被过滤掉的原因附在条目后面，例如
            # (CSSMERR_TP_NOT_TRUSTED)，这正是需要看的东西。
            echo "--- find-identity -p codesigning（不过滤，带过滤原因）"
            security find-identity -p codesigning || true
            echo "--- find-identity -v -p codesigning（这条决定构建能不能选到身份）"
            security find-identity -v -p codesigning || true
            echo "--- verify-cert -p codeSign"
            security verify-cert -c probe.crt -p codeSign || true
          }

          echo "::group::基线：没有任何信任设置"
          report
          echo "::endgroup::"

          # 第二轮已经问出来的（run 35532230420）：
          #   * `sudo -n security add-trusted-cert -d -r trustRoot -p codeSign
          #     -k /Library/Keychains/System.keychain` 立刻返回 0，身份当场变成 valid。
          #   * 但它把证书**又装进了一个 keychain**，于是同一个身份被列出两次，
          #     预检的「匹配项必须恰好一个」就判成歧义——第四轮正式发布红的就是这个。
          #   * 不带 -k 会挂死；`remove-trusted-cert -d` 也会挂死。
          # 这一轮只问三件事。
          echo "::group::A 管理员域，-k 指向本来就装着证书的那个一次性 keychain"
          attempt 'A add' sudo -n security add-trusted-cert -d -r trustRoot -p codeSign \
            -k "$kc" probe.crt
          security dump-trust-settings -d || true
          report
          echo "--- 匹配项数量（必须恰好 1，否则预检判成歧义）"
          security find-identity -v -p codesigning | grep -c 'XingMang Probe Identity' || true
          echo "::endgroup::"

          echo "::group::B 撤销：给足 60 秒，看它到底是慢还是根本回不来"
          attempt60 'B remove -d' sudo -n security remove-trusted-cert -d probe.crt
          security dump-trust-settings -d || true
          echo "::endgroup::"

          echo "::group::C 删掉一次性 keychain 之后，信任设置还剩什么"
          security delete-keychain "$kc" || true
          security dump-trust-settings -d || true
          security find-identity -v -p codesigning || true
          echo "::endgroup::"

          echo "::group::D 轮换后的新 profile（CA:FALSE）该用哪个 -r"
          printf '%s\n' \
            '[req]' 'distinguished_name = dn' 'prompt = no' \
            '[dn]' 'CN = XingMang Probe Leaf' \
            '[leaf_ext]' \
            'basicConstraints = critical,CA:FALSE' \
            'keyUsage = critical,digitalSignature' \
            'extendedKeyUsage = critical,codeSigning' \
            'subjectKeyIdentifier = hash' > leaf.cnf
          /usr/bin/openssl req -x509 -newkey rsa:2048 -keyout leaf.key -out leaf.crt \
            -days 3650 -nodes -config leaf.cnf -extensions leaf_ext
          /usr/bin/openssl pkcs12 -export -inkey leaf.key -in leaf.crt -out leaf.p12 \
            -name 'XingMang Probe Leaf' -passout "pass:$p12pass"
          kc2="$work/probe-leaf.keychain-db"
          security create-keychain -p "$kcpass" "$kc2"
          security set-keychain-settings -lut 21600 "$kc2"
          security unlock-keychain -p "$kcpass" "$kc2"
          security import leaf.p12 -k "$kc2" -f pkcs12 -P "$p12pass" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc2" > /dev/null
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$kc2" $orig
          attempt 'D trustRoot' sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k "$kc2" leaf.crt
          attempt 'D trustAsRoot' sudo -n security add-trusted-cert -d -r trustAsRoot -p codeSign -k "$kc2" leaf.crt
          security find-identity -v -p codesigning || true
          security delete-keychain "$kc2" || true
          echo "::endgroup::"

          echo "::group::收尾"
          # shellcheck disable=SC2086
          security list-keychains -d user -s $orig || true
          echo "::endgroup::"
