# 临时：核对 Claude Desktop 官方安装包里带不带中文界面，核完就删，不进 main。
name: tmp-claude-desktop-locales
on:
  push:
    branches: [claude/project-thread-14ti64]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download and unpack official MSIX
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          curl -sS -o /dev/null -w '%{redirect_url}\n' https://claude.ai/api/desktop/win32/x64/msix/latest/redirect | tee url.txt
          curl -sSfL --retry 3 -o claude.msix https://claude.ai/api/desktop/win32/x64/msix/latest/redirect
          ls -l claude.msix
          mkdir msix && (cd msix && unzip -q ../claude.msix || true) && set +o pipefail
          grep -o 'Version="[^"]*"' msix/AppxManifest.xml | head -2
          find msix -maxdepth 3 -type d | head -40
          find msix -name '*.asar' -o -name '*.zip' | head
          ASAR=$(find msix -name app.asar | head -1)
          echo "asar=$ASAR"
          npx --yes @electron/asar@3.2.10 extract "$ASAR" asar || echo "asar extract partial"
          (ls msix/app/resources/ion-dist | head -30; du -sh msix/app/resources/ion-dist; ls msix/app/locales | head -80) || true
          du -sh asar || true
      - name: Look closer
        run: |
          cd work
          cat url.txt || true
          grep -o 'Identity[^>]*' msix/AppxManifest.xml | head -1 || true
          ls -la msix/app/resources/*.json || true
          python3 - <<'PY2'
          import os, re, glob, json
          p = 'msix/app/resources/zh-Hans.json'
          d = json.load(open(p, encoding='utf-8'))
          print('zh-Hans.json keys', len(d))
          for i, (k, v) in enumerate(d.items()):
              if i >= 40: break
              print(' ', k, '=>', str(v)[:120])
          en = 'msix/app/resources/en-US.json'
          if os.path.exists(en):
              print('en-US.json keys', len(json.load(open(en, encoding='utf-8'))))
          def show(path, rx, width=1200, limit=3):
              data = open(path, 'rb').read()
              n = 0
              for m in re.finditer(rx, data):
                  s = max(0, m.start() - width); e = min(len(data), m.end() + width)
                  print('---', path, m.start())
                  print(data[s:e].decode('utf-8', 'replace'))
                  n += 1
                  if n >= limit: break
          show('asar/.vite/build/index.chunk-eLxLj6qe.js', rb'__gb__2220396766', 2500, 1)
          for f in glob.glob('asar/.vite/build/*.js'):
              data = open(f, 'rb').read()
              if b'zh-Hans.json' in data or b'"zh-Hans"' in data:
                  print('mentions zh-Hans:', f)
          show('asar/.vite/build/index.chunk-lzaSYO3Q.js', rb'getInitialLocale', 1500, 2)
          for f in glob.glob('msix/app/resources/ion-dist/assets/v1/*.js'):
              data = open(f, 'rb').read()
              for m in re.finditer(rb'\[\s*"en-US"\s*,\s*"(?:de-DE|fr-FR|ja-JP|es-419)"[^\]]{0,400}\]', data):
                  print('--- offered list in', f, m.start())
                  print(data[max(0, m.start() - 300):m.end() + 300].decode('utf-8', 'replace'))
          PY2
