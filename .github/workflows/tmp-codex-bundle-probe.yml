name: tmp-codex-bundle-probe
on:
  push:
    branches: [claude/project-thread-ahfg8g]
    paths: [.github/workflows/tmp-codex-bundle-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official Windows package
        run: |
          curl -fsSL https://persistent.oaistatic.com/codex-app-prod/windows-store-update.json | head -c 2000; echo
          curl -fsSL -o pkg.msix https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix
          ls -la pkg.msix
          unzip -l pkg.msix | grep -iE 'app.asar|AppxManifest' | head
          unzip -o -q pkg.msix 'app/resources/app.asar' 'app/resources/app.asar.unpacked/*' AppxManifest.xml || true
          grep -oE '<Identity[^>]*>' AppxManifest.xml
      - name: Extract and search
        run: |
          mkdir -p tool && (cd tool && npm i --silent @electron/asar@3.2.17)
          node -e "
            const asar = require('./tool/node_modules/@electron/asar'); const fs = require('fs'); const path = require('path')
            const archive = 'app/resources/app.asar'
            const files = asar.listPackage(archive).filter((f) => /webview|\\.vite[\\/]build/.test(f))
            let n = 0
            for (const f of files) { const rel = f.replace(/^[\\/]/, ''); try { const data = asar.extractFile(archive, rel); fs.mkdirSync(path.dirname(path.join('out', rel)), { recursive: true }); fs.writeFileSync(path.join('out', rel), data); n++ } catch {} }
            console.log('extracted', n, 'of', files.length)
          "
          ls out | head -30
          cat > search.cjs <<'JS'
          const fs = require('fs'); const path = require('path')
          const root = 'out'
          const files = []
          ;(function walk(d) { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else files.push(p) } })(root)
          console.log('files', files.length)
          console.log('zh/en/locale names:', files.filter((f) => /(^|[\\/])(zh|en)[-_][^\\/]*\.js$|locale/i.test(f)).slice(0, 30).join('\n'))
          const html = files.filter((f) => f.endsWith('.html'))
          for (const f of html) console.log('=== HTML', f, '\n', fs.readFileSync(f, 'utf8').slice(0, 2500))
          const needles = ['72216192', 'enable_i18n', 'locale_source', '__STATSIG__', 'documentElement.lang', 'documentElement.setAttribute("lang"', 'firstInstance', 'modulepreload', 'zh-CN', 'localeOverride']
          for (const needle of needles) {
            let shown = 0
            console.log('\n##### NEEDLE', needle)
            for (const f of files.filter((f) => /\.(js|mjs|cjs)$/.test(f))) {
              const text = fs.readFileSync(f, 'utf8')
              let i = text.indexOf(needle)
              let perFile = 0
              while (i !== -1 && shown < 6 && perFile < 3) {
                console.log('--- ' + f + ' @' + i + '\n' + text.slice(Math.max(0, i - 500), i + 700).replace(/\n/g, ' '))
                shown++; perFile++
                i = text.indexOf(needle, i + needle.length)
              }
              if (shown >= 6) break
            }
          }
          JS
          sed -i 's/^          //' search.cjs
          node search.cjs
