# 临时：核对 Claude Desktop 3.6556.2 的中文界面怎么选、记在哪，核完就删，不进 main。
name: tmp-claude-desktop-zh
on:
  push:
    branches: [claude/project-thread-1qufks]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download and unpack official MSIX
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          curl -sS -o /dev/null -w '%{redirect_url}\n' https://claude.ai/api/desktop/win32/x64/msix/latest/redirect | tee url.txt
          curl -sSfL --retry 3 -o claude.msix https://claude.ai/api/desktop/win32/x64/msix/latest/redirect
          ls -l claude.msix
          mkdir msix && (cd msix && unzip -q ../claude.msix || true)
          grep -o 'Version="[^"]*"' msix/AppxManifest.xml | head -1
          npx --yes @electron/asar@3.2.10 extract msix/app/resources/app.asar asar || echo "asar extract partial"
      - name: Look closer at the 3P page locale
        run: |
          cd work
          python3 - <<'PY'
          import os, re, glob
          def head(title):
              print('\n==========', title)
          def show(path, rx, before=600, after=600, limit=3):
              data = open(path, 'rb').read()
              n = 0
              for m in re.finditer(rx, data):
                  print('---', path, m.start())
                  print(data[max(0, m.start() - before):m.end() + after].decode('utf-8', 'replace'))
                  n += 1
                  if n >= limit: break
          build = sorted(glob.glob('asar/.vite/build/*.js'))
          assets = sorted(glob.glob('msix/app/resources/ion-dist/assets/**/*.js', recursive=True))
          head('shell: where ion-dist is loaded')
          for f in build:
              if b'ion-dist' in open(f, 'rb').read():
                  show(f, rb'ion-dist', 500, 400, 3)
          head('shell: the store that keeps locale')
          for f in build:
              if b'name:"config"' in open(f, 'rb').read():
                  show(f, rb'name:"config"', 900, 400, 1)
          head('shell: preload electronIntl')
          for f in sorted(glob.glob('asar/.vite/build/**/*.js', recursive=True)):
              if b'electronIntl' in open(f, 'rb').read():
                  show(f, rb'electronIntl', 300, 500, 2)
          head('page: locale logic after spa:locale')
          for f in assets:
              data = open(f, 'rb').read()
              i = data.find(b'Rv="spa:locale"')
              if i < 0:
                  i = data.find(b'"spa:locale"')
              if i >= 0:
                  print(f, i)
                  print(data[i:i + 7000].decode('utf-8', 'replace'))
                  break
          head('page: catalog loading')
          shown = 0
          for f in assets:
              data = open(f, 'rb').read()
              for m in re.finditer(rb'i18n/', data):
                  print('---', f, m.start())
                  print(data[max(0, m.start() - 500):m.end() + 400].decode('utf-8', 'replace'))
                  shown += 1
                  break
              if shown >= 5: break
          head('page: other zh-Hans mentions')
          for f in assets:
              if 'c1a07bb31' in f: continue
              data = open(f, 'rb').read()
              if b'zh-Hans' in data:
                  show(f, rb'zh-Hans', 300, 300, 2)
          PY
