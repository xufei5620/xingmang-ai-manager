# 临时：核 Claude 桌面端把 Claude Code 程序和 Cowork 工作区放在哪、怎么核对，能不能由星芒先放好（yoyo 11-03「开探测」），核完就删。
name: tmp-claude-desktop-components

on:
  push:
    branches: [claude/tmp-claude-components-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the current Windows x64 MSIX
        run: |
          set -euo pipefail
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' https://claude.ai/api/desktop/win32/x64/msix/latest/redirect)
          echo "redirect: $loc"
          case "$loc" in https://downloads.claude.ai/releases/win32/x64/*.msix) ;; *) echo "unexpected redirect"; exit 1 ;; esac
          curl -fsSL --max-time 600 -o claude.msix "$loc"
          ls -l claude.msix
          mkdir msix && (cd msix && unzip -q ../claude.msix)
          find msix -maxdepth 3 -type d | head -40
          find msix -name '*.asar' -printf '%s %p\n'

      - name: Extract app.asar
        run: |
          set -euo pipefail
          # MSIX 包里的文件名是百分号编码的（@ 写成 %40），解包器按原名找 unpacked 文件会找不到。
          find msix -depth -name '*%*' | while IFS= read -r f; do
            d=$(dirname "$f"); b=$(basename "$f")
            n=$(python3 -I -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' "$b")
            [ "$b" = "$n" ] || mv "$f" "$d/$n"
          done
          asar=$(find msix -name app.asar | head -1)
          npx --yes @electron/asar@3.4.1 extract "$asar" app || echo "some files could not be extracted"
          npx --yes @electron/asar@3.4.1 extract msix/app/resources/ion-dist.asar ion || echo "ion: some files could not be extracted"
          find ion -maxdepth 2 | head -30
          find app -maxdepth 3 -type f -name '*.js' -printf '%s %p\n' | sort -n | tail -20
          find app -maxdepth 2 -name package.json -exec sh -c 'echo "== $1"; head -c 600 "$1"; echo' _ {} \;

      - name: Where the components come from and where they go
        run: |
          set -uo pipefail
          # grep 的 .{0,400} 在压缩成一行的大文件上会卡死（第二次跑了五分钟没出来），改用 node 按位置截取。
          cat > "$RUNNER_TEMP/find.mjs" <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'
          const root = process.argv[2]
          const files = []
          function walk(dir, inModules) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                if (entry.name === 'node_modules') { walkModules(full); continue }
                walk(full, inModules)
              } else if (/\.(m?js|cjs|json)$/.test(entry.name)) files.push(full)
            }
          }
          function walkModules(dir) {
            const names = fs.readdirSync(dir)
            console.log('node_modules in ' + path.relative(root, dir) + ': ' + names.join(' '))
            if (names.includes('@ant')) {
              console.log('@ant: ' + fs.readdirSync(path.join(dir, '@ant')).join(' '))
              walk(path.join(dir, '@ant'), true)
            }
          }
          walk(root, false)
          const sized = files.map((f) => [fs.statSync(f).size, f]).sort((a, b) => b[0] - a[0])
          console.log('files: ' + files.length)
          for (const [size, f] of sized.slice(0, 20)) console.log(size + ' ' + path.relative(root, f))
          const texts = new Map(files.map((f) => [f, fs.readFileSync(f, 'utf8')]))
          const patterns = [
            ['claude-code-releases', /claude-code-releases/g, 9000],
            ['vm_bundles', /vm_bundles/g, 9000],
            ['vms/linux', /vms\/linux/g, 6000],
            ['rootfs', /rootfs/g, 6000],
            ['"claude-code" path segment', /["'`]claude-code["'`]/g, 6000],
            ['Claude-3p', /Claude-3p/g, 4000],
            ['checksum', /checksum/gi, 9000],
            ['sha256', /sha256/gi, 6000],
            ['zst', /\.zst\b|zstd/g, 6000],
            ['claude.exe', /claude\.exe/g, 6000],
            ['win32-x64', /win32-x64/g, 4000],
            ['downloads.claude.ai', /downloads\.claude\.ai/g, 9000],
            ['Host Claude Code binary', /Host Claude Code binary/g, 4000],
            ['buildId', /build[_-]?[iI][dD]\b/g, 4000],
            ['version names', /[cC]laude[cC]ode[vV]ersion|cliVersion|ccVersion|CLAUDE_CODE_VERSION/g, 6000],
          ]
          for (const [label, re, cap] of patterns) {
            console.log('\n######## ' + label)
            let printed = 0
            let count = 0
            for (const [f, t] of texts) {
              for (const m of t.matchAll(re)) {
                count++
                if (printed >= cap) continue
                const slice = t.slice(Math.max(0, m.index - 350), m.index + m[0].length + 350)
                console.log('--- ' + path.relative(root, f) + ' @' + m.index + '\n' + slice)
                printed += slice.length
              }
            }
            console.log('(matches: ' + count + ')')
          }
          const envNames = new Set()
          for (const t of texts.values()) for (const m of t.matchAll(/CLAUDE_CODE_[A-Z0-9_]+/g)) envNames.add(m[0])
          console.log('\n######## CLAUDE_CODE_* names\n' + [...envNames].sort().join(' '))
          const versions = new Set()
          for (const t of texts.values()) for (const m of t.matchAll(/claude-code-releases\/(\d+\.\d+\.\d+)/g)) versions.add(m[1])
          fs.writeFileSync(process.env.RUNNER_TEMP + '/cli-version', [...versions][0] ?? '')
          console.log('\n######## pinned versions: ' + [...versions].join(' '))
          EOF
          node "$RUNNER_TEMP/find.mjs" "$PWD/app"
          echo; echo "######## ion-dist (only a quick look)"
          find ion -maxdepth 2 | head -20

      - name: Compare the CLI the app downloads with the npm package of the same version
        run: |
          set -uo pipefail
          ver=$(cat "$RUNNER_TEMP/cli-version" 2>/dev/null || true)
          if [ -z "$ver" ]; then
            ver=$(npm view @anthropic-ai/claude-code-win32-x64 version --registry=https://registry.npmjs.org/)
            echo "app pins no version literally; using latest npm version $ver"
          fi
          echo "version: $ver"
          echo "######## manifest"
          curl -fsSL --max-time 60 "https://downloads.claude.ai/claude-code-releases/$ver/manifest.json" | head -c 4000 || echo "no manifest.json at downloads.claude.ai"
          echo
          curl -fsSL --max-time 600 -o claude.exe.zst "https://downloads.claude.ai/claude-code-releases/$ver/win32-x64/claude.exe.zst" || { echo "claude.exe.zst download failed"; }
          if [ -f claude.exe.zst ]; then zstd -dq claude.exe.zst -o claude-desktop.exe; ls -l claude.exe.zst claude-desktop.exe; sha256sum claude.exe.zst claude-desktop.exe; fi
          curl -fsSL --max-time 600 -o claude-plain.exe "https://downloads.claude.ai/claude-code-releases/$ver/win32-x64/claude.exe" && { ls -l claude-plain.exe; sha256sum claude-plain.exe; } || echo "no plain claude.exe"
          npm pack --silent "@anthropic-ai/claude-code-win32-x64@$ver" --registry=https://registry.npmjs.org/ >/dev/null
          mkdir npmcli && tar -xzf anthropic-ai-claude-code-win32-x64-$ver.tgz -C npmcli
          echo "npm package files:"; find npmcli -type f -printf '%s %p\n' | sort -n | tail -8
          find npmcli -type f -name '*.exe' -exec sha256sum {} \;
