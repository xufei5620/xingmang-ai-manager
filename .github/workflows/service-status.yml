# 改更新目录上的 service-status.json：打开或关闭「服务正在维护」提示、撤回坏版本、
# 分批放量。要把线上退回旧版本，用 rollback-release 工作流（它会顺带在这里撤回）。
# 客户端怎么读见 electron/service-status.ts，一步步的操作见 docs/SERVICE-STATUS.md。
#
# 只改这次选了或填了的那几项，其余字段照线上原样保留。凭据与正式发布共用
# release 环境（同一个 R2 前缀），所以每次运行都要产品所有者点一次 Approve。
name: service-status

on:
  workflow_dispatch:
    inputs:
      maintenance:
        description: 维护提示
        type: choice
        default: 'keep: 不改'
        options:
          - 'keep: 不改'
          - 'on: 打开（客户端显示「服务正在维护」）'
          - 'off: 关闭'
      message:
        description: 给用户看的一句话（只在打开时用，可留空；最多 200 字）
        type: string
        required: false
      until:
        description: 到这个北京时间自动当维护结束（可留空，例 2026-09-24 23:00）
        type: string
        required: false
      bad_versions:
        description: 撤回的版本（留空不改；写 0.2.10 加入名单，-0.2.10 移出，none 清空）
        type: string
        required: false
      rollout:
        description: 分批放量（留空不改；写「0.2.11 20」表示先给两成电脑，none 表示全部放开）
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: service-status
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      OBJECT_PREFIX: xingmang-manager
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Fail early when the R2 credentials are not configured
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::release 环境缺少这些 secret：$missing（见 docs/SERVICE-STATUS.md）"
            exit 1
          fi

      - name: Resolve the address clients read the status file from
        id: feed
        run: |
          set -euo pipefail
          base=$(node -p "require('./scripts/update-release-utils.cjs').resolveUpdateUrlForVersion(require('./package.json').version)")
          echo "url=${base%/}/service-status.json" >> "$GITHUB_OUTPUT"

      # 线上那份读不到（404）就从空白开始；别的失败一律停下，免得用一份空白的
      # 覆盖掉线上别的开关。
      - name: Fetch the status file that is live now
        env:
          STATUS_URL: ${{ steps.feed.outputs.url }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/current.json" --write-out '%{http_code}' "$STATUS_URL")
          case "$code" in
            200) echo "线上现有内容："; cat "$RUNNER_TEMP/current.json"; echo ;;
            404) echo "线上还没有状态文件，从空白开始"; rm -f "$RUNNER_TEMP/current.json" ;;
            *) echo "::error::读取线上状态文件失败（HTTP $code），为免覆盖别的开关，这次不改"; exit 1 ;;
          esac

      # 输入一律经环境变量传给脚本，不拼进命令行：「给用户看的一句话」是自由文本。
      - name: Build the new status file
        env:
          MAINTENANCE_CHOICE: ${{ inputs.maintenance }}
          MAINTENANCE_MESSAGE: ${{ inputs.message }}
          MAINTENANCE_UNTIL: ${{ inputs.until }}
          BAD_VERSIONS: ${{ inputs.bad_versions }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          set -euo pipefail
          node scripts/service-status.cjs \
            --current "$RUNNER_TEMP/current.json" \
            --output "$RUNNER_TEMP/service-status.json" \
            --maintenance "${MAINTENANCE_CHOICE%%:*}" \
            --message "$MAINTENANCE_MESSAGE" \
            --until "$MAINTENANCE_UNTIL" \
            --bad-versions "$BAD_VERSIONS" \
            --rollout "$ROLLOUT"
          echo "将要发布："
          cat "$RUNNER_TEMP/service-status.json"

      - name: Upload the status file
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp "$RUNNER_TEMP/service-status.json" \
            "s3://$R2_BUCKET/$OBJECT_PREFIX/service-status.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache'

      - name: Verify clients now read exactly what was uploaded
        env:
          STATUS_URL: ${{ steps.feed.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/published.json" "$STATUS_URL"
          if ! cmp -s "$RUNNER_TEMP/service-status.json" "$RUNNER_TEMP/published.json"; then
            echo "::error::上传成功，但客户会用的地址读到的不是这一份（可能是缓存），请过几分钟重跑一次核对"
            exit 1
          fi
          echo "客户端下一次读取（最迟 15 分钟、维护期间 5 分钟）就会看到这一份"
