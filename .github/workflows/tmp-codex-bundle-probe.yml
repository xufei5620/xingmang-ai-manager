name: tmp-codex-bundle-probe
on:
  push:
    branches: [claude/project-thread-ahfg8g]
    paths: [.github/workflows/tmp-codex-bundle-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official Windows package
        run: |
          curl -fsSL https://persistent.oaistatic.com/codex-app-prod/windows-store-update.json | head -c 2000; echo
          curl -fsSL -o pkg.msix https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix
          ls -la pkg.msix
          unzip -l pkg.msix | grep -iE 'app.asar|AppxManifest' | head
          unzip -o -q pkg.msix 'app/resources/app.asar' 'app/resources/app.asar.unpacked/*' AppxManifest.xml || true
          grep -oE '<Identity[^>]*>' AppxManifest.xml
      - name: Extract and search
        run: |
          npx --yes @electron/asar@3.2.17 extract app/resources/app.asar out
          ls out | head -30
          A=$(find out -type d -path '*webview/assets' | head -1); echo "assets=$A"
          ls "$A" | wc -l
          ls "$A" | grep -iE '^zh|^en|locale' | head -20
          echo '--- index.html'; find out -path '*webview/index.html' -exec cat {} \; | head -c 3000; echo
          echo '--- files with 72216192'; grep -l 72216192 "$A"/*.js || true
          for f in $(grep -l 72216192 "$A"/*.js); do echo "=== $f"; grep -oE '.{0,700}72216192.{0,900}' "$f" | head -5; done
          echo '--- enable_i18n'; for f in $(grep -l enable_i18n "$A"/*.js); do echo "=== $f"; grep -oE '.{0,500}enable_i18n.{0,500}' "$f" | head -6; done
          echo '--- STATSIG globals'; grep -oE '.{0,200}(__STATSIG__|globalThis\.statsig|window\.Statsig).{0,200}' "$A"/*.js | head -8
          echo '--- documentElement.lang'; grep -oE '.{0,300}documentElement\.lang.{0,300}' "$A"/*.js | head -6
          echo '--- zh-CN chunk refs'; grep -oE '.{0,300}zh-CN-[A-Za-z0-9_-]+\.js.{0,300}' "$A"/*.js | head -6
          echo '--- modulepreload'; grep -oE '.{0,200}modulepreload.{0,200}' "$A"/*.js | head -4
          echo '--- electronBridge'; grep -lE 'electronBridge' "$A"/*.js | head -3; grep -rlE 'electronBridge' out/.vite 2>/dev/null | head -3
