# 官方 Claude 桌面备用离线包按原生平台验证，单工作流内串行维护同一公开索引。
name: sync-claude-official-cos

on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 要同步的官方备用安装包
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

concurrency:
  group: cos-claude-official-publish
  cancel-in-progress: false

jobs:
  select:
    if: ${{ github.repository == 'xufei5620/xingmang-ai-manager' && github.ref == 'refs/heads/main' && vars.XINGMANG_COS_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - id: platforms
        env:
          PLATFORM_REQUEST: ${{ inputs.platforms || 'all' }}
        run: |
          node <<'NODE'
          const choices = {
            windows: { platform: 'windows', runner: 'windows-latest' },
            macos: { platform: 'macos', runner: 'macos-latest' },
            linux: { platform: 'linux', runner: 'ubuntu-latest' },
          }
          const selected = process.env.PLATFORM_REQUEST
          const include = selected === 'all' ? Object.values(choices) : choices[selected] ? [choices[selected]] : null
          if (!include) throw new Error('不支持的同步平台')
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`)
          NODE

  sync:
    needs: select
    if: ${{ github.repository == 'xufei5620/xingmang-ai-manager' && github.ref == 'refs/heads/main' && vars.XINGMANG_COS_SYNC_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: cos-sync
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Synchronize verified official Claude backup packages to Tencent COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET || 'xingmang-downloads-1342302199' }}
          COS_REGION: ${{ vars.COS_REGION || 'ap-shanghai' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          CLAUDE_SYNC_PLATFORMS: ${{ matrix.platform }}
        run: node scripts/sync-claude-official-cos.cjs
