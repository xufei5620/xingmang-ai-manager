# 临时：核加速节点（bundled-acceleration/profile.yaml 里 ktmhyld.com 那 12 条）还活不活：域名解析、域名注册状态、QUIC 握手和证书。不发密码、不走流量。核完就删。
name: tmp acceleration node probe

on:
  push:
    branches: [claude/project-thread-t9ypg8]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Domain registration (RDAP)
        run: |
          curl -sS --max-time 20 https://rdap.verisign.com/com/v1/domain/ktmhyld.com \
            | jq '{status, events: [.events[] | {eventAction, eventDate}], nameservers: [.nameservers[]?.ldhName]}' \
            || echo 'RDAP lookup failed'

      - name: DNS from several resolvers
        run: |
          for resolver in default 8.8.8.8 1.1.1.1 223.5.5.5 119.29.29.29; do
            echo "== resolver $resolver"
            at=""; [ "$resolver" = default ] || at="@$resolver"
            echo "NS: $(dig +short +time=3 +tries=2 NS ktmhyld.com $at | tr '\n' ' ')"
            for host in hk1 tw1 sg1 jp1 kr1 my1 th1 mc1 us1; do
              status=$(dig +time=3 +tries=2 A $host.ktmhyld.com $at | sed -n 's/.*status: \([A-Z]*\).*/\1/p')
              echo "$host.ktmhyld.com $status $(dig +short +time=3 +tries=2 A $host.ktmhyld.com $at | tr '\n' ' ')"
            done
          done

      - name: QUIC handshake with every node (no auth)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet aioquic==1.2.0
          cat > "$RUNNER_TEMP/quic_probe.py" <<'PY'
          # Read-only liveness check for the bundled Hysteria2 nodes: resolve the name,
          # complete a QUIC/TLS handshake (no auth, no proxied traffic) and print the
          # certificate the server presents. Never reads node passwords.
          import asyncio
          import socket
          import ssl
          import sys
          
          from aioquic.asyncio.protocol import QuicConnectionProtocol
          from aioquic.quic.configuration import QuicConfiguration
          from aioquic.quic.connection import QuicConnection
          
          TARGETS = [
              ('hk1.ktmhyld.com', 18385, 'hk1.ktmhyld.com'),
              ('tw1.ktmhyld.com', 18386, 'tw1.ktmhyld.com'),
              ('tw1.ktmhyld.com', 18386, 'tw2.ktmhyld.com'),
              ('sg1.ktmhyld.com', 18383, 'sg1.ktmhyld.com'),
              ('sg1.ktmhyld.com', 18383, 'sg2.ktmhyld.com'),
              ('jp1.ktmhyld.com', 18385, 'jp1.ktmhyld.com'),
              ('kr1.ktmhyld.com', 18385, 'kr1.ktmhyld.com'),
              ('kr1.ktmhyld.com', 18385, 'kr2.ktmhyld.com'),
              ('my1.ktmhyld.com', 18385, 'my1.ktmhyld.com'),
              ('th1.ktmhyld.com', 18385, 'th1.ktmhyld.com'),
              ('mc1.ktmhyld.com', 18385, 'mc1.ktmhyld.com'),
              ('us1.ktmhyld.com', 18387, 'us1.ktmhyld.com'),
          ]
          
          
          def describe(cert):
              if cert is None:
                  return 'no certificate'
              try:
                  from cryptography.x509 import DNSName, SubjectAlternativeName
                  sans = cert.extensions.get_extension_for_class(SubjectAlternativeName).value.get_values_for_type(DNSName)
              except Exception:
                  sans = []
              return (f'subject={cert.subject.rfc4514_string()} issuer={cert.issuer.rfc4514_string()} '
                      f'notBefore={cert.not_valid_before_utc:%Y-%m-%d} notAfter={cert.not_valid_after_utc:%Y-%m-%d} '
                      f'san={",".join(sans[:4])}')
          
          
          async def handshake(address, port, sni, timeout):
              # Plain IPv4 socket: aioquic's own connect() insists on a dual-stack IPv6 one.
              config = QuicConfiguration(is_client=True, alpn_protocols=['h3'], verify_mode=ssl.CERT_NONE, server_name=sni)
              connection = QuicConnection(configuration=config)
              loop = asyncio.get_running_loop()
              transport, protocol = await loop.create_datagram_endpoint(
                  lambda: QuicConnectionProtocol(connection), family=socket.AF_INET, local_addr=('0.0.0.0', 0))
              try:
                  async with asyncio.timeout(timeout):
                      protocol.connect((address, port))
                      await protocol.wait_connected()
                      return connection.tls._peer_certificate
              finally:
                  protocol.close()
                  transport.close()
          
          
          async def probe(host, port, sni, timeout):
              try:
                  addresses = sorted({info[4][0] for info in socket.getaddrinfo(host, port, socket.AF_INET, socket.SOCK_DGRAM)})
              except socket.gaierror as error:
                  return f'{host}:{port} sni={sni} DNS-FAIL {error}'
              last = ''
              for attempt in (1, 2):
                  try:
                      cert = await handshake(addresses[0], port, sni, timeout)
                      return f'{host}:{port} sni={sni} ip={",".join(addresses)} QUIC-OK attempt={attempt} {describe(cert)}'
                  except TimeoutError:
                      last = 'QUIC-TIMEOUT (no handshake reply)'
                  except Exception as error:
                      last = f'QUIC-ERROR {type(error).__name__}: {error}'
              return f'{host}:{port} sni={sni} ip={",".join(addresses)} {last}'
          
          
          async def main():
              targets = TARGETS
              if len(sys.argv) == 4:
                  targets = [(sys.argv[1], int(sys.argv[2]), sys.argv[3])]
              for host, port, sni in targets:
                  print(await probe(host, port, sni, 8), flush=True)
          
          
          asyncio.run(main())
          PY
          "$RUNNER_TEMP/venv/bin/python" -I "$RUNNER_TEMP/quic_probe.py"
