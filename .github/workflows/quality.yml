name: quality

# A branch push with an open pull request used to fire both events and run the
# whole matrix twice. pull_request already reruns on every push to the branch,
# so restricting push to main keeps identical coverage at half the minutes.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', '.gitattributes', '.editorconfig']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', '.gitattributes', '.editorconfig']

# Superseded runs are wasted minutes, and one run bills ~49 of them. main is
# included: while the project is pre-release, a burst of merges would otherwise
# run the full matrix once per merge with no way to supersede an obsolete one,
# and only the final state actually needs validating. Revisit when releases
# start — then every main commit wants its own verified run so a bad one can be
# bisected out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx --no-install playwright install chromium
      - run: npm run typecheck
      - run: npm run test:windows
      - run: npm run compile
      - name: Run isolated dashboard smoke test
        run: node e2e/electron-ci-smoke.mjs
      - run: node e2e/onboarding-smoke.mjs
      - run: npm run build:win:ci
      - run: node scripts/verify-packaged-hardening.cjs release/win-unpacked
      - run: node e2e/packaged-hardening-smoke.mjs "release/win-unpacked/星芒AI管理工具.exe"
      - run: node e2e/asar-tamper-smoke.mjs release/win-unpacked
      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-smoke-artifacts
          path: |
            artifacts/*.png
            artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

  macos-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx --no-install playwright install chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mac:free-signing
      - run: npm run test:mac:dev-origin
      # 147s of this job's 227s, and macOS bills at 10x, so this single step is
      # roughly half the cost of every run in the repository. It answers "can we
      # still produce a signed macOS app", which is a release question — the
      # cross-platform regressions a pull request needs to catch are already
      # covered by the typecheck, test and dev-origin steps above.
      - name: Build and verify free macOS distribution with ephemeral signing
        if: github.event_name == 'push'
        run: node scripts/run-macos-free-build.cjs --ci-temporary-signing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm run audit:production
      - name: Report development dependency advisories
        run: npm run audit:ci
