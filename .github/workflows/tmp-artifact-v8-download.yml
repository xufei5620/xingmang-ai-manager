# 临时：核 upload-artifact v7.0.2 传、download-artifact v8.0.2 收，照 publish-release.yml 那几步的写法，下到的文件和传上去的一字不差，核完就删。
#
# publish-release.yml 是全仓唯一用 download-artifact 的地方，PR 上不跑；不先看一眼，第一次真跑就是发版。
# 这里不签出代码、不读 secret、不挂 environment、不往外写，结果只看日志。见 docs/COLLABORATION.md「一次性探测工作流」。
name: tmp-artifact-v8-download

on:
  push:
    branches: [claude/fix-1088-actions-node24-6ril52]

permissions:
  contents: read

env:
  PROBE_VERSION: 0.0.0-probe

jobs:
  windows-upload:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Make files shaped like the Windows release output
        shell: bash
        run: |
          dir="release-$PROBE_VERSION"
          mkdir -p "$dir"
          head -c 3000000 /dev/zero | tr '\0' 'w' > "$dir/XingMang-AI-Manager-$PROBE_VERSION-Setup.exe"
          head -c 4000 /dev/zero | tr '\0' 'b' > "$dir/XingMang-AI-Manager-$PROBE_VERSION-Setup.exe.blockmap"
          printf 'version: %s\n' "$PROBE_VERSION" > "$dir/latest.yml"
          printf 'not part of the release\n' > "$dir/builder-debug.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ env.PROBE_VERSION }}
          path: |
            release-${{ env.PROBE_VERSION }}/*Setup.exe
            release-${{ env.PROBE_VERSION }}/*.blockmap
            release-${{ env.PROBE_VERSION }}/latest.yml
          retention-days: 1
          if-no-files-found: error

  macos-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Make files shaped like the macOS release output
        run: |
          dir="release-free-$PROBE_VERSION"
          mkdir -p "$dir"
          head -c 2000000 /dev/zero | tr '\0' 'd' > "$dir/XingMang-AI-Manager-$PROBE_VERSION-arm64.dmg"
          head -c 2000000 /dev/zero | tr '\0' 'z' > "$dir/XingMang-AI-Manager-$PROBE_VERSION-arm64.zip"
          head -c 4000 /dev/zero | tr '\0' 'm' > "$dir/XingMang-AI-Manager-$PROBE_VERSION-arm64.zip.blockmap"
          printf 'version: %s\n' "$PROBE_VERSION" > "$dir/latest-mac.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-${{ env.PROBE_VERSION }}
          path: |
            release-free-${{ env.PROBE_VERSION }}/*.dmg
            release-free-${{ env.PROBE_VERSION }}/*.zip
            release-free-${{ env.PROBE_VERSION }}/*.blockmap
            release-free-${{ env.PROBE_VERSION }}/latest-mac.yml
          retention-days: 1
          if-no-files-found: error

  linux-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Make files shaped like the Linux release output
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          dir="release-$PROBE_VERSION"
          mkdir -p "$dir"
          head -c 1500000 /dev/zero | tr '\0' 'l' > "$dir/XingMang-AI-Manager-$PROBE_VERSION-$ARCH.deb"
          if [ "$ARCH" = x64 ]; then manifest=latest-linux.yml; else manifest=latest-linux-arm64.yml; fi
          printf 'version: %s\narch: %s\n' "$PROBE_VERSION" "$ARCH" > "$dir/$manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-${{ matrix.arch }}-${{ env.PROBE_VERSION }}
          path: |
            release-${{ env.PROBE_VERSION }}/*.deb
            release-${{ env.PROBE_VERSION }}/latest-linux*.yml
          retention-days: 1
          if-no-files-found: error

  download:
    needs: [windows-upload, macos-upload, linux-upload]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-${{ env.PROBE_VERSION }}
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-${{ env.PROBE_VERSION }}
          path: release-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-release-*-${{ env.PROBE_VERSION }}
          merge-multiple: true
          path: release-artifacts
      - name: Everything landed flat and byte for byte
        run: |
          v="$PROBE_VERSION"
          mkdir expected
          head -c 3000000 /dev/zero | tr '\0' 'w' > "expected/XingMang-AI-Manager-$v-Setup.exe"
          head -c 4000 /dev/zero | tr '\0' 'b' > "expected/XingMang-AI-Manager-$v-Setup.exe.blockmap"
          printf 'version: %s\n' "$v" > expected/latest.yml
          head -c 2000000 /dev/zero | tr '\0' 'd' > "expected/XingMang-AI-Manager-$v-arm64.dmg"
          head -c 2000000 /dev/zero | tr '\0' 'z' > "expected/XingMang-AI-Manager-$v-arm64.zip"
          head -c 4000 /dev/zero | tr '\0' 'm' > "expected/XingMang-AI-Manager-$v-arm64.zip.blockmap"
          printf 'version: %s\n' "$v" > expected/latest-mac.yml
          head -c 1500000 /dev/zero | tr '\0' 'l' > "expected/XingMang-AI-Manager-$v-x64.deb"
          head -c 1500000 /dev/zero | tr '\0' 'l' > "expected/XingMang-AI-Manager-$v-arm64.deb"
          printf 'version: %s\narch: x64\n' "$v" > expected/latest-linux.yml
          printf 'version: %s\narch: arm64\n' "$v" > expected/latest-linux-arm64.yml
          echo "downloaded:"
          find release-artifacts -print | sort
          diff <(cd expected && find . -print | sort) <(cd release-artifacts && find . -print | sort)
          diff -r expected release-artifacts
          echo "all $(find release-artifacts -type f | wc -l) files match"
