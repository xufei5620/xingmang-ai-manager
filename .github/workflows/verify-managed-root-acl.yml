name: Verify managed root hardening reorder (temporary)

# One-off, branch-only check that the hardening reorder closes the standard-user
# write window on a real Windows runner. Removed before the PR; gates nothing.
on:
  push:
    branches: [claude/project-thread-t0uepi]
    paths:
      - '.github/verify-acl/**'
      - '.github/workflows/verify-managed-root-acl.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx tsc -p tsconfig.electron.json
      - run: node .github/verify-acl/verify.mjs
