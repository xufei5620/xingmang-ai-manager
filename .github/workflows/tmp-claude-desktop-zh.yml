# 临时：核对 Claude Desktop 3.6556.2 的中文界面怎么选、记在哪，核完就删，不进 main。
name: tmp-claude-desktop-zh
on:
  push:
    branches: [claude/project-thread-1qufks]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download and unpack official MSIX
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          curl -sS -o /dev/null -w '%{redirect_url}\n' https://claude.ai/api/desktop/win32/x64/msix/latest/redirect | tee url.txt
          curl -sSfL --retry 3 -o claude.msix https://claude.ai/api/desktop/win32/x64/msix/latest/redirect
          ls -l claude.msix
          mkdir msix && (cd msix && unzip -q ../claude.msix || true)
          grep -o 'Version="[^"]*"' msix/AppxManifest.xml | head -1
          npx --yes @electron/asar@3.2.10 extract msix/app/resources/app.asar asar || echo "asar extract partial"
      - name: Check bundled catalogs and renderer discovery
        run: |
          cd work
          python3 - <<'PY'
          import re, glob
          def show(path, rx, before=600, after=600, limit=3):
              data = open(path, 'rb').read()
              n = 0
              for m in re.finditer(rx, data):
                  print('---', path, m.start())
                  print(data[max(0, m.start() - before):m.end() + after].decode('utf-8', 'replace'))
                  n += 1
                  if n >= limit: break
          print('========== ion-dist html i18n meta')
          for f in sorted(glob.glob('msix/app/resources/ion-dist/*.html')):
              data = open(f, 'rb').read()
              for m in re.finditer(rb'<meta[^>]*i18n[^>]*>', data):
                  print(f, m.group(0).decode('utf-8', 'replace')[:600])
          print('========== shell: discoveredRendererConfig')
          for f in sorted(glob.glob('asar/.vite/build/*.js')):
              data = open(f, 'rb').read()
              if b'discoveredRendererConfig' in data:
                  show(f, rb'discoveredRendererConfig\(\)\{', 300, 1500, 2)
                  show(f, rb'function KQr\(', 100, 2500, 1)
          PY
