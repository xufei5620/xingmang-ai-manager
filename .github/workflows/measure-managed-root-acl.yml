name: Measure managed root hardening (temporary)

# One-off measurement for the elevated first-run hardening pass over
# C:\ProgramData\XingMangAI. Lives on this branch only and is removed before
# any pull request; nothing here ships or gates anything.
on:
  push:
    branches: [claude/project-thread-t0uepi]
    paths:
      - '.github/measure-acl/**'
      - '.github/workflows/measure-managed-root-acl.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx tsc -p tsconfig.electron.json
      - name: Runner, disk and Defender state
        shell: pwsh
        continue-on-error: true
        run: |
          node .github/measure-acl/measure.mjs report
          $PSVersionTable.PSVersion | Out-String
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IsTamperProtected | Format-List | Out-String
          "Defender exclusions: $((Get-MpPreference).ExclusionPath -join ', ')"
          Get-PhysicalDisk | Select-Object FriendlyName, MediaType, BusType, Size | Format-Table | Out-String
      - name: Empty layout, first creation and then a restart
        run: node .github/measure-acl/measure.mjs scenario empty 1 2
      - run: node .github/measure-acl/measure.mjs install @anthropic-ai/claude-code@2.1.277
      - run: node .github/measure-acl/measure.mjs scenario claude 2 2
      - run: node .github/measure-acl/measure.mjs install @openai/codex@0.156.1
      - run: node .github/measure-acl/measure.mjs scenario claude+codex 1 1
      - run: node .github/measure-acl/measure.mjs install @google/gemini-cli@0.60.0
      - run: node .github/measure-acl/measure.mjs scenario claude+codex+gemini 2 2
      - name: A finished update whose old copy could not be deleted yet
        run: node .github/measure-acl/measure.mjs leftover
      - run: node .github/measure-acl/measure.mjs scenario with-update-leftover 1 1
      - run: node .github/measure-acl/measure.mjs remove-leftover
      - name: Turn Defender real-time protection on, as on a customer machine
        id: defender
        shell: pwsh
        continue-on-error: true
        run: |
          $exclusions = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          "exclusions before: $($exclusions -join ', ')"
          if ($exclusions.Count -gt 0) { Remove-MpPreference -ExclusionPath $exclusions }
          Set-MpPreference -DisableRealtimeMonitoring $false
          Start-Sleep -Seconds 10
          $status = Get-MpComputerStatus
          "real-time protection now: $($status.RealTimeProtectionEnabled), on-access: $($status.OnAccessProtectionEnabled)"
          "exclusions now: $((Get-MpPreference).ExclusionPath -join ', ')"
          if (-not $status.RealTimeProtectionEnabled) { throw 'Defender real-time protection did not come on' }
      - if: steps.defender.outcome == 'success'
        run: node .github/measure-acl/measure.mjs scenario defender-on 2 2
      - if: always()
        run: node .github/measure-acl/measure.mjs summary
