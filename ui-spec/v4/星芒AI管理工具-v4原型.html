    var dg = document.querySelector('.app .dialog:not(.sp-static)'); if (!dg) return;
    var ins = Array.prototype.slice.call(dg.querySelectorAll('input:not([type=range]):not([disabled]),textarea:not([disabled])'));
    var el = ins.filter(function (x) { return !x.value; })[0];
    if (!el) el = dg.querySelector('.btn.danger') ? dg.querySelector('.dlg-acts .btn.sec') : dg.querySelector('.btn.pri:not([disabled])');
    if (!el) el = ins[0] || dg.querySelector('.dlg-acts [data-act="dlgClose"],.dlg-foot [data-act="dlgClose"]') || dg.querySelector('[data-act="dlgClose"]');
    if (el) el.focus({ preventScroll: true });
  }
  function draw() {
    queued = false;
    var g = geom();
    var dlgNow = S.dialog || (S.palette ? 'palette' : null);
    if (dlgNow && !lastDlg) opener = document.activeElement;
    var tpl = document.createElement('template');
    tpl.innerHTML = Review(g) + Stage(g);
    sync(root, tpl.content);
    if (S.dialog && S.dialog !== lastDlg) focusDialog();
    if (!dlgNow && lastDlg && opener && document.contains(opener) && !opener.closest('[inert]')) { try { opener.focus({ preventScroll: true }); } catch (e) { } opener = null; }
    lastDlg = dlgNow;
    if (flags.scrollTop) { var sc = document.getElementById('scroll'); if (sc) sc.scrollTop = 0; flags.scrollTop = false; }
    if (flags.chatBottom) { var m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight; flags.chatBottom = false; }
    if (S.view === 'spec') Array.prototype.forEach.call(document.querySelectorAll('[data-tok]'), function (el) { var v = getComputedStyle(el.parentNode).getPropertyValue(el.getAttribute('data-tok')).trim(); if (el.textContent !== v) el.textContent = v; });
    if (flags.tools) { var tg = document.querySelector('.tgrid'); if (tg) tg.parentNode.scrollIntoView({ block: 'start', behavior: S.reduce ? 'auto' : 'smooth' }); flags.tools = false; }
    if (flags.coach) { var co = document.querySelector('.coach'); if (co) co.scrollIntoView({ block: 'nearest' }); flags.coach = false; }
    if (flags.focusPal) { var p = document.getElementById('palIn'); if (p) p.focus(); flags.focusPal = false; }
    var dg = document.querySelector('.app .dialog:not(.sp-static)'); if (dg) dg.classList.toggle('scrolls', dg.scrollHeight > dg.clientHeight + 1);
    var st = document.getElementById('stage');
    if (st && (Math.abs(st.clientWidth - S.stageW) > 1 || Math.abs(st.clientHeight - S.stageH) > 1)) { S.stageW = st.clientWidth; S.stageH = st.clientHeight; render(); }
  }

  root.addEventListener('click', function (e) {
    if (S.view === 'spec' && e.target.closest('.sp-demo')) return;
    var el = e.target.closest('[data-act]');
    if (S.menu && !e.target.closest('.menu') && !(el && el.getAttribute('data-act') === 'menu')) { S.menu = null; render(); }
    if (!el || !root.contains(el) || el.disabled) return;
    var fn = A[el.getAttribute('data-act')];
    if (fn) fn(el.getAttribute('data-arg') || '', e, el);
  });
  root.addEventListener('input', function (e) {
    var el = e.target.closest('[data-in]');
    if (el && IN[el.getAttribute('data-in')]) IN[el.getAttribute('data-in')](el.value, el);
  });
  root.addEventListener('keydown', function (e) {
    var kd = e.target.getAttribute && e.target.getAttribute('data-kd');
    if (kd === 'chat' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    if (kd === 'pal') {
      var n = PAL().length;
      if (e.key === 'ArrowDown') { e.preventDefault(); S.palSel = (S.palSel + 1) % Math.max(1, n); render(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); S.palSel = (S.palSel - 1 + n) % Math.max(1, n); render(); }
      if (e.key === 'Enter' && n && !e.isComposing) { e.preventDefault(); A.pal(String(Math.min(S.palSel, n - 1))); }
    }
  });
  function zoomKey(k) {
    var steps = ['90', '100', '110'], i = steps.indexOf(S.scaleSet === 'auto' ? '100' : S.scaleSet), m = S.os === 'mac' ? '⌘' : 'Ctrl ';
    if (k === '0') { S.scaleSet = 'auto'; toast('界面缩放已恢复自动', 'info'); return; }
    var j = Math.max(0, Math.min(2, i + (k === '-' ? -1 : 1)));
    if (j === i) { toast(k === '-' ? '已经是最小的 90%' : '已经是最大的 110%', 'info'); return; }
    S.scaleSet = steps[j]; toast('界面缩放 ' + steps[j] + '%，按 ' + m + '0 恢复自动', 'info');
  }
  document.addEventListener('keydown', function (e) {
    if (S.view === 'spec') return;
    var mod = e.ctrlKey || e.metaKey;
    if (mod && S.loggedIn && !S.dialog) {
      if (e.key === 'k' || e.key === 'K') { e.preventDefault(); if (S.palette) { S.palette = false; render(); } else A.palette(); return; }
      if (!S.palette && e.key === '1') { e.preventDefault(); var h = heroTool(); if (h) A.tOpen(h.id); else toast('还没装命令行工具，先在首页装一个', 'warn'); return; }
      if (!S.palette && e.key === ',') { e.preventDefault(); A.setGo(S.setSec || 'appearance'); return; }
      if (!S.palette && (e.key === '=' || e.key === '+' || e.key === '-' || e.key === '0')) { e.preventDefault(); zoomKey(e.key); return; }
    }
    if (e.key === 'Tab' && S.dialog) {
      var dg = document.querySelector('.app .dialog:not(.sp-static)');
      if (dg) {
        var f = Array.prototype.filter.call(dg.querySelectorAll('button,input,textarea,[tabindex]'), function (x) { return !x.disabled && x.tabIndex >= 0 && x.getClientRects().length; });
        var i = f.indexOf(document.activeElement);
        if (f.length && e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (f.length && !e.shiftKey && (i < 0 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
      }
      return;
    }
    if (e.key === 'Escape') { if (S.menu) S.menu = null; else if (S.palette) S.palette = false; else if (S.dialog) { closeDlg(); return; } else if (S.bell) S.bell = false; else if (S.tour) S.tour = 0; render(); }
  });
  root.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing && S.dialog && DLG_OK[S.dialog.kind] && e.target.closest && e.target.closest('.dialog') && e.target.tagName === 'INPUT') { e.preventDefault(); A.dlgOk(); } });
  window.addEventListener('resize', function () { render(); });
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (S.themeMode === 'system') { S.theme = viewerDark() ? 'dark' : 'light'; render(); } });
  draw();
})();
</script>
