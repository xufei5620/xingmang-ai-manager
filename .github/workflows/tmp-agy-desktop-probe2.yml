# 一次性探测（docs/COLLABORATION.md §3）：Antigravity 桌面端两种安装包的签名签发机构、开着时再装会怎样；Mac 的 zip 用 bsdtar 解开后过不过星芒那套 codesign 要求和 Gatekeeper。只读，不碰中转，用完就删。
name: tmp-agy-desktop-probe2

on:
  push:
    branches: [claude/project-thread-gwf95j]
    paths: ['.github/tmp-agy-desktop-probe2/**', '.github/workflows/tmp-agy-desktop-probe2.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./.github/tmp-agy-desktop-probe2/windows.ps1
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/tmp-agy-desktop-probe2/macos.sh
