/* ============================================================ 0. Token —— 星芒 Starlight Gold（品牌色：曜石海军蓝 / 日出金 / 暖象牙白 / 晨光蓝 / 晨曦石蓝 / 薄雾浅灰） */

}

  --glow-top:radial-gradient(900px 380px at 12% -8%, rgba(212,163,85,.13), transparent 60%), radial-gradient(700px 300px at 90% 0%, rgba(61,91,143,.35), transparent 60%);

/* ============================================================ 1. 原型外壳 */

.window { width: 100%; height: 100%; border-radius: var(--r-win); corner-shape: squircle; overflow: hidden; display: grid; grid-template-columns: 216px 1fr; grid-template-rows: auto 1fr; background: var(--win); color: var(--text); font-family: var(--font); overflow: hidden; position: relative; box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); letter-spacing: -.005em; }

/* 窗口圆角：苹果式连续曲率（squircle），两个平台统一。

.winbox { border-radius: var(--r-win); corner-shape: squircle; }

.win-only, .mac-only, .linux-only { display: none; } [data-os="win"] .win-only { display: contents; } [data-os="mac"] .mac-only { display: contents; } [data-os="linux"] .linux-only { display: contents; }

.avatar.photo { background: linear-gradient(135deg, #F6B26B, #C2622E 60%, #5B3A8C); } .avatar.guest { background: var(--panel-2); color: var(--text-3); box-shadow: var(--tile-ring); }

.btn-bal { font-weight: 600; border-color: transparent; } .btn-bal svg { width: 13px; height: 13px; }
.btn-bal.ok { background: var(--ok-soft); color: var(--ok); } .btn-bal.ok:hover { background: rgba(61,214,140,.26); }

.window.collapsed .brand strong, .window.collapsed .nav a .k, .window.collapsed .nav a .ext, .window.collapsed .nav a .badge, .window.collapsed .nav a .lbl, .window.collapsed .update-row .lbl, .window.collapsed .nav .chev { display: none; }

/* 内容区 */
.main { min-height: 0; overflow: hidden; position: relative; background: var(--bg); background-image: var(--glow-top); background-repeat: no-repeat; display: flex; flex-direction: column; }
.content { flex: 1; min-height: 0; overflow: auto; position: relative; display: flex; flex-direction: column; }

.kf-btn:hover { color: var(--text); border-color: var(--line-3); background: var(--btn-2-hover); } .kf-btn.on { color: var(--text); background: var(--panel-2); } .kf-btn svg { width: 15px; height: 15px; }

.statusbar .upd .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.drawer { top: 46px; bottom: 28px; }

.page.tight { padding-bottom: 0; display: flex; flex-direction: column; min-height: 0; }
.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; }

.page-head p { margin: 0; color: var(--text-2); font-size: 13px; max-width: 64ch; }
.page-head .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; padding-top: 4px; }

/* ============================================================ 3. 基础组件 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 9px; corner-shape: squircle; border: 1px solid transparent; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, box-shadow .15s, color .15s; color: var(--text); }
.btn svg { width: 15px; height: 15px; } .btn kbd { margin-left: 2px; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--accent-fg); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 2px rgba(0,0,0,.3), 0 6px 18px var(--accent-glow); }
.btn-primary:hover { filter: brightness(1.08); }

.btn-secondary:hover { background: var(--btn-2-hover); border-color: var(--line-3); }

.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; } .btn.xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn.icon { width: 32px; padding: 0; } .btn.icon.sm { width: 28px; } .btn.icon.xs { width: 24px; }
.btn.block { width: 100%; }

.btn .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.link { color: var(--text-2); cursor: pointer; } .link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.link.accent { color: var(--info); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; color: var(--text-2); background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex: none; }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; } .pill.ok i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; } .pill.warn i { background: var(--warn); box-shadow: 0 0 6px var(--warn); }

.pill.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; } .pill.accent i { background: var(--accent); }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.card { background: var(--card-grad); border: 1px solid var(--line); border-radius: 13px; corner-shape: squircle; box-shadow: var(--tile-ring); }

.card-body { padding: 14px 16px; }
.input { height: 32px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel-2); padding: 0 10px; font: inherit; font-size: 13px; color: var(--text); width: 100%; }

.search { position: relative; } .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); } .search .input { padding-left: 30px; }

.segment button { border: 0; background: transparent; font: inherit; font-size: 12.5px; padding: 4px 11px 4px 9px; border-radius: 6px; color: var(--text-2); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.segment button .ico.xs { width: 16px; height: 16px; } .segment button .ico.xs svg { width: 14px; height: 14px; }
.ico.inline { display: inline-grid; vertical-align: -3px; width: 16px; height: 16px; margin-right: 5px; } .ico.inline svg { width: 13px; height: 13px; }
.ico.inline.sm { width: 14px; height: 14px; margin-right: 3px; box-shadow: none; background: transparent; } .ico.inline.sm svg { width: 12px; height: 12px; }
.ico.inline.big { width: 22px; height: 22px; vertical-align: -5px; margin-right: 7px; } .ico.inline.big svg { width: 16px; height: 16px; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; }
.segment button.on { background: var(--panel-solid); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 0 0 1px var(--line); }

.switch.on { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); } .switch.on::after { transform: translateX(15px); }
select.input { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 15px) 13px, calc(100% - 10px) 13px; background-size: 5px 5px; background-repeat: no-repeat; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.check i { width: 15px; height: 15px; border-radius: 4px; border: 1px solid var(--line-3); display: inline-grid; place-items: center; }
.check.on i { background: var(--accent); border-color: var(--accent); } .check.on i::after { content: "✓"; color: #fff; font-size: 10px; font-weight: 700; }
.field label { display: block; font-size: 12.5px; font-weight: 500; margin-bottom: 6px; } .field .hint { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
.field-row { display: flex; gap: 8px; }
.callout { display: flex; gap: 10px; padding: 10px 12px; border-radius: 9px; background: var(--ok-soft); color: var(--ok); font-size: 12.5px; }
.callout.warn { background: var(--warn-soft); color: var(--warn); } .callout.bad { background: var(--bad-soft); color: var(--bad); } .callout.info { background: rgba(167,209,247,.14); color: var(--info); }
.callout svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.progress { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px var(--accent-glow); transition: width .3s; }
.progress.ok i { background: var(--ok); box-shadow: none; }
.empty { text-align: center; padding: 44px 20px; color: var(--text-2); }

.ico { width: 40px; height: 40px; border-radius: 11px; corner-shape: squircle; display: grid; place-items: center; background: var(--panel-2); box-shadow: var(--tile-ring); color: var(--text); flex: none; }

.card:has(> .table) { overflow-x: auto; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs a { padding: 8px 12px; font-size: 13px; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 12.5px; } .kv dt { color: var(--text-3); } .kv dd { margin: 0; }
.stat { display: flex; flex-direction: column; gap: 2px; } .stat b { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: -.02em; } .stat span { font-size: 11.5px; color: var(--text-3); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.section { margin-top: 22px; } .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; } .section-head h2 { font-size: 14px; font-weight: 600; margin: 0; } .section-head span { color: var(--text-3); font-size: 12px; } .section-head .right { margin-left: auto; }

/* 首页 */
.home-grid { display: grid; grid-template-columns: 1fr 292px; gap: 18px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.setup .focus { padding: 20px 18px 18px; display: flex; gap: 18px; align-items: center; }

.setup .focus .num.done { background: var(--ok); box-shadow: none; }

.setup .later .n { width: 18px; height: 18px; border-radius: 6px; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 10.5px; font-family: var(--mono); flex: none; }
.setup .later div.done .n { background: var(--ok); border-color: var(--ok); color: #fff; } .setup .later div.now .n { border-color: var(--accent); color: var(--accent-2); }
/* 工具列表：固定列宽，名字长短不影响按钮位置；工具再多也只是多一行 */
.tools { overflow: hidden; }
.tools .card-head .chev { margin-left: auto; width: 14px; height: 14px; color: var(--text-3); cursor: pointer; transition: transform .18s; } .tools.closed .card-head .chev { transform: rotate(-90deg); } .tools.closed .trow { display: none; }
.trow { display: grid; grid-template-columns: 40px 200px 1fr 72px 92px 32px; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); min-height: 62px; }
.trow:hover { background: var(--panel-hover); }
.trow .ico { width: 40px; height: 40px; border-radius: 11px; corner-shape: squircle; } .trow .ico svg { width: 24px; height: 24px; }
.trow .name { min-width: 0; line-height: 1.25; } .trow .name strong { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .trow .name span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
.trow .st { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; } .trow .st .pill { flex: none; } .trow .st .mono { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
.trow .st .pill.warn.clickable { cursor: pointer; } .trow .st .pill.warn.clickable:hover { filter: brightness(1.15); }
.trow .upd { display: flex; justify-content: flex-end; } .trow .upd .btn { padding: 0 9px; }
.trow .pri .btn { width: 100%; position: relative; } .trow .pri .btn kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); margin: 0; }
.trow .prog { grid-column: 3 / span 3; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-2); margin-top: -4px; } .trow .prog .progress { flex: 1; }
.trow.dim .name, .trow.dim .st { opacity: .6; }
.rows .row { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.rows .row:hover { background: var(--panel-hover); } .rows .row strong { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rows .row span { font-size: 11.5px; color: var(--text-3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rows .row .when { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.status-list { padding: 4px 0; } .status-list .it { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 12.5px; } .status-list .it .v { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); } .status-list .it .btn { margin-left: auto; }
.acct { padding: 14px 16px 16px; } .acct .bal { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 10px; } .acct .bal b { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; } .acct .bal span { color: var(--text-3); font-size: 12px; }
.acct .sub { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--text-3); margin: 8px 0 12px; } .acct .acts { display: flex; gap: 8px; } .acct .acts .btn { flex: 1; }
.tips .it { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 12.5px; } .tips .it:hover { background: var(--panel-hover); } .tips .it svg { width: 14px; height: 14px; color: var(--accent); flex: none; } .tips .it .go { margin-left: auto; color: var(--text-3); }

/* 列表页 */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .toolbar .search { width: 240px; } .toolbar .count { margin-left: auto; color: var(--text-3); font-size: 12px; font-family: var(--mono); }

.list { overflow: hidden; }

.lrow .main-col { min-width: 0; } .lrow .title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; } .lrow .desc { font-size: 11.5px; color: var(--text-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .lrow .desc.mono { font-family: var(--mono); }
.lrow .acts { display: flex; align-items: center; gap: 10px; } .lrow.off .title, .lrow.off .desc { opacity: .5; }

/* 设置 / 个人中心 */
.settings-grid { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: start; }
.subnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; } .subnav a { padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; } .subnav a.on { background: var(--panel-2); color: var(--text); font-weight: 500; } .subnav a:hover { color: var(--text); }
.settings-group { margin-bottom: 22px; } .settings-group h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px 2px; }
.setting { display: flex; align-items: center; gap: 20px; padding: 13px 16px; border-top: 1px solid var(--line); } .setting:first-of-type { border-top: 0; }
.setting .l { flex: 1; min-width: 0; } .setting .l strong { display: block; font-size: 13px; font-weight: 500; } .setting .l span { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }
.setting .r { flex: none; display: flex; align-items: center; gap: 10px; } .setting .r .input { width: 230px; }
.path { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); background: var(--panel-2); border: 1px solid var(--line); padding: 6px 10px; border-radius: 7px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 弹窗 / 面板 / 菜单 / 提示 */
.overlay { position: absolute; inset: 0; border-radius: var(--r-win); corner-shape: squircle; background: var(--overlay); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 20; border-radius: inherit; }
.overlay.top { align-items: flex-start; padding-top: 110px; }
.dialog { width: 480px; background: var(--panel-solid); border-radius: 16px; corner-shape: squircle; box-shadow: var(--shadow), 0 0 0 1px var(--line-2); overflow: hidden; max-height: 88%; display: flex; flex-direction: column; }
.dialog.wide { width: 640px; }
[data-theme="dark"] .dialog, [data-theme="dark"] .cmdk { background: linear-gradient(180deg, #1B1D23, #15171C); }
.dialog header { display: flex; align-items: center; gap: 12px; padding: 18px 20px 0; flex: none; } .dialog header .ico { width: 32px; height: 32px; border-radius: 9px; } .dialog header .ico svg { width: 20px; height: 20px; }
.dialog header h2 { margin: 0; font-size: 15px; font-weight: 600; } .dialog header p { margin: 1px 0 0; font-size: 12px; color: var(--text-2); } .dialog header .x { margin-left: auto; }
.dialog .body { padding: 16px 20px 4px; display: flex; flex-direction: column; gap: 14px; overflow: auto; } .dialog .body .segment { align-self: flex-start; }
.dialog footer { display: flex; align-items: center; gap: 8px; padding: 14px 20px 18px; flex: none; } .dialog footer .spacer { flex: 1; }
.cmdk { width: 560px; background: var(--panel-solid); border-radius: 16px; corner-shape: squircle; box-shadow: var(--shadow), 0 0 0 1px var(--line-2); overflow: hidden; }
.cmdk .in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); } .cmdk .in svg { width: 16px; height: 16px; color: var(--text-3); } .cmdk .in input { flex: 1; border: 0; background: transparent; font: inherit; font-size: 14.5px; color: var(--text); outline: 0; }
.cmdk .grp { padding: 8px 8px 4px; font-size: 11px; color: var(--text-3); } .cmdk .it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 0 6px; border-radius: 8px; font-size: 13px; cursor: pointer; } .cmdk .it:hover, .cmdk .it.sel { background: var(--panel-2); } .cmdk .it > svg { width: 15px; height: 15px; color: var(--text-2); } .cmdk .it .sub { color: var(--text-3); font-size: 12px; margin-left: 2px; } .cmdk .it kbd { margin-left: auto; }
.cmdk .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--text-3); margin-top: 6px; } .cmdk .list { max-height: 360px; overflow: auto; padding-bottom: 4px; }
.menu { position: absolute; z-index: 25; min-width: 160px; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 12px; corner-shape: squircle; box-shadow: var(--shadow); padding: 4px; }
.menu button { display: flex; width: 100%; align-items: center; gap: 9px; border: 0; background: transparent; font: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--text); text-align: left; } .menu button svg { width: 14px; height: 14px; color: var(--text-2); } .menu button:hover { background: var(--panel-2); } .menu button.danger { color: var(--bad); } .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.toast-wrap { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 30; align-items: center; pointer-events: none; }
.toast { background: var(--panel-solid); color: var(--text); padding: 9px 14px; border-radius: 10px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow), 0 0 0 1px var(--line-2); animation: toastin .18s ease-out; }
@keyframes toastin { from { opacity: 0; transform: translateY(8px); } }
.toast svg { width: 14px; height: 14px; color: var(--ok); } .toast.warn svg { color: var(--warn); } .toast.bad svg { color: var(--bad); }
.drawer { position: absolute; right: 0; width: 420px; background: var(--panel-solid); border-left: 1px solid var(--line-2); box-shadow: -20px 0 60px rgba(0,0,0,.35); z-index: 15; display: flex; flex-direction: column; animation: slidein .18s ease-out; }
@keyframes slidein { from { transform: translateX(20px); opacity: 0; } }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); } .drawer header h2 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer .body { padding: 16px 18px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; } .drawer footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; }

/* 欢迎页 / 引导 */
.welcome { position: relative; height: 100%; display: grid; grid-template-rows: 1fr auto; padding: 54px 60px 40px; gap: 26px; overflow: hidden; }
.welcome::before { content: ""; position: absolute; inset: 0; background: radial-gradient(760px 420px at 18% 12%, rgba(108,124,255,.26), transparent 62%), radial-gradient(560px 360px at 88% 70%, rgba(61,214,140,.10), transparent 60%), radial-gradient(420px 300px at 70% 10%, rgba(139,152,255,.12), transparent 60%); pointer-events: none; }
.welcome::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--line-2) 1px, transparent 1px); background-size: 22px 22px; opacity: .5; mask-image: radial-gradient(900px 500px at 50% 40%, #000, transparent 75%); -webkit-mask-image: radial-gradient(900px 500px at 50% 40%, #000, transparent 75%); pointer-events: none; }
.welcome > * { position: relative; }
.welcome .hero { display: grid; grid-template-columns: 1fr 1.05fr; gap: 40px; align-items: center; min-height: 0; }
.welcome .brandline { display: flex; align-items: center; margin-bottom: 12px; margin-left: -14px; } .welcome .brandline img { height: 128px; }
.welcome h1 { font-size: 42px; line-height: 1.12; font-weight: 700; letter-spacing: -.03em; margin: 0 0 14px; }

/* ============================================================ 响应式：窗口变窄时的降级规则 */

  .welcome { padding: 40px 40px 28px; }

}

  .window .account { padding: 6px 0; align-items: center; background: transparent; border: 0; box-shadow: none; } .window .account .who, .window .account .bal .lbl, .window .account .bal b { display: none; } .window .account .bal { border: 0; padding: 0; } .window .account .bal .btn { width: 32px; padding: 0; } .window .account .bal .btn span { display: none; }

}

const logo = (kind, h = 24, extra = '') => { const dark = S.theme === 'dark'; const key = kind === 'micro' ? (dark ? 'm32-dark' : 'm32-std') : kind === 'micro-mono' ? (dark ? 'm32-white' : 'm32-navy') : kind === 'symbol' ? (dark ? 'sym-dark' : 'sym-std') : kind === 'horizontal' ? (dark ? 'hz-dark' : 'hz-std') : kind === 'wordmark' ? (dark ? 'wm-dark' : 'wm-std') : kind; return `<img src="${LOGOS[key]}" alt="星芒 AI" style="height:${h}px;display:block;${extra}" draggable="false">`; };
/* ============================================================ 工具函数 */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const brand = (tid, cls = '') => { const t = TOOLS[tid]; return `<span class="ico ${t.cls} ${cls}"><svg><use href="#${t.brand}"/></svg></span>`; };
const ENV = { node: ['Node.js', 'e-node'], npm: ['npm', 'e-npm'], python: ['Python', 'e-python'] };
const envIco = (id, cls = 'inline') => `<span class="ico ${cls}"><svg><use href="#${ENV[id][1]}"/></svg></span>`;
const modelTool = (m) => (/claude/i.test(m) ? 'claude' : /gpt|codex|o[0-9]/i.test(m) ? 'codex' : /gemini|image-2|nano/i.test(m) ? 'gemini' : /grok/i.test(m) ? 'grok' : null);
const modelIcon = (m) => { const t = modelTool(m); return t ? brand(t, 'inline') : ''; };
const segTool = (ids, cur, fn) => `<span class="segment">${ids.map((id) => `<button class="${cur === id ? 'on' : ''}" ${S.tools[id] && !S.tools[id].installed ? 'disabled title="未安装"' : ''} onclick="${fn(id)}">${brand(id, 'xs')}${TOOLS[id].name}</button>`).join('')}</span>`;
const balTier = (u) => (!u ? 'ok' : u.balance < 5 ? 'bad' : u.balance < 20 ? 'warn' : 'ok');
const balDays = (u) => { const daily = Math.max(0.3, u.usedMonth / Math.max(1, new Date().getDate())); const d = Math.floor(u.balance / daily); return d < 1 ? '不到 1' : String(d); };
const balHint = (u) => (!u ? '' : balTier(u) === 'bad' ? `余额不足 ¥5，按最近用量约还能用 ${balDays(u)} 天，随时可能中断` : balTier(u) === 'warn' ? `按最近用量约还能用 ${balDays(u)} 天，建议提前充值` : `按最近用量约还能用 ${balDays(u)} 天`);
const rechargeBtn = (size = 'sm', label = '充值', short = false) => { const t = balTier(S.user); return `<button class="btn btn-bal ${t} ${size}" title="${balHint(S.user)}" onclick="event.stopPropagation();A.openAccount('recharge')">${ic('zap')}<span>${t === 'bad' && !short ? '马上充值' : label}</span></button>`; };
const money = (n) => '¥' + Number(n).toFixed(2);
const kbd = (k) => `<kbd>${S.os !== 'mac' ? k.replace('⌘', 'Ctrl+') : k}</kbd>`;
const pill = (cls, text) => `<span class="pill ${cls}"><i></i>${text}</span>`;
const modK = () => (S.os === 'mac' ? '⌘' : 'Ctrl+');
const timers = [];
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function toolState(id) { const t = S.tools[id], m = TOOLS[id]; if (S.installing[id] != null) return 'installing'; if (!t.installed) return 'missing'; if (t.version !== m.latest) return 'update'; return 'ok'; }
function installedCount() { return TOOL_ORDER.filter((id) => S.tools[id].installed).length; }
function envReady() { return Boolean(S.env.node && S.env.npm); }
function firstInstalled() { return TOOL_ORDER.find((id) => S.tools[id].installed) || null; }
function log(lv, msg, d = '') { S.logs.unshift({ t: new Date().toTimeString().slice(0, 8), lv, msg, d }); }

/* ============================================================ 渲染入口 */
function render() {
  const w = $('#win');
  w.dataset.os = S.os; w.dataset.theme = S.theme;

  const secs = TUTORIAL.filter((s) => !q || (s.title + s.lead + s.kw + s.steps.map((x) => x.join(' ')).join(' ')).toLowerCase().includes(q));
  if (q && secs.length && !secs.find((s) => s.id === S.tutSection)) S.tutSection = secs[0].id;
  const cur = secs.find((s) => s.id === (S.tutSection || 'first')) || secs[0];
  return `<section class="page">${pageHead('教程', '一步步教你怎么用。', `<label class="search" style="width:280px">${ic('search')}<input class="input" data-search placeholder="搜索安装、充值、Key、画布或故障…" value="${esc(S.q.tutorial || '')}" oninput="A.search('tutorial',this.value)"></label>`)}
    ${!secs.length ? `<div class="card">${emptyHtml('book', '没找到相关教程', '换个词试试，或者直接问客服。', `<button class="btn btn-secondary sm" onclick="A.search('tutorial','')">清除搜索</button>`)}</div>` : `<div class="tut"><div class="subnav">${secs.map((s) => `<a class="${cur.id === s.id ? 'on' : ''}" onclick="S.tutSection='${s.id}';rerenderMain()">${s.title}</a>`).join('')}</div>

  forgot: () => { const f = S.form; const step = f.step || 1; return dialogShell({ title: '找回密码', sub: '两步：收邮件 → 粘贴重置码', body: `

  legal: (p) => dialogShell({ title: p.kind === 'terms' ? '用户协议' : '隐私政策', wide: true, body: `<div class="muted" style="font-size:12.5px;line-height:1.8;max-height:360px;overflow:auto">${p.kind === 'terms' ? '<p>本协议是你与星芒之间关于使用「星芒AI管理工具」及相关服务的约定。使用本软件即表示同意以下条款：</p><p><strong>1. 服务内容</strong> 本软件用于安装、配置和管理第三方 AI 编程工具，并提供星芒账号的 Key 管理、充值与用量查询。</p><p><strong>2. 账号与费用</strong> 账号按实际用量扣费；充值金额不可提现，可用于所有支持的模型。</p><p><strong>3. 使用限制</strong> 不得利用本服务从事违法活动或损害第三方权益……</p>' : '<p>我们只收集为你提供服务所必需的信息。</p><p><strong>本地数据</strong> API Key 仅保存在本机主进程，界面只显示打码后的值；配置文件的备份保存在本机。</p><p><strong>诊断报告</strong> 你主动导出的报告会自动脱敏（Key 打码、路径中的用户名替换为 ~）。</p><p><strong>第三方</strong> 模型请求会转发到对应厂商的官方接口……</p>'}</div>`, footer: `<span class="spacer"></span><button class="btn btn-primary" onclick="A.closeDialog()">我知道了</button>` }),

  pickFolder: () => dialogShell({ title: '选择工作文件夹', sub: '打开工具时默认进入这个目录', body: `<div class="field"><label>路径</label><input class="input mono" data-autofocus value="${esc(S.settings.workdir)}" oninput="F.set('dir',this.value)"></div><div class="suggest-row">最近用过：${['D:\\projects', 'D:\\projects\\xingmang-web', '~/code'].map((p) => `<span class="chipbtn" onclick="S.form.dir='${esc(p)}';render()">${esc(p)}</span>`).join('')}</div>`, footer: `<span class="spacer"></span><button class="btn btn-ghost" onclick="A.closeDialog()">取消</button><button class="btn btn-primary" onclick="A.setting('workdir',S.form.dir||S.settings.workdir);A.closeDialog();A.toast('工作文件夹已更换')">使用这个文件夹</button>` }),

/* ============================================================ 初始化与原型控制条 */
function initProto() {
  document.querySelectorAll('.proto-bar .seg').forEach((sg) => sg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; sg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); const ctl = sg.dataset.ctl, v = b.dataset.v; if (ctl === 'os') S.os = v; if (ctl === 'theme') { S.systemDark = v === 'dark'; if (S.settings.themePref === 'system') S.theme = v; else { S.theme = v; S.settings.themePref = v; } } if (ctl === 'layout') S.layoutMode = v; render(); }));
  $('#resetNew').addEventListener('click', () => { timers.forEach(clearTimeout); $('#simSel').value = ''; const os = S.os, theme = S.theme, lm = S.layoutMode; S = freshState(false); S.os = os; S.theme = theme; S.layoutMode = lm; S.settings.themePref = theme; render(); });
  $('#resetReady').addEventListener('click', () => { timers.forEach(clearTimeout); $('#simSel').value = ''; const os = S.os, theme = S.theme, lm = S.layoutMode; S = freshState(true); S.os = os; S.theme = theme; S.layoutMode = lm; S.settings.themePref = theme; render(); });
  document.addEventListener('keydown', (e) => { const mod = e.metaKey || e.ctrlKey; if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); S.palette ? A.closePalette() : A.openPalette(); return; } if (e.key === 'Escape') { if (S.palette) return A.closePalette(); if (S.coach) return A.coachNext(); if (S.kfPop) return A.closeKf(); if (S.accPop) return A.closeAccPop(); if (S.annPop) { S.annPop = null; render(); return; } if ($('#tray')) return A.closeTray(); if (S.menu) { S.menu = null; render(); return; } if (S.dialogs.length) return A.closeDialog(); if (S.drawer) return A.closeDrawer(); if (S.canvasOpen) return A.closeCanvas(); } if (mod && S.view === 'app' && !S.dialogs.length && !S.palette) { if (/^[1-5]$/.test(e.key)) { e.preventDefault(); const id = TOOL_ORDER[Number(e.key) - 1]; if (S.tools[id].installed) A.launch(id); else A.toast(`${TOOLS[id].name} 还没安装`, 'warn'); } if (e.key === ',') { e.preventDefault(); A.go('settings'); } } });
  document.addEventListener('pointerdown', (e) => { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } if (S.kfPop && !e.target.closest('.kf-pop')) { S.kfPop = null; render(); } if (S.accPop && !e.target.closest('.acc-pop')) { S.accPop = null; render(); } if (S.annPop && !e.target.closest('.ann-pop') && !e.target.closest('.bell')) { S.annPop = null; render(); } if ($('#tray') && !e.target.closest('#tray') && !e.target.closest('#trayBtn')) A.closeTray(); });
  $('#simSel').addEventListener('change', (e) => A.sim(e.target.value));
  $('#dlPay').addEventListener('click', () => A.deepLink('xingmang://pay/success?order=XM20260906-0107'));
  $('#dlInvite').addEventListener('click', () => A.deepLink('xingmang://invite?code=XM-7K2Q'));
  $('#coachBtn').addEventListener('click', () => A.coachStart());
  $('#trayBtn').addEventListener('click', () => ($('#tray') ? A.closeTray() : A.openTray()));
  $('#screenSel').addEventListener('change', (e) => { const [w, h] = e.target.value.split('x').map(Number); const box = $('#winbox'); box.style.width = w + 'px'; box.style.height = h + 'px'; box.style.minWidth = '0'; box.style.minHeight = '0'; render(); });
  render();
  A.tickerRestart();
}
initProto();

</script>
</body>
</html>
