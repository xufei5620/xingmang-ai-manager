# 临时：在 GitHub 的 Mac 机器上真装一次 Claude Desktop，核对按芯片分开的官方包。
# 开 PR 前删掉，不进 main。
name: tmp-verify-claude-mac

on:
  push:
    branches: [claude/mac-claude-desktop-split-packages-ovjcjk]
    paths:
      - .github/workflows/tmp-verify-claude-mac.yml
      - .github/tmp-verify-claude-mac.cjs
      - electron/macos-desktop-app-installer.ts

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies without the Electron binary
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile the main process
        run: npx tsc -p tsconfig.electron.json

      - name: Install Claude Desktop the way the toolbox does
        run: node .github/tmp-verify-claude-mac.cjs
