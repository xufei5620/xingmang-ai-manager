# 临时：核 Claude 桌面端把 Claude Code 程序和 Cowork 工作区放在哪、怎么核对，能不能由星芒先放好（yoyo 11-03「开探测」），核完就删。
name: tmp-claude-desktop-components

on:
  push:
    branches: [claude/tmp-claude-components-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the current Windows x64 MSIX
        run: |
          set -euo pipefail
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' https://claude.ai/api/desktop/win32/x64/msix/latest/redirect)
          echo "redirect: $loc"
          case "$loc" in https://downloads.claude.ai/releases/win32/x64/*.msix) ;; *) echo "unexpected redirect"; exit 1 ;; esac
          curl -fsSL --max-time 600 -o claude.msix "$loc"
          ls -l claude.msix
          mkdir msix && (cd msix && unzip -q ../claude.msix)
          find msix -maxdepth 3 -type d | head -40
          find msix -name '*.asar' -printf '%s %p\n'

      - name: Extract app.asar
        run: |
          set -euo pipefail
          # MSIX 包里的文件名是百分号编码的（@ 写成 %40），解包器按原名找 unpacked 文件会找不到。
          find msix -depth -name '*%*' | while IFS= read -r f; do
            d=$(dirname "$f"); b=$(basename "$f")
            n=$(python3 -I -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' "$b")
            [ "$b" = "$n" ] || mv "$f" "$d/$n"
          done
          asar=$(find msix -name app.asar | head -1)
          npx --yes @electron/asar@3.4.1 extract "$asar" app || echo "some files could not be extracted"
          npx --yes @electron/asar@3.4.1 extract msix/app/resources/ion-dist.asar ion || echo "ion: some files could not be extracted"
          find ion -maxdepth 2 | head -30
          find app -maxdepth 3 -type f -name '*.js' -printf '%s %p\n' | sort -n | tail -20
          find app -maxdepth 2 -name package.json -exec sh -c 'echo "== $1"; head -c 600 "$1"; echo' _ {} \;

      - name: How the app installs and verifies Claude Code and the VM bundle
        run: |
          set -uo pipefail
          # 第三次已找到放在哪（userData/claude-code/<版本>/<校验值前 12 位>）；这次读装好以后怎么认、
          # .verified 和 .origin 里写什么、preseed（安装包自带组件）怎么用。
          cat > "$RUNNER_TEMP/read.mjs" <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'
          const root = process.argv[2]
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) { if (entry.name !== 'node_modules') walk(full) }
              else if (/\.(m?js|cjs)$/.test(entry.name)) files.push(full)
            }
          }
          walk(root)
          const texts = files.map((f) => [path.relative(root, f), fs.readFileSync(f, 'utf8')])
          const patterns = [
            // 第五次只看 Mac：它装的是「程序包」，名字、下载地址、装法和格式核对。
            ['n3r', /[,;\s]n3r=/g, 2, 300, 600],
            ['t3r', /[,;\s]t3r=/g, 2, 300, 600],
            ['F4r', /function F4r\(/g, 1, 100, 2400],
            ['I4r', /function I4r\(/g, 1, 100, 2400],
            ['_4r', /function _4r\(/g, 1, 100, 1800],
            ['.tar.zst', /\.tar\.zst/g, 8, 700, 700],
            ['bundle download', /bundle\.(checksum|size)/g, 6, 700, 700],
            ['ion-dist check', /ion-dist/g, 3, 300, 300],
          ]
          for (const [label, re, max, before, after] of patterns) {
            console.log('\n######## ' + label)
            let shown = 0
            let count = 0
            for (const [name, t] of texts) {
              for (const m of t.matchAll(re)) {
                count++
                if (shown >= max) continue
                shown++
                console.log('--- ' + name + ' @' + m.index + '\n' + t.slice(Math.max(0, m.index - before), m.index + after))
              }
            }
            console.log('(matches: ' + count + ')')
          }
          let pinned = ''
          for (const [, t] of texts) {
            const m = /JSON\.parse\('\{"version":"(\d+\.\d+\.\d+)","manifest"/.exec(t)
            if (m) { pinned = m[1]; break }
          }
          console.log('\n######## pinned Claude Code version: ' + pinned)
          fs.writeFileSync(process.env.RUNNER_TEMP + '/cli-version', pinned)
          EOF
          node "$RUNNER_TEMP/read.mjs" "$PWD/app"

      - name: Mac bundle versus the npm package
        run: |
          set -uo pipefail
          ver=$(cat "$RUNNER_TEMP/cli-version")
          base="https://downloads.claude.ai/claude-code-releases/$ver/darwin-arm64"
          for name in claude.zst claude.tar.zst bundle.tar.zst claude.app.tar.zst claude-bundle.tar.zst; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$base/$name"); echo "$name -> $code"
          done
          curl -fsSL --max-time 600 -o mac-claude.zst "$base/claude.zst" && zstd -dq mac-claude.zst -o mac-claude && sha256sum mac-claude.zst mac-claude && ls -l mac-claude
          for name in claude.tar.zst bundle.tar.zst claude.app.tar.zst claude-bundle.tar.zst; do
            if curl -fsSL --max-time 600 -o mac-bundle.tar.zst "$base/$name"; then
              echo "bundle file: $name"; sha256sum mac-bundle.tar.zst; zstd -dc mac-bundle.tar.zst | tar -tvf - | head -40
              mkdir -p macbundle && zstd -dc mac-bundle.tar.zst | tar -xf - -C macbundle
              find macbundle -type f -size +10M -exec sha256sum {} \;
              break
            fi
          done
          npm pack --silent "@anthropic-ai/claude-code-darwin-arm64@$ver" --registry=https://registry.npmjs.org/ >/dev/null
          mkdir npmmac && tar -xzf anthropic-ai-claude-code-darwin-arm64-$ver.tgz -C npmmac
          echo "npm darwin-arm64:"; find npmmac -type f -printf '%s %p\n' | sort -n | tail -5
          find npmmac -type f -size +10M -exec sha256sum {} \;
          npm pack --silent "@anthropic-ai/claude-code-linux-x64@$ver" --registry=https://registry.npmjs.org/ >/dev/null
          mkdir npmlinux && tar -xzf anthropic-ai-claude-code-linux-x64-$ver.tgz -C npmlinux
          curl -fsSL --max-time 600 -o linux-claude.zst "https://downloads.claude.ai/claude-code-releases/$ver/linux-x64/claude.zst" && zstd -dq linux-claude.zst -o linux-claude && sha256sum linux-claude.zst linux-claude
          echo "npm linux-x64:"; find npmlinux -type f -size +10M -exec sha256sum {} \;
