# 首次配置 COS 时导入已发布的 GitHub 安装包；不重建、不重新发布，也不接触 R2 更新源。
# 勾「只补历史」时只核对 COS 上已有的旧版本安装包，记进下载清单的旧版本（教程下载页撤回时退回用），不上传文件。
name: sync-published-manager-cos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 正式 v0.x.x 标签；留空导入当前最新正式版本
        type: string
        required: false
        default: ''
      history_only:
        description: 只补历史：只核对 COS 上已有的这一版安装包并记进下载清单的旧版本，不上传、不改当前版本；必须填标签
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# 与 publish-release 里同步 COS 的 cos-sync 作业串行，防止星芒 COS latest 索引交错写入。
# 不进 update-feed：这里不碰 R2，一传几个小时也不该挡住发布、回滚和维护开关。
concurrency:
  group: cos-manager-publish
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'xufei5620/xingmang-ai-manager' && github.ref == 'refs/heads/main' && vars.XINGMANG_COS_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cos-sync
    # 往 COS 上海只能传 120～200 KB/s，一个版本的安装包要传一个小时上下，断网时还要等着
    # 重试；GitHub 托管的作业最长 6 小时，留半小时余量。
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install locked script dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Import verified GitHub release installers to Tencent COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET || 'xingmang-downloads-1342302199' }}
          COS_REGION: ${{ vars.COS_REGION || 'ap-shanghai' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          XINGMANG_COS_MULTIPART_ENABLED: ${{ vars.XINGMANG_COS_MULTIPART_ENABLED || 'false' }}
          XINGMANG_COS_MULTIPART_CONCURRENCY: ${{ vars.XINGMANG_COS_MULTIPART_CONCURRENCY || '8' }}
          XINGMANG_COS_ACCELERATE: ${{ vars.XINGMANG_COS_ACCELERATE || 'false' }}
          MANAGER_RELEASE_TAG: ${{ inputs.tag || '' }}
          MANAGER_HISTORY_ONLY: ${{ inputs.history_only && 'true' || 'false' }}
        run: node scripts/sync-published-manager-cos.cjs
