# 临时：拿官网当前 Claude Desktop（Windows 5.x、Mac 6.x）重核工作区清单格式和放法（只下载核对，不往桶里传），核完就删。
name: tmp-claude-components-5x

on:
  push:
    branches: [claude/project-thread-30ihrb]

permissions:
  contents: read

jobs:
  read:
    strategy:
      fail-fast: false
      matrix:
        source: [windows-msix, mac-zip, windows-nupkg]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: node node_modules/typescript/bin/tsc -p tsconfig.electron.json

      - name: Download the installer and take out app.asar
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            windows-msix)
              loc=$(curl -sS -o /dev/null -w '%{redirect_url}' https://claude.ai/api/desktop/win32/x64/msix/latest/redirect)
              case "$loc" in https://downloads.claude.ai/releases/win32/x64/*/Claude-*.msix) ;; *) echo "unexpected redirect $loc"; exit 1 ;; esac
              entry='app/resources/app.asar' ;;
            mac-zip)
              loc=$(curl -sS -o /dev/null -w '%{redirect_url}' https://api.anthropic.com/api/desktop/darwin/universal/zip/latest/redirect)
              case "$loc" in https://downloads.claude.ai/releases/darwin/universal/*/Claude-*.zip) ;; *) echo "unexpected redirect $loc"; exit 1 ;; esac
              entry='Claude.app/Contents/Resources/app.asar' ;;
            windows-nupkg)
              loc=https://downloads.claude.ai/releases/win32/x64/AnthropicClaude-6.6395.0-full.nupkg
              entry='lib/net45/resources/app.asar' ;;
          esac
          echo "source: $loc"
          curl -fsSL --max-time 900 -o package.zip "$loc"
          ls -l package.zip
          unzip -l package.zip | grep -E 'app\.asar$' || true
          mkdir -p pkg && unzip -qq -n package.zip "$entry" -d pkg
          cp "pkg/$entry" app.asar
          ls -l app.asar

      - name: Read the manifest with the client code
        run: |
          node <<'NODE'
          const { readClaudeDesktopComponentManifest } = require('./dist-electron/claude-desktop-component-manifest.js')
          ;(async () => {
            const manifest = await readClaudeDesktopComponentManifest('app.asar')
            console.log('######## code ' + JSON.stringify(manifest.code))
            if (!manifest.vm) { console.log('######## vm null'); return }
            console.log('######## vm sha ' + manifest.vm.sha)
            for (const platformKey of ['win32', 'unix']) for (const architecture of ['x64', 'arm64']) {
              const files = manifest.vm.files[platformKey][architecture] || []
              console.log(`${platformKey}-${architecture}: ` + files.map((file) => `${file.name} ${file.size} ${file.checksum}`).join(' | '))
            }
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE

      - name: How this version places and verifies the workspace and the Claude Code bundles
        run: |
          set -uo pipefail
          npx --yes @electron/asar@3.4.1 extract app.asar app >/dev/null 2>&1 || echo "some files could not be extracted"
          head -c 300 app/package.json; echo
          cat > "$RUNNER_TEMP/read.mjs" <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'
          const root = process.argv[2]
          const files = []
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) { if (entry.name !== 'node_modules') walk(full) }
              else if (/\.(m?js|cjs)$/.test(entry.name)) files.push(full)
            }
          }
          walk(root)
          const texts = files.map((f) => [path.relative(root, f), fs.readFileSync(f, 'utf8')])
          function show(label, name, text, index, before, after) {
            console.log(`--- ${label} ${name} @${index}\n` + text.slice(Math.max(0, index - before), index + after).replace(/\n/g, ' '))
          }
          function escape(value) { return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') }
          function enclosingName(text, index) {
            const window = text.slice(Math.max(0, index - 30000), index)
            let name = null
            for (const m of window.matchAll(/(?:function\s+([\w$]+)|(?:async\s+)?([\w$]+))\(([\w$,=.\s{}]*)\)\{/g)) name = m[1] || m[2]
            return name
          }
          function callers(label, name, maximum, before, after) {
            if (!name) { console.log(`(no name for ${label})`); return }
            const re = new RegExp(`(?<![\\w$.])${escape(name)}\\(`, 'g')
            let shown = 0
            for (const [file, text] of texts) for (const m of text.matchAll(re)) {
              if (/function\s+$/.test(text.slice(Math.max(0, m.index - 10), m.index))) continue
              if (shown++ < maximum) show(`${label} caller of ${name}`, file, text, m.index, before, after)
            }
            console.log(`(${label}: ${shown} call sites of ${name})`)
          }
          function anchor(label, literal, maximum, before, after) {
            console.log('\n######## ' + label)
            const found = []
            for (const [file, text] of texts) {
              let at = text.indexOf(literal)
              while (at >= 0) { found.push([file, text, at]); at = text.indexOf(literal, at + literal.length) }
            }
            for (const [file, text, at] of found.slice(0, maximum)) show(label, file, text, at, before, after)
            console.log(`(${label}: ${found.length} matches)`)
            return found
          }
          function regex(label, re, maximum, before, after) {
            console.log('\n######## ' + label)
            const found = []
            for (const [file, text] of texts) for (const m of text.matchAll(re)) found.push([file, text, m])
            for (const [file, text, m] of found.slice(0, maximum)) show(label, file, text, m.index, before, after)
            console.log(`(${label}: ${found.length} matches)`)
            return found
          }
          function variable(label, re, maximum, before, after) {
            console.log('\n######## ' + label)
            for (const [file, text] of texts) for (const m of text.matchAll(re)) {
              const name = m[1]
              console.log(`(${label}: ${file} defines ${name})`)
              const use = new RegExp(`(?<![\\w$.])${escape(name)}(?![\\w$])`, 'g')
              let shown = 0
              for (const u of text.matchAll(use)) {
                if (u.index === m.index) continue
                if (shown++ < maximum) show(`${label} use of ${name}`, file, text, u.index, before, after)
              }
              console.log(`(${label}: ${shown} uses of ${name} in ${file})`)
            }
          }

          // Cowork workspace: status check, cache decompress, warm promote, download, adopted marker.
          for (const [label, literal] of [['bundle status', '[Bundle:status] ${t} missing'], ['cache decompress', '[cache] No cached compressed file'],
            ['warm promote', '[warm] Promoting warm file'], ['warm start', '[warm] Starting warm download']]) {
            const found = anchor(label, literal, 1, 2500, 600)
            for (const [, text, at] of found.slice(0, 1)) callers(label, enclosingName(text, at), 4, 2500, 1500)
          }
          variable('adopted marker', /([\w$]+)="\.cowork-adopted"/g, 8, 1500, 1200)
          variable('download failed text', /([\w$]+)="Claude's workspace download failed: "/g, 3, 2500, 800)
          for (const [, text, m] of regex('vm base url', /function ([\w$]+)\(\)\{return`https:\/\/downloads\.claude\.ai\/vms\/linux\//g, 2, 200, 400)) callers('vm base url', m[1], 4, 2500, 1500)

          // Claude Code (Mac bundle, Windows exe, Linux in the VM): where it goes and how a placed one is recognised.
          regex('installDirFor', /installDirFor\(e,t,r\)\{/g, 2, 100, 700)
          regex('getBinaryPathForTarget', /getBinaryPathForTarget\(e,t,r=this/g, 1, 100, 4000)
          for (const [file, text, m] of regex('bundle extract and marker', /await ([\w$]+)\(u,o,s\),a\.step="marker",await ([\w$]+)\(o,s,r\.checksum\)/g, 1, 300, 300)) {
            for (const name of [m[1], m[2]]) {
              const def = text.indexOf(`function ${name}(`)
              if (def >= 0) show(`definition of ${name}`, file, text, def, 50, 2500)
            }
            const dir = /\.installDirFor\(e,t,r\.checksum\),s=[\w$.]+\(o,([\w$]+)\)/.exec(text)
            if (dir) { const def = text.indexOf(`${dir[1]}=`); if (def >= 0) show(`definition of ${dir[1]}`, file, text, def, 50, 200) }
          }
          anchor('targetVersion', 'targetVersion', 6, 400, 600)
          anchor('claude-code-vm', 'claude-code-vm', 6, 800, 2500)
          EOF
          node "$RUNNER_TEMP/read.mjs" "$PWD/app"
