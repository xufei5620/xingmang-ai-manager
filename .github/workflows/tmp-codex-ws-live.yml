# 临时：核 Codex 在线路2 上换模型、插话、停止、子代理会不会报错（2026-11-19 服务端转发层上线后，yoyo 亲手同意这一次读巡检密钥打线上），核完就删。
name: tmp-codex-ws-live

on:
  push:
    branches: [claude/project-thread-xbpack]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install real Codex binaries
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/c1691" @openai/codex@0.169.1-linux-x64 --registry=https://registry.npmjs.org/
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/c1690a" @openai/codex@0.169.0-alpha.11.1-linux-x64 --registry=https://registry.npmjs.org/
          for d in c1691 c1690a; do "$RUNNER_TEMP/$d/node_modules/@openai/codex/vendor/x86_64-unknown-linux-musl/bin/codex" --version; done
      - name: Can the runner reach line 2 (no key)
        run: curl -sS -o /dev/null -w 'GET /v1/models without key -> HTTP %{http_code}\n' --max-time 20 https://xm-direct.solov.cc/v1/models || true
      - name: Drive Codex against line 2
        env:
          XM_KEY: ${{ secrets.XINGMANG_CLI_PATROL_KEY }}
          BASE_URL: https://xm-direct.solov.cc/v1
          CATALOG: bundled-catalog/codex-models/models.json
        run: |
          CODEX_BINS="0.169.1=$RUNNER_TEMP/c1691/node_modules/@openai/codex/vendor/x86_64-unknown-linux-musl/bin/codex,0.169.0-alpha.11.1=$RUNNER_TEMP/c1690a/node_modules/@openai/codex/vendor/x86_64-unknown-linux-musl/bin/codex" \
            node .github/tmp-codex-ws-live.cjs
