# 临时：在 Mac 上比 main、#2025、#2025 的底座 main 三份代码的开发版首屏，带主进程卡顿记录（e2e/macos-dev-origin.test.mjs），核完就删
name: tmp-dev-origin-probe
on:
  push:
    branches: [claude/project-thread-b2bc4e]
permissions:
  contents: read
jobs:
  rounds:
    strategy:
      fail-fast: false
      matrix:
        code: [this-branch, with-2025, base-0b99e0c]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Put #2025's merge commit under this branch's two test files
        if: matrix.code == 'with-2025'
        run: |
          git fetch --no-tags origin refs/pull/2025/merge
          git checkout --detach FETCH_HEAD
          git checkout "$GITHUB_SHA" -- e2e/macos-dev-origin.test.mjs e2e/signed-out-smoke-isolation.mjs
      - name: Go back to the main commit #2025 is merged onto
        if: matrix.code == 'base-0b99e0c'
        run: |
          git checkout --detach 0b99e0c27176c77e08f20e37c33c6bcd0e8e613c
          git checkout "$GITHUB_SHA" -- e2e/macos-dev-origin.test.mjs e2e/signed-out-smoke-isolation.mjs
      - run: git log --oneline -1 && git status --short
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - name: Restore the Electron download for this version
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-arm64-x64-${{ hashFiles('node_modules/electron/package.json') }}
      - name: Install the Electron binary
        timeout-minutes: 20
        run: node scripts/ci-ensure-electron-binary.cjs
      - run: npx --no-install playwright install chromium
      - name: Same predecessors as macos-test (browser suites warm the Vite cache)
        run: |
          npm run test:browser > /dev/null 2>&1 || echo "test:browser failed"
          npm run test:mac:release-keychain > /dev/null 2>&1 || echo "release-keychain failed"
          npm run test:mac:proxy > /dev/null 2>&1 || echo "mac:proxy failed"
      - name: Compile then test, as test:mac:dev-origin does, three rounds
        run: |
          for i in 1 2 3; do
            echo "=== compile round $i"
            npm run compile > /dev/null 2>&1 || echo "compile failed"
            node --test e2e/macos-dev-origin.test.mjs 2>&1 | grep -E '^(not )?ok 2|^# (dev server|electron|first window|document|welcome|timeline)|error:' || true
          done
      - name: Test only, four rounds
        run: |
          for i in 1 2 3 4; do
            echo "=== plain round $i"
            node --test e2e/macos-dev-origin.test.mjs 2>&1 | grep -E '^(not )?ok 2|^# (dev server|electron|first window|document|welcome|timeline)|error:' || true
          done
