# 一次性探测（docs/COLLABORATION.md §3）：Antigravity 桌面端从哪里知道最新版本，读官方 Linux 包里的 product.json（不解开、不运行），再问它写的更新地址。用完就删。
name: tmp-agy-desktop-probe

on:
  push:
    branches: [claude/project-thread-gwf95j]
    paths: ['.github/tmp-agy-desktop-probe/**', '.github/workflows/tmp-agy-desktop-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I .github/tmp-agy-desktop-probe/probe.py
