# 开着加速时卸载：卸载程序要先把系统代理还原、删掉开机项，再删文件。
#
# 这条路径只在真的 NSIS 卸载程序里跑得到，quality.yml 的 windows-package 不打安装包，
# 沙箱里也跑不了 NSIS。这里在 Windows runner 上现场出一份不签名、不发布的安装包
# （同 test-build.yml 的 XINGMANG_LOCAL_BUILD=1 + --publish never），静默装上，
# 把机器摆成「加速辅助进程已被卸载程序强行结束」的样子，再静默卸载，检查系统代理
# 回到了原样、恢复记录和开机项都没了。步骤见 scripts/windows-uninstall-cleanup-smoke.ps1。
#
# 同一个安装包再查一件只在真卸载程序里才有的事：把公共桌面和公共开始菜单设成谁都写不进去，
# 让安装程序自己把图标补建在当前用户那里；升级时这两个图标留着，卸载时删掉，之后装到别的
# 文件夹还能再补出来；桌面路径里有联接、图标换成了符号链接时，卸载程序不跟过去删。
# 步骤见 scripts/windows-uninstall-shortcuts-smoke.ps1。
#
# 还查一件也只有真安装程序才有的事：装到 Program Files 以外、谁都能改的文件夹时，安装目录
# 被收紧成只有管理员能改；从老版本留下的宽松目录升级时同样收紧，目录里指向别处的联接不跟过去改；
# 装在 Program Files 里的原样不动。步骤见 scripts/windows-install-directory-acl-smoke.ps1。
#
# 最后查升级时旧版本卸载程序挪不走旧文件的两种情况：安装清单里记着的文件已经没了（从现在发布的
# 那一版升上来，跑的是它的卸载程序），以及旧文件被别的程序占着：安装程序用中文说清楚、能重试，
# 取消时旧版本原样留着。步骤见 scripts/windows-upgrade-blocked-smoke.ps1。
#
# 打一次包要几分钟，所以不进必需的 quality 门禁，只在碰到这条路径的改动上跑，
# 也可以手动触发。
name: windows-uninstall-smoke

on:
  pull_request:
    paths:
      - build/installer.nsh
      - electron-builder.config.cjs
      - electron/platform/entry.ts
      - electron/uninstall-cleanup*.ts
      - electron/platform/windows-system-proxy.ts
      - electron/platform/system-service.ts
      - electron/login-launch.ts
      - scripts/windows-acceleration-recovery.ps1
      - scripts/windows-uninstall-cleanup-smoke.ps1
      - scripts/windows-uninstall-shortcuts-smoke.ps1
      - scripts/windows-install-directory-acl-smoke.ps1
      - scripts/windows-upgrade-blocked-smoke.ps1
      - .github/workflows/windows-uninstall-smoke.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uninstall-cleanup:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npm run compile
      - name: Build unsigned NSIS installer (never publishes)
        run: npx --no-install electron-builder --config electron-builder.config.cjs --win --x64 --publish never
        env:
          XINGMANG_LOCAL_BUILD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install, uninstall with acceleration left on, and check the network is back
        # 两次安装、两次直接清理、两次卸载，每次清理冷启动 PowerShell 常要近一分钟。
        timeout-minutes: 20
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*Setup*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'no installer was built' }
          ./scripts/windows-uninstall-cleanup-smoke.ps1 -Installer $installer.FullName
      - name: Uninstall removes the shortcuts the installer put in the user's own profile, upgrades keep them, links are not followed
        # 两次安装、两次覆盖安装、两次卸载，每次卸载都要冷启动一次清理。
        timeout-minutes: 10
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*Setup*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'no installer was built' }
          ./scripts/windows-uninstall-shortcuts-smoke.ps1 -Installer $installer.FullName
      - name: Installing outside Program Files leaves the folder admin-only, upgrades from a loose folder lock it again, links are not followed
        # 一次装进 Program Files 再卸，一次装进宽松目录、一次升级、一次卸载。
        timeout-minutes: 15
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*Setup*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'no installer was built' }
          ./scripts/windows-install-directory-acl-smoke.ps1 -Installer $installer.FullName
      - name: Download the Windows installer of the latest release
        # 客户电脑上装着的就是它；从它升上来，跑的才是客户那边的旧卸载程序。只读，不碰发布。
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-Setup.exe' --dir released
          if ($LASTEXITCODE -ne 0) { throw "gh release download exited $LASTEXITCODE" }
      - name: Upgrading over a file something else holds asks in Chinese and can retry, a recorded file that has gone does not block it
        # 三段各装一次、升级一到两次、卸一次，卸载要冷启动一次清理。
        timeout-minutes: 30
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*Setup*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'no installer was built' }
          $released = Get-ChildItem -Path released -Filter '*-Setup.exe' | Select-Object -First 1
          if ($null -eq $released) { throw 'the latest release has no Windows installer' }
          ./scripts/windows-upgrade-blocked-smoke.ps1 -Installer $installer.FullName -ReleasedInstaller $released.FullName
