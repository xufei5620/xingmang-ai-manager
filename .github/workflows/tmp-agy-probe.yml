# 临时：核 agy 官方安装做了哪些事（Windows 的 PATH、Mac 的签名和终端设置），核完就删。
name: tmp-agy-probe

on:
  push:
    branches:
      - claude/project-thread-gwf95j

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe the agy installer on Windows
        shell: pwsh
        run: ./.github/tmp-agy-probe/install-windows.ps1

  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe the agy installer on macOS
        run: bash .github/tmp-agy-probe/install-mac.sh
