# 临时：核 WorkBuddy 国内版、海外版安装包里的程序名、卸载登记和配置目录，核完就删
name: tmp-workbuddy-installers
on:
  push:
    branches: [claude/project-thread-7931oj]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: win-domestic
            url: https://download.codebuddy.cn/workbuddy/saas/win32-x64-user/WorkBuddy-win32-x64-user-5.8.3.41334564-db0e9b51.exe
            sha256: 824de10f3196c501004f540eb84ee881292fef2f5df9fb3fc48af9ea5366c03c
            file: setup.exe
          - edition: win-global
            url: https://download.codebuddy.ai/workbuddy/saas/win32-x64-user/WorkBuddy-win32-x64-user-5.9.4.42593613-fa0a0901.exe
            sha256: 6ff4be433d664ad14c88210b5b82ebb3674d7047aab8ae52459006c587be2ee0
            file: setup.exe
          - edition: mac-global
            url: https://codebuddy-1328495429.cos.accelerate.myqcloud.com/workbuddy/saas/darwin-arm64/WorkBuddy-darwin-arm64-5.11.4.44121853-0026dff0.dmg
            sha256: 804a6e445ee8f957d0ff675bee1923c54de18ea4f121fb3eef2cb41fe0ece2df
            file: setup.dmg
    steps:
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip p7zip-full osslsigncode >/dev/null || true
          ls -l /usr/bin/7z* || true
          (command -v 7zz || command -v 7z) && $(command -v 7zz || command -v 7z) | head -3
      - name: Download
        run: |
          curl -fsSL --retry 3 -o "${{ matrix.file }}" "${{ matrix.url }}"
          echo "${{ matrix.sha256 }}  ${{ matrix.file }}" | sha256sum -c -
          ls -l "${{ matrix.file }}"
      - name: Windows installer
        if: startsWith(matrix.edition, 'win-')
        run: |
          Z=$(command -v 7zz || command -v 7z)
          echo '== installer listing'; $Z l setup.exe | tail -n 30
          mkdir -p nsis && (cd nsis && $Z x -y ../setup.exe >/dev/null || true)
          echo '== nsis files'; find nsis -maxdepth 3 -type f -printf '%s %p\n' | sort -k2 | head -n 60
          nsi=$(find nsis -maxdepth 1 -name '*.nsi' | head -1)
          if [ -n "$nsi" ]; then
            echo "== $nsi"
            grep -n -i -E 'Uninstall\\|DisplayName|DisplayIcon|InstallLocation|DisplayVersion|"Publisher|QuietUninstallString|\.exe"|Programs|SetShellVarContext|SetRegView|workbuddy' "$nsi" | head -n 150
          fi
          archive=$(find nsis -name 'app-64.7z' -o -name 'app-*.7z' | head -1)
          if [ -n "$archive" ]; then
            mkdir -p app && $Z x -y "$archive" -oapp >/dev/null
            echo '== exe files'; find app -maxdepth 1 -iname '*.exe' -printf '%s %p\n'
            echo '== top level'; ls app | head -n 50
            for exe in app/*.exe; do
              echo "== signature $exe"; osslsigncode verify -in "$exe" 2>&1 | grep -E '^\s*Subject: CN=Tencent|Signature verification' | head -3 || true
            done
            asar=$(find app -name app.asar | head -1)
            [ -n "$asar" ] && echo "ASAR=$asar" >> "$GITHUB_ENV"
          fi
      - name: macOS disk image
        if: startsWith(matrix.edition, 'mac-')
        run: |
          Z=$(command -v 7zz || command -v 7z)
          mkdir -p dmg && (cd dmg && $Z x -y ../setup.dmg >/dev/null 2>&1 || true)
          find dmg -maxdepth 3 -printf '%p\n' | head -n 30
          app=$(find dmg -maxdepth 4 -type d -name '*.app' | head -1)
          echo "== app bundle: $app"
          if [ -n "$app" ]; then
            python3 - "$app/Contents/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as handle:
              info = plistlib.load(handle)
          for key in ('CFBundleIdentifier', 'CFBundleName', 'CFBundleDisplayName', 'CFBundleExecutable', 'CFBundleShortVersionString'):
              print(key, '=', info.get(key))
          PY
            exe=$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$app/Contents/Info.plist")
            echo '== signing authority'
            strings -n 8 "$app/Contents/MacOS/$exe" | grep -E 'Developer ID Application|TeamIdentifier|^[A-Z0-9]{10}$' | sort -u | head -n 10 || true
            asar=$(find "$app" -name app.asar | head -1)
            [ -n "$asar" ] && echo "ASAR=$asar" >> "$GITHUB_ENV"
          fi
      - name: App source strings
        if: env.ASAR != ''
        timeout-minutes: 5
        run: |
          echo "== $ASAR"; ls -l "$ASAR"
          LC_ALL=C grep -a -o -E '[A-Za-z0-9_.~/\\-]{0,30}\.workbuddy(-ai)?[A-Za-z0-9_./\\-]{0,30}' "$ASAR" | sort | uniq -c | sort -nr | head -n 40 || true
          echo '== models.json mentions'
          LC_ALL=C grep -a -o -E '[A-Za-z0-9_.~/\\-]{0,40}models\.json' "$ASAR" | sort | uniq -c | sort -nr | head -n 20 || true
          echo '== package fields'
          LC_ALL=C grep -a -o -E '"(productName|appId|executableName)": ?"[^"]{1,60}"' "$ASAR" | sort | uniq -c | sort -nr | head -n 20 || true
