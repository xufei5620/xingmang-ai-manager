/* ============================================================ 1. 原型外壳 */

.window { width: 100%; height: 100%; border-radius: var(--r-win); corner-shape: squircle; overflow: hidden; display: grid; grid-template-columns: 216px 1fr; grid-template-rows: auto 1fr; background: var(--win); color: var(--text); font-family: var(--font); overflow: hidden; position: relative; box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); letter-spacing: -.005em; }

/* 窗口圆角：苹果式连续曲率（squircle），两个平台统一。

.winbox { border-radius: var(--r-win); corner-shape: squircle; }
.titlebar { grid-column: 1 / -1; display: flex; align-items: center; user-select: none; }

.win-only, .mac-only, .linux-only { display: none; } [data-os="win"] .win-only { display: contents; } [data-os="mac"] .mac-only { display: contents; } [data-os="linux"] .linux-only { display: contents; }

[data-os="linux"] .window { --r-win: 10px; }

.avatar.photo { background: linear-gradient(135deg, #F6B26B, #C2622E 60%, #5B3A8C); } .avatar.guest { background: var(--panel-2); color: var(--text-3); box-shadow: var(--tile-ring); }

.tier-ok { color: var(--ok); } .tier-warn { color: var(--warn); } .tier-bad { color: var(--bad); }

/* 内容区 */
.main { min-height: 0; overflow: hidden; position: relative; background: var(--bg); background-image: var(--glow-top); background-repeat: no-repeat; display: flex; flex-direction: column; }
.content { flex: 1; min-height: 0; overflow: auto; position: relative; display: flex; flex-direction: column; }

/* ============================================================ 3. 基础组件 */

.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--accent-fg); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 2px rgba(0,0,0,.3), 0 6px 18px var(--accent-glow); }

.welcome .cta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; } .welcome .cta .btn { height: 40px; padding: 0 22px; font-size: var(--font-body-l); border-radius: 10px; }
.welcome .legal { font-size: var(--font-small-compact); color: var(--text-3); } .welcome .legal .link { margin: 0 2px; }

/* 首页缩略预览 */

.composer .opts select.input { width: auto; height: 28px; font-size: var(--font-small-compact); padding-right: 26px; background-position: calc(100% - 13px) 11px, calc(100% - 8px) 11px; }

.params .setting { padding: 10px 14px; } .params .setting .r .input { width: 110px; height: 28px; font-size: var(--font-small-compact); }

/* 记录 / 检查 / 日志 / 教程 / 画布 */

.check-list .it { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); font-size: var(--font-body); } .check-list .it:first-child { border-top: 0; }
.check-list .it .m { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: var(--font-micro-compact); font-weight: 700; color: #fff; } .check-list .it .m.ok { background: var(--ok); } .check-list .it .m.warn { background: var(--warn); } .check-list .it .m.bad { background: var(--bad); } .check-list .it .m.wait { border: 1.5px solid var(--line-2); } .check-list .it .m.run { border: 1.5px solid var(--accent-2); border-right-color: transparent; animation: spin .8s linear infinite; }
.check-list .it span.d { display: block; font-size: var(--font-micro); color: var(--text-3); margin-top: 2px; }

.tut { display: grid; grid-template-columns: 200px 1fr; gap: 22px; align-items: start; }
.tut .step { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; gap: 14px; } .tut .step:first-child { border-top: 0; } .tut .step .n { width: 24px; height: 24px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: var(--font-micro); display: grid; place-items: center; flex: none; }

.canvas-win { position: absolute; left: 60px; top: 40px; width: 900px; height: 600px; background: var(--win); border-radius: 12px; box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 1px var(--line-2); z-index: 40; display: flex; flex-direction: column; overflow: hidden; }

.canvas-win .cv { position: relative; background-image: radial-gradient(var(--line-2) 1px, transparent 1px); background-size: 18px 18px; overflow: hidden; }
.node { position: absolute; width: 190px; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); font-size: var(--font-small-compact); } .node .h { padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; align-items: center; gap: 8px; } .node .h i { width: 8px; height: 8px; border-radius: 50%; } .node .b { padding: 8px 10px; color: var(--text-2); line-height: 1.5; } .node .port { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel-solid); top: 50%; } .node .port.l { left: -6px; } .node .port.r { right: -6px; }
.edge { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }

/* 引导横幅 */
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid rgba(108,124,255,.25); font-size: var(--font-small); margin-bottom: 16px; } .banner svg { width: 15px; height: 15px; color: var(--accent-2); flex: none; } .banner .right { margin-left: auto; display: flex; gap: 8px; }
.placeholder { padding: 40px; color: var(--text-2); font-size: var(--font-body); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
html[style*="--motion: 0"] .window * { transition: none !important; animation: none !important; }

/* ============================================================ 响应式：窗口变窄时的降级规则 */
@container (max-width: 1240px) {
  .home-grid { grid-template-columns: 1fr; }
  .home-grid .col:last-child { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }
  .settings-grid { grid-template-columns: 1fr; } .subnav { flex-direction: row; flex-wrap: wrap; position: static; margin-bottom: 14px; }
  .tut { grid-template-columns: 1fr; } .tut .subnav { flex-direction: row; flex-wrap: wrap; }
  .grid2, .grid3 { grid-template-columns: 1fr !important; }
  .welcome { padding: 40px 40px 28px; }
  .welcome .hero { grid-template-columns: 1fr; } .welcome .preview { display: none; } .welcome h1 { font-size: 34px; }
  .welcome .foot { grid-template-columns: 1fr 1fr; } .welcome .support { grid-column: 1 / -1; }
  .page { padding: 24px 24px 32px; }
  .toolbar { flex-wrap: wrap; } .toolbar .count { margin-left: 0; width: 100%; }
  .drawer { width: min(420px, 70%); }
}
@container (max-width: 1100px) {
  .window { grid-template-columns: 60px 1fr; }
  .window .brand strong, .window .nav a .k, .window .nav a .ext, .window .nav a .badge, .window .nav a .lbl, .window .account .who, .window .account .btn, .window .update-row .lbl, .window .nav .chev { display: none; }
  .window .sidebar { padding-left: 8px; padding-right: 8px; } .window .brand { flex-direction: column; gap: 8px; } .window .brand .collapse { margin-left: 0; }
  .window .nav a { justify-content: center; padding: 8px 0; } .window .nav a.active::before { left: -8px; }
  .window .account { padding: 6px 0; align-items: center; background: transparent; border: 0; box-shadow: none; } .window .account .who, .window .account .bal .lbl, .window .account .bal b { display: none; } .window .account .bal { border: 0; padding: 0; } .window .account .bal .btn { width: 32px; padding: 0; } .window .account .bal .btn span { display: none; }
  .chat { grid-template-columns: 180px 1fr; }
  .page-head { flex-wrap: wrap; } .page-head .actions { margin-left: 0; }
  .setting { flex-wrap: wrap; } .setting .r .input { width: 200px; }
  .sess { grid-template-columns: 30px 1fr 90px auto; } .sess .n:nth-child(4) { display: none; }
}

/* 客服二维码：永远黑码白底，保证暗色主题下也能扫 */

.qr.s { width: 88px; height: 88px; padding: 6px; border-radius: 8px; } .qr.m { width: 150px; height: 150px; } .qr.l { width: 180px; height: 180px; }

/* 账号切换面板 */

.tray-menu hr { border: 0; border-top: 1px solid var(--line, rgba(255,255,255,.07)); margin: 4px 0; }

/* 密码强度 / 验证码倒计时 / 滑块验证 */
.strength { display: flex; gap: 4px; margin-top: 6px; } .strength i { flex: 1; height: 3px; border-radius: 2px; background: var(--line-2); } .strength.s1 i:nth-child(1) { background: var(--bad); } .strength.s2 i:nth-child(-n+2) { background: var(--warn); } .strength.s3 i { background: var(--ok); }
.slider-verify { border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); } .slider-verify .track { position: relative; height: 34px; border-radius: 8px; background: var(--line); margin-top: 8px; overflow: hidden; display: grid; place-items: center; font-size: var(--font-small-compact); color: var(--text-3); } .slider-verify .knob { position: absolute; left: 2px; top: 2px; width: 44px; height: var(--statusbar-height); border-radius: 6px; background: var(--panel-solid); box-shadow: var(--shadow); display: grid; place-items: center; cursor: grab; transition: left .5s; } .slider-verify.done .knob { left: calc(100% - 46px); background: var(--ok); color: #fff; } .slider-verify.done .track::before { content: ""; position: absolute; inset: 0; background: var(--ok-soft); }
.steps-h { display: flex; gap: 8px; align-items: center; font-size: var(--font-small-compact); color: var(--text-3); margin-bottom: 2px; } .steps-h b { color: var(--text); font-weight: 600; } .steps-h i { flex: 1; height: 1px; background: var(--line); }

.bell { position: relative; } .bell.has-nb { padding-right: 24px; } .bell .nb { position: absolute; top: 3px; right: 5px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; line-height: 1; border: 2px solid var(--bg); }
.ticker { flex: none; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, var(--accent-soft), transparent 65%); font-size: var(--font-small); }
.ticker .tag { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 6px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: var(--font-micro); } .ticker .tag svg { width: 12px; height: 12px; }
.ticker .slot { flex: 1; min-width: 0; height: 22px; position: relative; overflow: hidden; }
.ticker .it { position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; animation: annin .45s ease-out; }
.ticker .it:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.ticker .it .lv { flex: none; font-size: var(--font-micro-compact); padding: 1px 6px; border-radius: 4px; } .ticker .it strong { font-weight: 600; flex: none; } .ticker .it span { color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@keyframes annin { from { opacity: 0; transform: translateY(9px); } }

.ticker .right { flex: none; display: flex; align-items: center; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .ticker .it { animation: none; } }
.ann-pop { position: absolute; z-index: 25; width: 380px; max-height: 480px; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 14px; corner-shape: squircle; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
[data-theme="dark"] .ann-pop { background: linear-gradient(180deg, #17263F, #122039); }
.ann-pop .hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: var(--font-body); font-weight: 600; } .ann-pop .hd .link { margin-left: auto; font-size: var(--font-small-compact); font-weight: 400; }
.ann-pop .lst { overflow: auto; }
.ann { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; align-items: start; } .ann:first-child { border-top: 0; } .ann:hover { background: var(--panel-2); }
.ann .d { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: transparent; } .ann.unread .d { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.ann strong { display: block; font-size: var(--font-body); font-weight: 600; } .ann.read strong { font-weight: 500; color: var(--text-2); } .ann p { margin: 3px 0 0; font-size: var(--font-small-compact); color: var(--text-3); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.ann-pop .ft { padding: 8px 14px; border-top: 1px solid var(--line); font-size: var(--font-small-compact); color: var(--text-3); display: flex; gap: 12px; }

/* 首次引导气泡 */
.coach { position: absolute; inset: 0; z-index: 35; border-radius: var(--r-win); corner-shape: squircle; }
.coach .hole { position: absolute; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(5,10,20,.62); outline: 2px solid var(--accent); animation: coachin .25s ease-out; }
.coach .tip { position: absolute; width: 300px; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 14px; corner-shape: squircle; box-shadow: var(--shadow); padding: 14px 16px; animation: coachin .25s ease-out; }

.coach .tip .n { font-size: var(--font-micro-compact); color: var(--accent); font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; } .coach .tip strong { display: block; font-size: var(--font-body-l); font-weight: 600; margin-bottom: 4px; } .coach .tip p { margin: 0 0 12px; font-size: var(--font-small); color: var(--text-2); line-height: 1.6; } .coach .tip .acts { display: flex; gap: 8px; align-items: center; } .coach .tip .acts .link { margin-left: auto; font-size: var(--font-small-compact); }
@keyframes coachin { from { opacity: 0; transform: translateY(6px); } }
/* 系统通知模拟（右上角，跟随平台样式） */
.osnotify { position: fixed; top: 64px; right: 24px; z-index: 70; width: 340px; background: #F5F5F7; color: #1C1F23; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.45); padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; animation: slidein .25s ease-out; font-family: var(--font); }
[data-os="win"] .osnotify { border-radius: 8px; background: #202020; color: #fff; } [data-os="linux"] .osnotify { border-radius: 10px; background: #2E3436; color: #fff; }
.osnotify img { width: 36px; height: 36px; } .osnotify strong { display: block; font-size: var(--font-body); font-weight: 600; } .osnotify p { margin: 2px 0 0; font-size: var(--font-small-compact); opacity: .8; line-height: 1.5; } .osnotify .app { font-size: var(--font-micro-compact); opacity: .55; margin-bottom: 2px; }
/* 高对比度 */
.window.hc .btn-secondary { border-color: var(--line-3); } .window.hc .pill { border: 1px solid currentColor; }
/* 快捷键表 */
.kb-table { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; font-size: var(--font-small); align-items: center; } .kb-table .g { grid-column: 1 / -1; font-size: var(--font-micro-compact); color: var(--text-3); margin-top: 6px; }


/* Review v1.1: preserve readable status, shared focus feedback and short-window access. */
.window :is(button,a,input,select,textarea,[tabindex]):focus-visible {
  outline:2px solid var(--info); outline-offset:2px;
}
.trow .st { min-width:var(--tool-status-min); overflow:visible; flex-wrap:wrap; white-space:normal; gap:4px; }
.trow .st .pill { max-width:100%; white-space:nowrap; }
.trow .name strong { font-size:var(--font-body-l); }
.trow .name span { display:block; overflow:hidden; text-overflow:ellipsis; }
.overlay .dialog { max-height:calc(100% - 24px); }
.dialog > .body { min-height:0; overflow-y:auto; }
.dialog > header, .dialog > footer { flex-shrink:0; }
.window [inert] { pointer-events:none; }
.window .field label { color:var(--text-2); }
.window .input::placeholder { color:var(--text-3); opacity:1; }
.window .hc .btn-secondary, .window.hc .btn-secondary { border-color:var(--line-3); }

/* Settings group navigation v1.2 */
.settings-grid .subnav button { appearance:none; border:0; background:transparent; padding:6px 10px; border-radius:7px; font:inherit; font-size:var(--font-body); color:var(--text-2); cursor:pointer; text-align:left; min-height:32px; }
.settings-grid .subnav button.on { background:var(--panel-2); color:var(--text); font-weight:500; }
.settings-grid .subnav button:hover { color:var(--text); background:var(--panel-hover); }
.settings-grid .subnav button:focus-visible { outline:2px solid var(--info); outline-offset:2px; }
.settings-grid .settings-group { min-width:0; }

/* Compact sidebar: keep the account actions inside the 60px rail.
   The desktop account row needs 36 + 9 + 22 = 67px, so stack its
   avatar and existing account-switch action when the rail is compact. */
.window.collapsed .brand {
  min-width: 0;
  padding-inline: 0;
  flex-shrink: 0;
}
.window.collapsed .brand .logo,
.window.collapsed .brand .logo img {
  max-width: 100%;
}
.window.collapsed .sidebar-foot {
  flex-shrink: 0;
}
.window.collapsed .account .top {
  width: 100%;
  flex-direction: column;
  gap: 2px;
}
.window.collapsed .account .bal {
  width: 100%;
  justify-content: center;
}
.window.collapsed .account .bal .btn {
  display: flex;
}
.window[data-os="mac"].collapsed .lights {
  left: 8px;
  gap: 4px;
}

/* Match the existing automatic compact mode as well as manual collapse.
   Preserve the no-sidebar titlebar and all navigation/more/tooltip rules. */
@container (max-width: 1100px) {
  .window:not(.no-sidebar) .brand {
    min-width: 0;
    padding-inline: 0;
    flex-shrink: 0;
  }
  .window:not(.no-sidebar) .brand .logo,
  .window:not(.no-sidebar) .brand .logo img {
    max-width: 100%;
  }
  .window:not(.no-sidebar) .sidebar-foot {
    flex-shrink: 0;
  }
  .window:not(.no-sidebar) .account .top {
    width: 100%;
    flex-direction: column;
    gap: 2px;
  }
  .window:not(.no-sidebar) .account .bal {
    width: 100%;
    justify-content: center;
  }
  .window:not(.no-sidebar) .account .bal .btn {
    display: flex;
  }
  .window[data-os="mac"]:not(.no-sidebar) .lights {
    left: 8px;
    gap: 4px;
  }
}

/* Shared novice-facing hierarchy. Shell geometry remains unchanged. */
.window{font-size:var(--font-body);line-height:var(--line-body)}
.window .btn{height:var(--control-md);min-height:var(--control-md);font-size:var(--font-body)}

.window .btn.icon.sm{width:var(--control-sm);min-width:var(--control-sm)}
.window .btn.icon.xs{width:var(--control-xs);min-width:var(--control-xs)}
.window .input:not(textarea){min-height:var(--control-md);height:var(--control-md);font-size:var(--font-body)}
.window .topbar .btn{min-height:32px;height:32px;font-size:13px}

/* Platform presentation only; the existing 216px / 60px layout and compact-account fix are retained. */
.xm-platform-controls { display:inline-flex; align-items:center; flex-wrap:wrap; gap:10px; }
.xm-platform-controls > label { display:inline-flex; align-items:center; gap:6px; }
.xm-platform-controls > label[hidden], .xm-platform-details[hidden] { display:none; }
.proto-bar .xm-platform-controls select { min-height:30px; max-width:244px; background:#24262D; color:#EDEEF2; }
.proto-bar .pbtn:disabled { opacity:.55; cursor:not-allowed; }
.xm-platform-controls .pbtn:focus-visible { outline:2px solid #D4A355; outline-offset:2px; }
.xm-platform-details { position:absolute; left:24px; top:calc(100% + 8px); width:min(620px,calc(100vw - 48px)); max-height:min(650px,calc(100vh - 200px)); overflow:auto; padding:18px 20px; border:1px solid #4B4F59; border-radius:12px; background:#202228; color:#D9DCE3; box-shadow:0 16px 48px #0008; font-size:13px; line-height:1.6; z-index:60; }
.xm-platform-details > strong { display:block; color:#fff; font-size:15px; }
.xm-platform-details dl { display:grid; grid-template-columns:86px minmax(0,1fr); gap:10px 14px; margin:14px 0; }
.xm-platform-details dt { color:#B7BBC6; }
.xm-platform-details dd { margin:0; overflow-wrap:anywhere; }
.xm-platform-details code { color:#F0D3A4; font-size:12px; }
.xm-platform-details kbd { color:#EDEEF2; background:#2C3039; border-color:#555B68; }
.xm-platform-disclaimer { margin:8px 0 14px; color:#DFC293; }
.xm-platform-sources { margin:12px 0 0; padding-top:10px; border-top:1px solid #3D414B; color:#ADB3C1; }
.xm-platform-sources a { color:#F1CF98; text-underline-offset:3px; }

/* Native-looking shells are scenario illustrations, not pixel-exact OS screenshots. */
.winbox[data-platform-frame="win-legacy"], .window[data-platform-frame="win-legacy"] { border-radius:0; corner-shape:round; }
.winbox[data-platform-frame="win-modern"], .window[data-platform-frame="win-modern"] { border-radius:8px; corner-shape:round; }
.winbox[data-platform-frame="mac-classic"], .window[data-platform-frame="mac-classic"] { border-radius:12px; corner-shape:round; }
.winbox[data-platform-frame="mac-current"], .window[data-platform-frame="mac-current"] { border-radius:18px; corner-shape:round; }
.winbox[data-platform-frame="linux-csd"], .window[data-platform-frame="linux-csd"] { border-radius:10px; corner-shape:round; }
.winbox[data-platform-frame="linux-legacy"], .window[data-platform-frame="linux-legacy"] { border-radius:3px; corner-shape:round; }
.window[data-platform-frame="win-legacy"] .titlebar, .window[data-platform-frame="linux-legacy"] .titlebar { backdrop-filter:none; background:var(--rail); }
.window[data-platform-frame="linux-legacy"] .titlebar .win-controls span { border-radius:3px; }
body[data-platform-os="win"] .osnotify { border-radius:6px; }
body[data-platform-os="mac"] .osnotify { border-radius:14px; }
body[data-platform-os="linux"] .osnotify { border-radius:8px; }

/* Lucide UI icons only. Vendor/tool marks never receive these classes. */
.window .xm-ui-icon { width:16px; height:16px; flex:none; stroke-width:1.75; }
.window .nav { min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
.window .nav a { min-height:36px; height:36px; flex-shrink:0; font-size:14px; line-height:20px; gap:10px; padding-block:8px; }
.window .nav a > .xm-ui-icon { width:20px; height:20px; }
.window .nav a > .xm-ui-icon.ext, .window .nav .more-toggle > .xm-ui-icon.chev { width:16px; height:16px; }
.window .nav .more-list { flex-shrink:0; }
.window .nav .sep { flex-shrink:0; }
.window .btn > .xm-ui-icon, .window .kf-btn > .xm-ui-icon { width:18px; height:18px; }
.window .field .xm-ui-icon, .window .input-wrap .xm-ui-icon, .window .cmd-trigger > .xm-ui-icon { width:16px; height:16px; }
.window .field .btn > .xm-ui-icon { width:18px; height:18px; }
.window .brand .collapse .xm-ui-icon { width:18px; height:18px; }
.window .update-row > .xm-ui-icon { width:18px; height:18px; }
.window.collapsed .nav a { min-height:36px; height:36px; padding-block:8px; }
@container (max-width:1100px) {
  .window:not(.no-sidebar) .nav a { min-height:36px; height:36px; padding-block:8px; }
}
@media (prefers-reduced-motion:reduce) { .xm-platform-controls *, .xm-platform-details * { scroll-behavior:auto; } }

/* Maintenance modules preserve the existing page/card/settings layout. */
.xm-report{display:block;min-height:300px;width:100%;resize:vertical;white-space:pre;font-size:12px;line-height:1.7}
.xm-report-preview{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 var(--mono)}
.xm-log-button{width:100%;background:transparent;color:var(--text-2);text-align:left;border-left:0;border-right:0;border-bottom:0;font-family:inherit}
.xm-log-button>span:nth-child(3){min-width:0;overflow-wrap:anywhere}
.xm-update-grid{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
.xm-update-main{display:flex;gap:16px;align-items:center;padding:20px}
.xm-update-copy{flex:1;min-width:0}.xm-update-copy>strong{font-size:15px}.xm-update-copy>p{font-size:12.5px;color:var(--text-2);margin:5px 0 0;line-height:1.6}
.xm-update-copy progress{width:100%;margin-top:10px;accent-color:var(--accent)}
.xm-update-notes{margin:0;padding-left:18px;font-size:12.5px;line-height:1.8;color:var(--text-2)}
.xm-maintenance-note{margin:16px}.xm-maintenance-note .btn{margin-top:10px;margin-right:8px}
.xm-health-return{display:flex;align-items:center;gap:10px;padding:8px 24px 0;color:var(--text-3);font-size:12px}
.check-list .it .m.optional,.check-list .it .m.cancelled{color:var(--text-3);background:var(--panel-2);border:1px solid var(--line-2)}
.xm-setting-save{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:7px;min-height:28px}.xm-setting-save.failed{color:var(--bad)}.xm-setting-save.saved{color:var(--ok)}
.xm-setting-subtext{display:block;color:var(--text-3);font-size:12px;margin-top:6px;line-height:1.5}
.xm-maintenance-settings .switch{padding:0;border:0;cursor:pointer;flex:none}.xm-maintenance-settings .switch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.xm-maintenance-settings .r{flex-wrap:wrap}.xm-settings-status{margin:0 0 12px;min-height:20px;color:var(--text-3);font-size:12px}
.xm-tutorial-details{padding:14px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2);line-height:1.7}.xm-tutorial-details summary{cursor:pointer}
#win[data-motion="reduced"] *,#win[data-motion="reduced"] *::before,#win[data-motion="reduced"] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:0s!important;scroll-behavior:auto!important}
@media(max-width:900px){.xm-update-grid{grid-template-columns:1fr}.xm-update-main{flex-wrap:wrap}.xm-log-button{grid-template-columns:65px 44px minmax(0,1fr)}.xm-log-button>span:last-child{display:none}}

.xm-chat-error{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 14px 10px;border:1px solid var(--line-2);background:var(--warn-soft);border-radius:10px;flex:none}.xm-chat-error>div{flex:1;min-width:0}.xm-chat-error strong{font-size:13px}.xm-chat-error p{font-size:12.5px;color:var(--text-2);line-height:1.65;margin:5px 0 0}.xm-chat-error .btn{flex:none}.window .btn-bal.bad,.statusbar .upd .dot{animation:none}

.xm-review-select{display:flex;gap:7px;align-items:center;color:#C6CAD3}.xm-review-select select{max-width:250px;background:#24262D;color:#C6CAD3;border:1px solid #3A3D47;border-radius:6px;padding:5px 8px;font:inherit}.xm-review-select optgroup{color:#EDEEF2}

/* Keep the original compact single-column tray; theme tokens belong to this external host. */

/* ============================================================
   99-beauty · 视觉质感增强层（纯 CSS 覆盖，不改结构/文案/交互）
   原则：只引用 00 令牌体系中的变量；不动布局尺寸；不新增动效时长；
   高对比模式（.hc）与减少动画设置下不产生副作用。
   ============================================================ */

/* ---------- 1. 全局质感 ---------- */

/* 选中文本：品牌金柔光，替代系统默认蓝 */
.window ::selection { background: rgba(212, 163, 85, .32); color: inherit; }
[data-theme="light"] .window ::selection { background: rgba(212, 163, 85, .38); }

/* 细滚动条：半通明，hover 才显现存在感 */
.window *::-webkit-scrollbar { width: 10px; height: 10px; }
.window *::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
.window *::-webkit-scrollbar-thumb:hover { background: var(--line-3); border: 3px solid transparent; background-clip: padding-box; }
.window *::-webkit-scrollbar-track, .window *::-webkit-scrollbar-corner { background: transparent; }

/* 数字：表格数字等宽对齐，余额/版本/用量不再跳动 */
.stat b, .acct .bal b, .toolbar .count, .rows .row .when, .status-list .it .v,
.trow .name span, .trow .st .mono, .setup .later .n {
  font-variant-numeric: tabular-nums;
}

/* ---------- 2. 窗口与区域层次 ---------- */

/* 侧栏：整体再压暗半级，顶部给品牌区一束极轻的皮肤色光晕，让“星芒”有舞台感 */
.sidebar {
  background: linear-gradient(180deg, var(--accent-soft), transparent 180px), var(--rail);
}

/* 卡片：暗色下补一层柔和投影，把卡片从背景里“托”出来；
   浅色下把投影调成暖棕，避免灰色脏影 */
[data-theme="dark"] .card { box-shadow: var(--tile-ring), 0 2px 10px rgba(2, 6, 14, .35); }
[data-theme="light"] .card { box-shadow: var(--tile-ring), 0 2px 12px rgba(60, 45, 15, .07); }

/* 列表行 hover：除背景外同步提亮上缘分隔线，过渡更顺滑 */
.trow, .rows .row, .tips .it, .status-list .it { transition: background var(--duration-fast) var(--ease-standard); }

/* ---------- 3. 侧栏导航选中态 ---------- */

/* 原来：灰底 + 内描边 + 左侧 2px 金条。
   现在：金色柔光自左向右渐隐，文字与图标染金，选中页一眼可辨 */
.nav a.active {
  background: linear-gradient(90deg, var(--accent-soft), transparent 85%);
  box-shadow: none;
  color: var(--text);
}
[data-theme="dark"] .nav a.active { color: var(--accent-2); }
[data-theme="dark"] .nav a.active svg { color: var(--accent-2); }
[data-theme="light"] .nav a.active { color: var(--accent); }
[data-theme="light"] .nav a.active svg { color: var(--accent); }
.nav a { transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }

/* ---------- 4. 控件精修 ---------- */

/* 主按钮：按压时有明确的物理反馈 */
.btn-primary { transition: filter var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.btn-primary:active { filter: brightness(.94); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px var(--accent-glow); }
.btn-secondary:active { filter: brightness(.96); }

/* 输入框：hover 即提亮边框，focus 前就有回应 */
.input { transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.input:hover:not(:focus) { border-color: var(--line-3); }

/* 命令面板入口：键盘提示与搜索图标拉开明度差 */
.cmd-trigger { transition: border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard); }
.cmd-trigger:hover { background: var(--panel-hover); }

/* 页签选中下划线：纯色改为金色渐隐，更精致 */
.tabs a.on {
  border-image: linear-gradient(90deg, var(--accent), var(--accent-2)) 1;
}

/* ---------- 5. 通知与浮层 ---------- */

/* 公告条左侧标签：金色渐变 pill + 柔光，与主按钮同一材质语言 */
.ticker .tag {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 2px 8px var(--accent-glow);
}

/* 异常提示条：顶部加一线内高光，避免色块“贴死”在顶栏下 */
.alertbar { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
[data-theme="light"] .alertbar { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }

/* Toast：毛玻璃 + 更大圆角，浮在内容上不闷 */
.toast {
  border-radius: 12px;
  corner-shape: squircle;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
[data-theme="dark"] .toast { background: color-mix(in srgb, var(--panel-solid) 88%, transparent); }
[data-theme="light"] .toast { background: rgba(255, 255, 255, .88); }

/* ---------- 6. 状态栏 ---------- */

/* 更新胶囊：金色渐变压住呼吸圆点，视觉重心更稳 */
.statusbar .upd {
  background: linear-gradient(90deg, var(--accent-soft), transparent 130%);
  box-shadow: inset 0 0 0 1px var(--accent-soft);
}

/* ---------- 7. 收起侧栏：未读点改为图标角标，不再挤偏图标 ---------- */
.window.collapsed .nav a .dotb { position: absolute; top: 4px; right: 8px; margin-left: 0; z-index: 1; }

/* ---------- 8. 品牌图标（b-*）内容在 24 格 viewBox 中顶部锚定，
   统一光学校正：向下平移约 18.5% 使视觉居中（工具行、胶囊、分段按钮通用） ---------- */
.ico svg:has(use[href^="#b-"]) { transform: translateY(18.5%); }

/* ============================================================
   99-skin · 多皮肤主题（整氛围方案）+ 欢迎页星轨视觉
   每套皮肤同时定义暗/亮两个模式的【中性色 + 强调色 + 环境光晕】，
   即“换皮肤 = 换整个界面气质”，不只是换按钮颜色。
   晨曦金 = 现行默认（v3.0.4 规范值），不覆盖任何变量。
   ============================================================ */

/* ---------- 极夜黑金 · 近纯黑中性 + 香槟金 ---------- */
[data-theme="dark"][data-skin="obsidian"] {
  --win:#08090C; --rail:#060708; --bg:#0B0C10;
  --panel:rgba(255,255,255,.045); --panel-solid:#15171C; --panel-hover:rgba(255,255,255,.07); --panel-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16); --line-3:rgba(255,255,255,.27);
  --text:#F2F3F5; --text-2:#A9AFBB; --text-3:#8D94A0; --kbd-bg:rgba(255,255,255,.08);
  --accent:#E0BE7C; --accent-2:#EDD39B; --accent-fg:#141210; --accent-glow:rgba(224,190,124,.30); --accent-soft:rgba(224,190,124,.15); --info:#9FB2C8;
  --overlay:rgba(2,3,5,.66); --btn-2-bg:rgba(255,255,255,.06); --btn-2-hover:rgba(255,255,255,.11);
  --glow-top:radial-gradient(900px 380px at 12% -8%, rgba(224,190,124,.12), transparent 60%), radial-gradient(700px 300px at 90% 0%, rgba(120,126,138,.22), transparent 60%);
  --tile-ring:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.05);
  --card-grad:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
}
[data-theme="light"][data-skin="obsidian"] {
  --win:#F1EDE2; --rail:#EDE8DB; --bg:#F7F3E9;
  --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel-hover:#FBF8F0; --panel-2:#F0EBDD;
  --line:rgba(52,42,20,.09); --line-2:rgba(52,42,20,.15); --line-3:rgba(52,42,20,.26);
  --text:#221E14; --text-2:#5C5340; --text-3:#7A705B; --kbd-bg:#EDE7D8;
  --accent:#96702C; --accent-2:#B99041; --accent-fg:#FFFFFF; --accent-glow:rgba(150,112,44,.22); --accent-soft:rgba(150,112,44,.12); --info:#6A5B38;
  --overlay:rgba(52,42,20,.42); --btn-2-bg:#FFFFFF; --btn-2-hover:#F2EDDF;
  --glow-top:radial-gradient(900px 380px at 12% -8%, rgba(185,144,65,.14), transparent 60%), radial-gradient(700px 300px at 90% 0%, rgba(200,190,160,.3), transparent 60%);
  --tile-ring:inset 0 0 0 1px rgba(52,42,20,.06), 0 1px 2px rgba(52,42,20,.06);
  --card-grad:#FFFFFF;
}

/* ---------- 雾青 · 深石板青 / 冷白 + 青碧 ---------- */
[data-theme="dark"][data-skin="mist"] {
  --win:#0A1518; --rail:#071013; --bg:#0C1A1E;
  --panel:rgba(150,220,210,.05); --panel-solid:#12262B; --panel-hover:rgba(150,220,210,.08); --panel-2:rgba(150,220,210,.08);
  --line:rgba(150,220,210,.10); --line-2:rgba(150,220,210,.17); --line-3:rgba(150,220,210,.28);
  --text:#EAF3F1; --text-2:#9FB8B4; --text-3:#84A09C; --kbd-bg:rgba(150,220,210,.09);
  --accent:#43C6B8; --accent-2:#7BDDD0; --accent-fg:#06201C; --accent-glow:rgba(67,198,184,.30); --accent-soft:rgba(67,198,184,.15); --info:#8FD8CE;
  --overlay:rgba(3,10,12,.64); --btn-2-bg:rgba(150,220,210,.07); --btn-2-hover:rgba(150,220,210,.12);
  --glow-top:radial-gradient(900px 380px at 12% -8%, rgba(67,198,184,.12), transparent 60%), radial-gradient(700px 300px at 90% 0%, rgba(20,70,74,.4), transparent 60%);
  --tile-ring:inset 0 0 0 1px rgba(150,220,210,.10), inset 0 1px 0 rgba(255,255,255,.05);
  --card-grad:linear-gradient(180deg, rgba(150,220,210,.05), rgba(150,220,210,.02));
}
[data-theme="light"][data-skin="mist"] {
  --win:#EAF2F1; --rail:#E6EFEE; --bg:#F0F6F5;
  --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel-hover:#F6FBFA; --panel-2:#E7F0EE;
  --line:rgba(12,58,54,.09); --line-2:rgba(12,58,54,.15); --line-3:rgba(12,58,54,.26);
  --text:#0F2A2E; --text-2:#3F5E5C; --text-3:#5E7A77; --kbd-bg:#E4EEEC;
  --accent:#0F7A72; --accent-2:#159A8E; --accent-fg:#FFFFFF; --accent-glow:rgba(15,122,114,.22); --accent-soft:rgba(15,122,114,.12); --info:#177F78;
  --overlay:rgba(12,58,54,.4); --btn-2-bg:#FFFFFF; --btn-2-hover:#ECF4F2;
  --glow-top:radial-gradient(900px 380px at 12% -8%, rgba(67,198,184,.15), transparent 60%), radial-gradient(700px 300px at 90% 0%, rgba(180,215,212,.35), transparent 60%);
  --tile-ring:inset 0 0 0 1px rgba(12,58,54,.06), 0 1px 2px rgba(12,58,54,.06);
  --card-grad:#FFFFFF;
}

/* ---------- 极光紫 · 紫夜 / 薰衣草白 + 紫罗兰 ---------- */
[data-theme="dark"][data-skin="aurora"] {
  --win:#0D0B1A; --rail:#090716; --bg:#120F22;
  --panel:rgba(180,170,255,.05); --panel-solid:#1B1733; --panel-hover:rgba(180,170,255,.08); --panel-2:rgba(180,170,255,.08);
  --line:rgba(180,170,255,.10); --line-2:rgba(180,170,255,.17); --line-3:rgba(180,170,255,.28);
  --text:#F0EEFB; --text-2:#B3ADE0; --text-3:#9891C6; --kbd-bg:rgba(180,170,255,.09);
  --accent:#9B8CF7; --accent-2:#C0B6FB; --accent-fg:#17122E; --accent-glow:rgba(155,140,247,.32); --accent-soft:rgba(155,140,247,.16); --info:#B3A9F2;
  --overlay:rgba(6,4,16,.64); --btn-2-bg:rgba(180,170,255,.07); --btn-2-hover:rgba(180,170,255,.12);
  --glow-top:radial-gradient(900px 380px at 12% -8%, rgba(155,140,247,.13), transparent 60%), radial-gradient(700px 300px at 90% 0%, rgba(61,58,143,.35), transparent 60%);
  --tile-ring:inset 0 0 0 1px rgba(180,170,255,.10), inset 0 1px 0 rgba(255,255,255,.05);
  --card-grad:linear-gradient(180deg, rgba(180,170,255,.05), rgba(180,170,255,.02));
}
[data-theme="light"][data-skin="aurora"] {
  --win:#ECE9F7; --rail:#E8E4F5; --bg:#F3F1FB;
  --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel-hover:#F8F6FE; --panel-2:#ECE8F8;
  --line:rgba(48,36,110,.09); --line-2:rgba(48,36,110,.15); --line-3:rgba(48,36,110,.26);
  --text:#1D1836; --text-2:#4E466E; --text-3:#6B6288; --kbd-bg:#EAE6F6;
  --accent:#6A5AE0; --accent-2:#8B7CF0; --accent-fg:#FFFFFF; --accent-glow:rgba(106,90,224,.22); --accent-soft:rgba(106,90,224,.12); --info:#6356C9;
  --overlay:rgba(48,36,110,.42); --btn-2-bg:#FFFFFF; --btn-2-hover:#F0EDFA;
  --glow-top:radial-gradient(900px 380px at 12% -8%, rgba(155,140,247,.16), transparent 60%), radial-gradient(700px 300px at 90% 0%, rgba(190,184,235,.35), transparent 60%);
  --tile-ring:inset 0 0 0 1px rgba(48,36,110,.06), 0 1px 2px rgba(48,36,110,.06);
  --card-grad:#FFFFFF;
}

/* 高对比模式优先级压过皮肤的中性线色（皮肤只提供基调，可读性让位） */
[data-theme="dark"].hc[data-skin] {
  --line:rgba(220,228,240,.35); --line-2:rgba(220,228,240,.55); --line-3:rgba(220,228,240,.65);
  --text-2:#C7D3E6; --text-3:#B0BFD4;
}
[data-theme="light"].hc[data-skin] {
  --line:rgba(20,26,40,.35); --line-2:rgba(20,26,40,.55); --line-3:rgba(20,26,40,.65);
  --text-2:#23324A; --text-3:#3E4D65;
}

/* 欢迎页主标题渐变跟随皮肤（默认晨曦金保持原品牌渐变不变） */
[data-skin="obsidian"] .welcome h1 em,
[data-skin="mist"] .welcome h1 em,
[data-skin="aurora"] .welcome h1 em {
  background: linear-gradient(90deg, var(--accent), var(--accent-2) 45%, var(--info));
  -webkit-background-clip: text; background-clip: text;
}

/* ---------- 设置里的皮肤选择器 ---------- */
.skin-row { display: flex; gap: 10px; flex-wrap: wrap; }
.skin-chip { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 8px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-2); font: inherit; font-size: var(--font-small); cursor: pointer; transition: border-color .15s, box-shadow .15s, color .15s; }
.skin-chip:hover { border-color: var(--line-3); color: var(--text); }
.skin-chip.on { border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 3px var(--accent-soft); font-weight: 500; }
.skin-chip .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.25); }
.skin-chip .dot.dawn { background: linear-gradient(135deg, #E6BF7A, #0B1F3B); }
.skin-chip .dot.obsidian { background: linear-gradient(135deg, #EDD39B, #101114); }
.skin-chip .dot.mist { background: linear-gradient(135deg, #7BDDD0, #0C1A1E); }
.skin-chip .dot.aurora { background: linear-gradient(135deg, #C0B6FB, #120F22); }

/* ---------- 欢迎页 · 星轨场景（无框融入版） ----------
   星空铺满整个欢迎页背景，星轨悬浮其上，与品牌主视觉
   （星光金方案丙：星空 + 地平线光晕 + 星之光束）一致 */

/* 全幅星空画布：垫在欢迎页所有内容之下 */
.welcome .sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.welcome .hero, .welcome .foot { position: relative; z-index: 1; }

/* 工作台主区域星空：同一画布层，更稀疏更淡（参数在 JS 侧区分）。
   只把静态布局的栏位抬到画布之上；notice/toast 等绝对定位浮层不动 */
.main > canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.main > #content, .main > .topbar, .main > .ticker, .main > .alertbar, .main > .statusbar { position: relative; z-index: 1; }

/* 星轨场景：去边框、去底板、去阴影，直接浮在星空上 */
.orbit-preview .glow { position: absolute; inset: -10%; background: radial-gradient(46% 42% at 50% 46%, var(--accent-glow), transparent 70%); filter: blur(10px); pointer-events: none; }
[data-theme="light"] .orbit-preview .glow { background: radial-gradient(46% 42% at 50% 46%, var(--accent-soft), transparent 70%); filter: blur(16px); }
.orbit-scene { position: relative; height: 460px; background: transparent; border: 0; box-shadow: none; overflow: visible; }

/* 星之光束：自核心向上的柔光柱，呼应品牌主视觉的升起星光 */
.orbit-beam { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -100%); width: 4px; height: 170px; background: linear-gradient(to top, var(--accent-glow), transparent 85%); filter: blur(2px); border-radius: 4px; pointer-events: none; animation: beamPulse 3.6s ease-in-out infinite; }
@keyframes beamPulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

/* 中心星芒：不做实体圆球，星芒图形即星体本身，光晕在背后呼吸 */
.orbit-core { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 68%); animation: corePulse 3.6s ease-in-out infinite; pointer-events: none; }
.orbit-core svg { width: 118px; height: auto; display: block; }
.orbit-core img { height: 56px; display: block; filter: drop-shadow(0 0 14px var(--accent-glow)); }
/* 亮色模式：光晕改用品牌金（不论皮肤），象牙白底上星芒依然发光 */
[data-theme="light"] .orbit-core { background: radial-gradient(circle, rgba(212, 163, 85, .45) 0%, transparent 68%); }
[data-theme="light"] .orbit-core img { filter: drop-shadow(0 0 12px rgba(212, 163, 85, .5)); }
@keyframes corePulse { 0%, 100% { opacity: .75; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } }

/* 轨道环：细线圆环，环体随角度变量旋转，虚线流转可见 */
@property --spin { syntax: '<angle>'; initial-value: 0deg; inherits: true; }
.orbit-ring { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(var(--spin)); border: 1px dashed var(--line-2); border-radius: 50%; pointer-events: none; --spin: 0deg; }
.orbit-ring.r1 { width: 220px; height: 220px; --r: 110px; animation: spinProp 18s linear infinite; }
.orbit-ring.r2 { width: 340px; height: 340px; --r: 170px; animation: spinPropR 32s linear infinite; }
@keyframes spinProp { to { --spin: 360deg; } }
@keyframes spinPropR { to { --spin: -360deg; } }

/* 卫星：官方应用图标 + 名称胶囊。环体旋转提供公转角度（--spin），
   卫星自身只需在环坐标系内定位（--a），内容再抵消总视觉角度保持水平 */
.sat { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(calc((var(--a) + var(--spin)) * -1)); display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 8px; border-radius: 99px; background: color-mix(in srgb, var(--panel-solid) 84%, transparent); border: 1px solid var(--line-2); color: var(--text-2); font-size: 12px; font-weight: 500; white-space: nowrap; backdrop-filter: blur(6px); box-shadow: 0 4px 14px rgba(2,6,14,.4); pointer-events: auto; }
.sat .ico { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; flex: none; overflow: hidden; }
.sat .ico svg { width: 14px; height: 14px; }
.sat.ok { color: var(--text); border-color: var(--accent-soft); box-shadow: 0 4px 14px rgba(2,6,14,.4), 0 0 12px var(--accent-soft); }

/* 底部状态行：扫描线 + 数据，给画面“在运行”的感觉 */
.orbit-hud { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.orbit-hud .scan { flex: 1; height: 3px; border-radius: 2px; background: var(--panel-2); overflow: hidden; position: relative; }
.orbit-hud .scan i { position: absolute; top: 0; bottom: 0; width: 34%; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scanMove 2.8s ease-in-out infinite; }
@keyframes scanMove { 0% { left: -34%; } 100% { left: 100%; } }
.orbit-hud b { color: var(--accent-2); font-weight: 500; font-variant-numeric: tabular-nums; }

/* 减少动画：星轨静止、光晕定稿、扫描线停在一格，画面仍然成立 */
@media (prefers-reduced-motion: reduce) {
  .orbit-core, .orbit-ring.r1, .orbit-ring.r2, .orbit-hud .scan i, .orbit-beam { animation: none; }
}
.window.hc .orbit-core, [data-reduce-motion="1"] .orbit-core { animation: none; }

function onboardHtml() {
  const o = S.onboard;
  const finished = o.at >= o.steps.length;
  const mark = (s, i) => {
    if (i > o.at) return `<span class="m">${i + 1}</span>`;
    if (i === o.at && !finished) return `<span class="m">${o.failed ? '' : '<span class="spin"></span>'}</span>`;
    return s.result === 'warn' ? `<span class="m" style="background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700">!</span>` : s.result === 'skip' ? `<span class="m" style="border-color:var(--line-2);color:var(--text-3)">–</span>` : `<span class="m" style="background:var(--ok);border-color:var(--ok);color:#fff">✓</span>`;
  };
  const steps = o.steps.map((s, i) => `<div class="st ${i < o.at || finished ? (s.result === 'ok' ? 'done' : '') : i === o.at ? (o.failed ? 'bad' : 'now') : ''}">${mark(s, i)}${s.label}<span class="d ${s.result === 'warn' ? 'tier-warn' : ''}">${i < o.at || finished ? s.done : i === o.at ? (o.failed ? '失败' : s.doing) : ''}</span></div>`).join('');
  const warn = finished && o.steps.some((s) => s.result === 'warn');
  const title = finished ? (warn ? '账号准备好了，环境还差一步' : '准备完成') : '正在为你准备';

  return `<div class="onboard"><div class="card">

    <p class="lead">${lead}</p>
    <div class="steps">${steps}</div>
    <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">
      ${o.failed ? `<button class="btn btn-secondary" onclick="A.logout()">退出登录</button><button class="btn btn-primary" onclick="A.startOnboard()">重试</button>` : finished ? `<button class="btn btn-secondary" onclick="A.enterApp();A.go('tutorial')">${ic('book')}先看 5 分钟教程</button><button class="btn btn-primary" onclick="A.enterApp()">${warn ? '进首页装环境' : '进入首页'}</button>` : `<button class="btn btn-ghost" disabled>${ic('refresh', 'spin')}处理中</button>`}

rimary',f.busy)}`}); };

  const finishAuth = async (f,owner,session,registered) => {

  function tasksPanel(){const d=data(),f=d.filters.tasks,rows=d.tasks.filter(t=>(!f.status||t.status===f.status)&&(t.id+' '+t.model+' '+t.platform).toLowerCase().includes(f.query.toLowerCase()));const pg=pager('tasks',rows.length);return `<div class="toolbar xm-filter"><label>搜索任务<input class="input" value="${esc(f.query)}" placeholder="任务 ID、模型或平台" oninput="A.accountFilter('tasks','query',this.value,false)"></label><label>状态<select class="input" onchange="A.accountFilter('tasks','status',this.value)">${[['','全部状态'],['queued','排队中'],['running','处理中'],['done','已完成'],['failed','失败']].map(([v,l])=>`<option value="${v}" ${f.status===v?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn btn-secondary sm" onclick="render()">搜索</button><button class="btn btn-ghost sm" onclick="A.accountResetFilter('tasks')">重置</button></div><p class="hint">视频、音乐等生成任务需要等待。提交后可离开本页，稍后回来查看进度。</p><div class="card">${statusBox('tasks',d.tasks,'还没有异步任务')||(!rows.length?`<div class="xm-state"><h3>没有符合条件的任务</h3><button class="btn btn-secondary" onclick="A.accountResetFilter('tasks')">清除筛选</button></div>`:table(['任务 / 模型','平台','状态','提交时间','费用（美元）','操作'],rows.slice((f.page-1)*5,f.page*5).map(t=>`<tr><td class="mono">${esc(t.id)}<small class="xm-subline">${esc(t.model)}</small></td><td>${esc(t.platform)}</td><td>${pill(t.status==='done'?'ok':t.status==='failed'?'bad':'warn',{done:'已完成',running:'处理中',queued:'排队中',failed:'失败'}[t.status]||'待核实')}</td><td>${esc(t.t)}</td><td>${usd(t.cost,true)}</td><td><button class="btn btn-ghost xs" onclick="A.dialog('taskDetail',{id:'${t.id}'})">${t.status==='done'?'查看结果':'详情'}</button></td></tr>`).join(''))+pg)}</div>`;}

  function purchaseSlots(record,planId){return (record.purchases[planId]||0)+record.orders.filter(o=>o.kind==='subscription'&&o.planId===planId&&!o.credited&&o.status!=='failed').length;}
  function channelOptions(current,kind='recharge',dialog=false){return availableChannels(kind).map(c=>`<button class="pay-opt ${current===c.id?'on':''}" data-testid="payment-channel-${c.id}" onclick="${dialog?`F.set('channel','${c.id}');render()`:`A.accountDraft('pay','${c.id}',true)`}"><span class="ico">${ic('receipt')}</span><span><strong>${c.name}</strong><small>${c.description} · ${c.currency}</small></span><span class="radio"></span></button>`).join('');}
  function subscriptionList(){const d=data(),active=d.subscriptions.some(x=>x.status==='active'&&x.quota>x.used);return `<div class="card"><div class="card-head"><h2>我的订阅</h2><span>${d.subscriptions.length} 条</span></div>${d.subscriptions.length?d.subscriptions.map(x=>`<div class="lrow"><div class="main-col"><div class="title">${esc(x.name)} ${pill(x.status==='active'?(x.used>=x.quota?'warn':'ok'):'',x.status==='active'?(x.used>=x.quota?'额度已用完':'生效中'):'已到期')}</div><div class="desc">额度 ${usd(x.quota)} · 已用 ${usd(x.used)}<br>到期日期 ${esc(x.expiresAt||'—')}</div></div></div>`).join(''):`<div class="card-body"><p class="muted">当前没有订阅。可以先使用账户余额。</p></div>`}<div class="card-body">${field('消费时先用哪一项',`<select data-testid="billing-preference" class="input" onchange="A.accountPreference(this.value)">${[['subscription_first','订阅优先'],['balance_first','余额优先'],['balance_only','仅使用余额'],['subscription_only','仅使用订阅']].map(([v,l])=>`<option value="${v}" ${d.preference===v?'selected':''} ${v==='subscription_only'&&!active?'disabled':''}>${l}${v==='subscription_only'&&!active?'（暂无可用额度）':''}</option>`).join('')}</select>`,'“优先”会在首选额度不足时尝试另一项；“仅使用”额度不足时会停止调用。')}${!active?note('没有可用的订阅额度。可以购买订阅，或选择使用账户余额。','warn'):''}<button class="btn btn-ghost sm" onclick="A.accountExplainBilling()">看看一次调用如何扣费</button></div></div>`;}
  function rechargePanel(){const d=data(),f=pageDraft('recharge'),opts=availableChannels(),current=opts.find(c=>c.id===f.pay),state=statusBox('recharge',[1],'暂时没有可用的充值渠道',`<p>稍后刷新，或使用有效充值码。</p><button class="btn btn-secondary" onclick="A.accountReload('recharge')">刷新</button>`);if(state)return `<div class="card">${state}</div>`;return `<div class="grid2 xm-commerce"><div class="col"><div class="card"><div class="card-head"><h2>充值到账金额</h2><span class="right">账户余额 ${usd(S.user.balance)}</span></div><div class="card-body"><p class="hint">金额以美元计入账户余额。实际支付金额与币种会在下一步确认。</p><div class="xm-amounts">${[10,30,50,100].map(n=>`<button class="chipbtn ${Number(f.amount)===n?'on':''}" onclick="A.accountDraft('amount',${n},true)">$${n}</button>`).join('')}</div>${field('到账金额（美元 USD）',`<input data-testid="recharge-amount" class="input" type="number" min="1" step="0.01" value="${esc(f.amount??30)}" oninput="A.accountDraft('amount',this.value)">`,current?`当前渠道最低到账金额 ${usd(current.minimum)}。`:'请先选择可用的支付渠道。')}${field('支付渠道',opts.length?`<div class="xm-pay-options">${channelOptions(f.pay)}</div>`:note('暂时没有可用的支付渠道。请稍后刷新，或使用充值码。','warn'),'这里只显示当前可用的渠道。')}${error(f)}<button class="btn btn-primary block" data-testid="recharge-quote" ${!opts.length?'disabled':''} onclick="A.accountQuote()">${f.quoting?'正在获取报价…':'查看支付金额'}</button>${!opts.length?'<button class="btn btn-ghost block" onclick="A.accountReload(\'recharge\')">刷新渠道</button>':''}</div></div><div class="card"><div class="card-head"><h2>兑换充值码</h2></div><div class="card-body">${field('充值码',`<div class="field-row"><input class="input" data-testid="redeem-code" value="${esc(f.code||'')}" placeholder="输入你收到的充值码" oninput="A.accountDraft('code',this.value)"><button class="btn btn-secondary" onclick="A.redeem()">检查充值码</button></div>`)}${f.codeMessage?note(esc(f.codeMessage),f.codeError?'warn':'info'):''}</div></div></div><div class="col"><div class="card"><div class="card-head"><h2>订阅计划</h2></div>${plans.map(p=>{const count=d.purchases[p.id]||0,limited=purchaseSlots(d,p.id)>=p.limit;return `<div class="setting"><div class="l"><strong>${p.name} <span class="mono">${usd(p.price)} / ${p.days} 天</span></strong><span>${p.description}<br>有效期内总额度 ${usd(p.quota)}，不循环重置<br>每个账号最多购买 ${p.limit} 次，已购买 ${count} 次</span></div><div class="r"><button class="btn btn-secondary sm" ${limited?'disabled':''} onclick="A.dialog('subscribe',{plan:'${p.id}'})">${limited?'已达购买上限':'购买'}</button>${limited?'<small class="xm-subline">可选择其他计划</small>':''}</div></div>`;}).join('')}</div>${subscriptionList()}</div></div>`;}
  function ordersPanel(){const d=data(),f=d.filters.orders,rows=d.orders.filter(o=>!f.status||o.status===f.status),pg=pager('orders',rows.length);return `<div class="toolbar xm-filter"><label>订单状态<select class="input" onchange="A.accountFilter('orders','status',this.value)"><option value="">全部状态</option>${Object.entries(orderLabels).filter(([k])=>k!=='querying').map(([v,l])=>`<option value="${v}" ${f.status===v?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn btn-ghost sm" onclick="A.accountResetFilter('orders')">重置</button><span class="right hint">关闭付款页不会取消订单，可在这里继续查询。</span></div><div class="card">${statusBox('orders',d.orders,'还没有订单',`<button class="btn btn-secondary" onclick="A.openAccount('recharge')">去充值</button>`)||(!rows.length?`<div class="xm-state"><h3>没有符合条件的订单</h3><button class="btn btn-secondary" onclick="A.accountResetFilter('orders')">清除筛选</button></div>`:table(['订单号 / 时间','类型','实付金额','到账 / 订阅','状态','操作'],rows.slice((f.page-1)*5,f.page*5).map(o=>`<tr data-testid="order-row-${o.id}"><td class="mono">${esc(o.id)}<small class="xm-subline">${esc(o.when)}</small></td><td>${o.kind==='subscription'?'订阅':o.kind==='reward'?'奖励转入':o.kind==='redeem'?'充值码':'充值'}<small class="xm-subline">${esc(o.way)}</small></td><td>${o.checkoutAmount==null?'—':`${o.currency} ${Number(o.checkoutAmount).toFixed(2)}`}</td><td>${o.kind==='subscription'?esc(o.planName):usd(o.amountUSD)}</td><td>${pill(o.status==='paid'?'ok':o.status==='failed'?'bad':'warn',orderLabels[o.status]||'待核实')}</td><td><button class="btn btn-ghost xs" onclick="A.accountOrder('${o.id}')">${o.status==='paid'?'详情':'查看 / 查询'}</button></td></tr>`).join(''))+pg)}</div>`;}
  function invitePanel(){return `<div class="grid2 xm-profile"><div class="card"><div class="card-head"><h2>邀请好友</h2></div><div class="card-body"><p class="hint">好友使用你的邀请码注册后，符合活动规则的奖励会记到本账号。实际奖励以到账记录为准。</p>${field('我的邀请码',`<div class="field-row"><input class="input mono" value="${esc(S.user.invite||'—')}" readonly><button class="btn btn-secondary" onclick="A.accountCopyInvite()">复制</button></div>`)}<p class="hint">没有邀请码时，请稍后刷新账号资料。</p></div></div><div class="card"><div class="card-head"><h2>可转入奖励（美元）</h2></div><div class="acct"><div class="bal"><b>${usd(S.user.reward)}</b></div><p class="hint">转入后可用于本账号的 AI 消费。</p><button class="btn btn-primary sm" ${!(S.user.reward>0)?'disabled':''} onclick="A.dialog('transferReward')">转入账户余额</button>${!(S.user.reward>0)?'<p class="hint">有可转入奖励后，这里就可以操作。</p>':''}</div></div></div>`;}
  function devicesPanel(){const devices=data().devices;return `<div class="card"><div class="card-head"><h2>登录设备</h2><button class="btn btn-secondary sm right" ${devices.filter(d=>!d.current).length?'':'disabled'} onclick="A.accountRevokeOthers()">退出其他设备</button></div>${statusBox('devices',devices,'暂时没有设备记录')||devices.map(d=>`<div class="lrow"><span class="ico">${ic('monitor')}</span><div class="main-col"><div class="title">${esc(d.current?'星芒客户端 · '+({win:'Windows',mac:'macOS',linux:'Linux'}[S.os]||S.os):d.name)} ${d.current?pill('accent','当前设备'):''}</div><div class="desc">IP ${esc(d.ip)} · ${esc(d.when)}</div></div>${d.current?'<span class="hint">退出请使用“退出当前账号”</span>':`<button class="btn btn-ghost sm" onclick="A.deviceRevoke('${d.id}')">撤销登录</button>`}</div>`).join('')}</div>`;}
  accountHtml = function(){if(!S.user)return welcomeHtml();st();const tab=tabs.some(([k])=>k===S.accountTab)?S.accountTab:'overview',u=S.user;const pages={overview,dashboard,keys:keysPanel,usage:usagePanel,tasks:tasksPanel,recharge:rechargePanel,orders:ordersPanel,invite:invitePanel,devices:devicesPanel};return `<section class="page xm-account" data-testid="account-page"><div class="page-head"><div class="xm-heading"><button class="btn btn-ghost icon" title="返回" onclick="A.accountBack()">${ic('left')}</button><div><h1>个人中心</h1><p>余额、Key、用量与订单都在这里。</p></div></div><div class="actions">${avatarHtml(u,'avatar')}<div><strong>${esc(u.display)}</strong><small class="xm-subline">${esc(u.email)}</small></div></div></div><div class="tabs">${tabs.map(([k,l])=>`<a class="${tab===k?'on':''}" data-testid="account-tab-${k}" onclick="A.openAccount('${k}')">${l}</a>`).join('')}</div>${data().switchMessage?note(esc(data().switchMessage),'warn'):''}${pages[tab]()}</section>`;};
  accountCard = function(){if(!S.user)return `<div class="card"><div class="card-head"><h2>星芒账号</h2></div><div class="acct"><p class="hint">登录后查看余额，并为工具选择星芒服务。</p><div class="acts"><button class="btn btn-primary sm" onclick="A.dialog('login')">登录</button><button class="btn btn-ghost sm" onclick="A.dialog('register')">注册</button></div></div></div>`;st();return `<div class="card"><div class="card-head"><h2>账户余额（美元）</h2><span class="right">${esc(S.user.display)}</span></div><div class="acct"><div class="bal"><b>${usd(S.user.balance)}</b></div><p class="hint">按量费用以实际调用记录为准。</p><div class="acts"><button class="btn btn-primary sm" onclick="A.openAccount('recharge')">充值</button><button class="btn btn-ghost sm" onclick="A.openAccount('dashboard')">用量看板</button></div></div></div>`;};
  Object.assign(A,{
    openAccount(tab='overview'){if(!S.user){A.dialog('login');return;} saveCurrent();S.accPop=null;S.view='account';S.accountTab=tab;S.drawer=null;const f=pageDraft(tab);S.pageForm=f;if(!topDialog())S.form=f;render();},
    accountBack(){saveCurrent();A.go(S.page||'home');},
    accountDraft(key,value,refresh=false){const f=pageDraft(S.accountTab);f[key]=value;f.err='';S.pageForm=f;if(!topDialog())S.form=f;if(refresh)render();},
    accountRange(value){data().dashboardRange=value;render();},
    accountFilter(page,key,value,refresh=true){const d=data();d.filters[page][key]=value;d.filters[page].page=1;if(d.scenes[page]==='filterEmpty')d.scenes[page]='ready';if(refresh)render();},
    accountResetFilter(page){const d=data();if(page==='usage')d.filters.usage={range:'30d',model:'',key:'',group:'',status:'',page:1};if(page==='tasks')d.filters.tasks={query:'',status:'',page:1};if(page==='orders')d.filters.orders={status:'',page:1};d.scenes[page]='ready';render();},
    accountPage(page,offset){data().filters[page].page+=offset;render();},
    accountReload(page){const d=data(),session=S;d.scenes[page]='loading';render();later(()=>{if(S!==session)return;d.scenes[page]='ready';if(data()===d)render();},450);},
    saveProfile(){const d=data(),f=pageDraft('overview'),name=String(f.display??S.user.display).trim();if(!name||name.length>40){f.err='显示名称需要 1–40 个字符。';render();return;}d.user.display=name;f.display=name;f.err='';saveCurrent();render();A.toast('资料已保存');},
    accountAdd(){A.dialog('login');S.form.addAccount=true;topDialog().initial=formFingerprint(S.form);render();},
    accountScenario(page,state){const d=data();if(page==='payment'){st().paymentOutcome=state;for(const r of Object.values(st().records))for(const o of r.orders)if(!o.credited)o.expected=state;}else if(page==='channels'){st().channels.forEach(c=>{c.enabled=state==='all'||(state==='normal'&&['stripe','creem'].includes(c.id))||state===c.id;});}else if(page==='switch'){st().switchOutcome=state;}else if(page==='quote'){d.scenes.quote=state;}else if(page==='subscriptions'){if(state==='insufficient'){d.subscriptions.forEach(x=>x.used=x.quota);d.user.balance=0;}else if(state==='limit'){d.purchases={lite:2,pro:2};}else if(state==='empty'){d.subscriptions=[];d.preference='balance_only';}}else{d.scenes[page]=state;}render();},
    accountPreference(value){if(value==='subscription_only'&&!data().subscriptions.some(s=>s.status==='active'&&s.quota>s.used)){A.toast('没有可用的订阅额度，请先购买订阅。','warn');return;}data().preference=value;render();A.toast('扣费偏好已保存');},
    accountExplainBilling(){const d=data(),active=d.subscriptions.filter(s=>s.status==='active').reduce((n,s)=>n+Math.max(0,s.quota-s.used),0);A.dialog('accountInfo',{title:'每次调用如何扣费',body:`${note('本次示例调用费用为 $0.10，下面只说明扣费规则，不实际扣款。')}<dl class="kv"><dt>账户余额（美元）</dt><dd>${usd(d.user.balance)}</dd><dt>可用订阅额度</dt><dd>${usd(active)}</dd><dt>当前偏好</dt><dd>${{subscription_first:'订阅优先，额度不足时使用余额',balance_first:'余额优先，余额不足时使用订阅',balance_only:'仅使用余额',subscription_only:'仅使用订阅'}[d.preference]}</dd><dt>能否使用</dt><dd>${((d.preference==='balance_only'?d.user.balance:d.preference==='subscription_only'?active:d.user.balance+active)>=.1)?'有足够额度':'额度不足，请充值或购买订阅后再试'}</dd></dl>`});}
  });
  function keyForm(p){const key=p.id?data().keys.find(k=>k.id===p.id):null,f=S.form;return {key,f,values:{kname:f.kname??key?.name??'',kgroup:f.kgroup??key?.group??'默认分组',kquotaMode:f.kquotaMode??key?.quotaMode??'unlimited',kquota:f.kquota??key?.quota??10,kexpiryMode:f.kexpiryMode??(key?.expiresAt?'date':'never'),kexpiry:f.kexpiry??key?.expiresAt??datePlus(30)}};}
  DIALOGS.keyEditor = p=>{const {key,f,values:v}=keyForm(p);return dialogShell({title:key?'编辑 Key':'添加 Key',sub:key?'修改名称、额度和到期日期，Key 内容保持不变。':'创建一把连接星芒服务的 Key。',body:`<div data-testid="key-editor">${field('名称',`<input class="input" data-autofocus maxlength="60" value="${esc(v.kname)}" placeholder="例如：Claude Code · 本机" oninput="F.set('kname',this.value)">`)}${field('分组',`<select class="input" onchange="F.set('kgroup',this.value)">${GROUPS.map(g=>`<option ${g===v.kgroup?'selected':''}>${g}</option>`).join('')}</select>`,'不确定时选择默认分组。')}${field('最多可消费多少（美元）',`<select class="input" data-testid="key-quota-mode" onchange="F.set('kquotaMode',this.value);render()"><option value="unlimited" ${v.kquotaMode==='unlimited'?'selected':''}>不限额度</option><option value="limited" ${v.kquotaMode==='limited'?'selected':''}>设置固定额度</option></select>`,'Key 额度是使用上限，不是额外余额。')}${v.kquotaMode==='limited'?field('额度上限（美元 USD）',`<input class="input" data-testid="key-quota" type="number" min="0.01" step="0.01" value="${esc(v.kquota)}" oninput="F.set('kquota',this.value)">`,key?`这把 Key 已用 ${usd(key.usedUSD,true)}。上限小于或等于已用金额时，会显示“额度用尽”。`:'达到上限后会停止使用，可随时回来调整。'):''}${field('到期设置',`<select class="input" data-testid="key-expiry-mode" onchange="F.set('kexpiryMode',this.value);render()"><option value="never" ${v.kexpiryMode==='never'?'selected':''}>永不过期</option><option value="date" ${v.kexpiryMode==='date'?'selected':''}>指定日期</option></select>`)}${v.kexpiryMode==='date'?field('到期日期',`<input class="input" data-testid="key-expiry" type="date" value="${esc(v.kexpiry)}" oninput="F.set('kexpiry',this.value)">`,'到期后不能继续使用，可延长日期恢复。'):''}${error(f)}</div>`,footer:`<span class="spacer"></span><button class="btn btn-ghost" onclick="A.requestDialogClose('dismiss')">取消</button><button class="btn btn-primary" data-testid="key-save" onclick="A.keySave('${p.id||''}')">${key?'保存修改':'创建 Key'}</button>`});};
  DIALOGS.usageDetail=p=>{const r=data().usage.find(x=>x.id===p.id)||data().usage[p.i];if(!r)return dialogShell({title:'调用详情',body:note('这条记录暂时不可用。请返回明细重新读取。','warn'),footer:closeBtn});return dialogShell({title:'调用详情',sub:r.t+' · '+r.model,wide:true,body:`<dl class="kv"><dt>请求编号</dt><dd class="mono">${esc(r.requestId||'—')}</dd><dt>状态</dt><dd>${r.status==='failed'?'调用失败':'已完成'}</dd><dt>API Key / 分组</dt><dd>${esc(r.key)} / ${esc(r.group)}</dd><dt>输入 / 输出 Token</dt><dd>${fmt(r.inTok)} / ${fmt(r.outTok)}</dd><dt>缓存读取 Token</dt><dd>${fmt(r.cacheTokens)}</dd><dt>费用（美元）</dt><dd>${usd(r.cost,true)}</dd><dt>扣费来源</dt><dd>${r.billing==='subscription'?'订阅额度':'账户余额'}</dd><dt>首字等待</dt><dd>${r.firstTokenMs==null?'—':(r.firstTokenMs/1000).toFixed(2)+' 秒'}</dd><dt>总耗时</dt><dd>${(r.ms/1000).toFixed(2)} 秒</dd><dt>输出方式</dt><dd>${r.stream?'逐字输出（流式）':'完成后一次显示'}</dd></dl>${r.status==='failed'?note('本次调用未成功，记录费用为 $0.0000。可返回工具检查提示后重新发起。','warn'):note('“—”表示该项没有可用数据。')}`,footer:closeBtn});};

  function nodeHtml(n,c){const m=TYPES[n.type],done=c.run.phase==='done';const text=n.type==='text'?n.text:n.type==='model'?n.model:n.type==='image'?n.size:'运行后在这里查看结果';return `<article id="cx-node-${n.id}" class="cx-node ${n.type} ${c.selected===n.id?'selected':''} ${c.run.phase==='running'&&c.run.order?.[c.run.step]===n.id?'running':''}" style="left:${n.x}px;top:${n.y}px" tabindex="0" aria-label="${esc(n.name)}，${m.name}，方向键移动" onclick="A.canvasSelect('${n.id}')"><div class="cx-node-head" onpointerdown="A.canvasDrag(event,'${n.id}')">${ic(m.icon)}<strong>${esc(n.name)}</strong><span class="cx-drag" aria-hidden="true">⠿</span></div><div class="cx-node-content"><small>${m.name}</small><p>${esc(text||'还没有填写，请点击补充')}</p>${n.type==='result'&&done?art(false)+button('放大查看',"canvasImage()",'btn-secondary',false,'data-testid="canvas-result-open"'):''}</div>${n.type!=='text'?`<span class="cx-port in" title="接收上一步内容"></span>`:''}${n.type!=='result'?`<button class="cx-port out" title="从此节点连接" aria-label="从${esc(n.name)}连接" onclick="event.stopPropagation();A.canvasBeginLink('${n.id}')"></button>`:''}</article>`;}

).join('')}</div><p>拖动节点顶部，或选中节点后按方向键。</p>${n.type!=='result'?button('连接到下一个节点',`canvasBeginLink('${n.id}')`,'btn-secondary',false,'class="cx-wide"'):''}${button('删除节点',"canvasDelete()",'btn-ghost cx-danger',false,'data-testid="canvas-delete"')}</fieldset></aside>`;}

  function editor(c){const running=c.run.phase==='running';return `<div class="cx-projectbar"><button class="btn btn-ghost sm" onclick="A.canvasNavigate('overview')">${ic('left')}所有项目</button><strong title="${esc(c.project.name)}">${esc(c.project.name)}</strong><span id="cx-save-state" class="cx-save ${c.save.phase}" role="status">${saveText(c)}</span><span class="spacer"></span>${button(c.save.phase==='failed'?'重试保存':'保存',"canvasSave()",'btn-secondary',busy(c),`title="${S.os==='mac'?'⌘S':'Ctrl+S'}" data-testid="canvas-save"`)}${running?button('停止',"canvasStop()",'btn-secondary',false,'data-testid="canvas-stop"'):button(ic('zap')+'运行',"canvasRun()",'btn-primary',c.save.phase==='saving',`title="${S.os==='mac'?'⌘':'Ctrl+'}Enter" data-testid="canvas-run"`)}</div><div class="body cx-body"><aside class="lib cx-library"><strong>添加节点</strong><p>点击一种节点，放到画布上。</p>${Object.entries(TYPES).map(([k,m])=>`<button class="n" onclick="A.canvasAdd('${k}')" ${busy(c)?'disabled':''} data-testid="canvas-add-${k}">${ic(m.icon)}<span>${m.name}<small>${m.hint}</small></span>${ic('plus')}</button>`).join('')}<div class="cx-library-bottom">${button('导入演示',"canvasImportDialog()",'btn-ghost',busy(c))}${button('导出演示',"canvasExport()",'btn-ghost',busy(c))}<p>项目仅保留在本次页面演示中；重置或刷新会清除。</p></div></aside><section class="cx-workarea"><div class="cx-toolbar">${button(ic('link')+'连接节点',"canvasToggleLink()",'btn-secondary',busy(c))}${button('撤销',"canvasUndo()",'btn-ghost',!c.undo.length||busy(c),`title="${S.os==='mac'?'⌘Z':'Ctrl+Z'}"`)}<span class="spacer"></span>${button('−',"canvasZoom(-.1)",'btn-ghost',false,'aria-label="缩小画布"')}<span class="cx-zoom">${Math.round(c.zoom*100)}%</span>${button('+',"canvasZoom(.1)",'btn-ghost',false,'aria-label="放大画布"')}${button('适应',"canvasFit()",'btn-secondary')}</div>${c.link?`<div class="cx-link-panel"><label>从 <select id="cx-link-source" onchange="A.canvasLinkPick('source',this.value)"><option value="">选择起点</option>${c.project.nodes.filter(n=>n.type!=='result').map(n=>`<option value="${n.id}" ${c.source===n.id?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label><label>到 <select id="cx-link-target" onchange="A.canvasLinkPick('target',this.value)"><option value="">选择终点</option>${c.project.nodes.filter(n=>n.type!=='text'&&n.id!==c.source).map(n=>`<option value="${n.id}" ${c.target===n.id?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label>${button('连接',"canvasConnect()",'btn-primary',busy(c))}${button('取消',"canvasToggleLink()",'btn-ghost')}<small>也可以点击起点右侧的圆点，再点击终点节点。</small></div>`:''}<div id="cx-stage" class="cv cx-stage"><div class="cx-sheet" style="width:${1200*c.zoom}px;height:${660*c.zoom}px"><div class="cx-graph" style="transform:scale(${c.zoom})"><svg class="cx-edges" width="1200" height="660" aria-label="节点连线">${edgesHtml(c)}</svg>${c.project.nodes.map(n=>nodeHtml(n,c)).join('')}${!c.project.nodes.length?`<div class="cx-empty-canvas"><h3>从一句话开始</h3><p>点击左侧「文本输入」，写下你想做的画面。</p>${button('添加文本输入',"canvasAdd('text')",'btn-primary')}</div>`:''}</div></div></div>${c.notice?`<div class="cx-notice" role="status">${esc(c.notice)}</div>`:''}${c.project.edges.length?`<details class="cx-edge-list"><summary>${c.project.edges.length} 条连接 · 查看或移除</summary>${c.project.edges.map(([a,b],i)=>`<div>${esc(c.project.nodes.find(n=>n.id===a)?.name||'已移除')} → ${esc(c.project.nodes.find(n=>n.id===b)?.name||'已移除')}${button('移除',`canvasRemoveEdge(${i})`,'btn-ghost',busy(c))}</div>`).join('')}</details>`:''}${runPanel(c)}</section>${inspector(c)}</div>`;}
  function overview(c){return `<div class="cx-overview"><div class="cx-overview-head"><div><h1>把想法连成作品</h1><p>添加节点、连好顺序，再一步步查看演示结果。</p></div>${button(ic('plus')+'新建项目',"canvasNew()",'btn-primary',false,'data-testid="canvas-new"')}</div><div class="cx-intro"><strong>第一次使用？打开入门示例</strong><p>已有四个连接好的节点。改一句描述，保存，再点击运行。</p>${button('打开入门示例',"canvasOpenProject('canvas-demo')",'btn-secondary',false,'data-testid="canvas-demo"')}</div><div class="cx-project-heading"><h2>最近项目</h2>${button('导入演示 JSON',"canvasImportDialog()",'btn-ghost')}</div><div class="cx-projects">${c.projects.map(p=>`<button class="cx-project-card" onclick="A.canvasOpenProject('${p.id}')"><div class="cx-mini-graph"><i></i><b></b><i></i><b></b><i></i></div><strong>${esc(p.name)}</strong><span>${p.nodes.length} 个节点 · ${p.edges.length} 条连接</span><small>${esc(p.updated)}</small></button>`).join('')}</div><p class="cx-local-note">这是独立画布窗口的设计演示。所有修改仅保留在本次页面中，关闭画布后可重新打开；刷新或重置会清除。</p></div>`;}
  function modalHtml(c){const m=c.modal;if(!m)return '';let title='',body='',foot='';const cancel=button('取消',"canvasModalClose()",'btn-ghost');if(m.type==='new'){title='新建画布项目';body=`<label for="cx-new-name">项目名称</label><input id="cx-new-name" maxlength="60" placeholder="例如：我的第一张画面" value="${esc(m.name||'')}" oninput="A.canvasModalValue('name',this.value)"><p>创建后，先添加一个文本输入节点。</p>`;foot=cancel+button('创建项目',"canvasCreate()",'btn-primary');}if(m.type==='unsaved'){title='还有修改没有保存';body=`<p>保存后再继续，或放弃这次修改。已保存的项目会保留在最近项目中。</p>${c.save.phase==='failed'?'<p class="cx-danger">上次没有保存成功。可以重试，内容仍在这里。</p>':''}`;foot=cancel+button('放弃修改',"canvasDiscard()",'btn-secondary')+button('保存并继续',"canvasSave(true)",'btn-primary',c.save.phase==='saving');}if(m.type==='running'){title='演示还在运行';body='<p>离开会停止当前演示。输入和节点仍会保留。</p>';foot=button('继续运行',"canvasModalClose()",'btn-ghost')+button('停止并继续',"canvasLeaveRunning()",'btn-primary');}if(m.type==='delete'){title='删除这个节点？';body=`<p>「${esc(selected(c)?.name||'节点')}」及其连接会被移除。之后可点击「撤销」恢复。</p>`;foot=cancel+button('删除节点',"canvasDeleteConfirm()",'btn-primary cx-danger-button');}if(m.type==='import'){title='导入演示 JSON';body=`<p>粘贴本原型导出的结构，或直接加载内置示例。导入会新建演示项目，不读取真实工程。</p><textarea id="cx-import" rows="9" spellcheck="false" placeholder="在这里粘贴演示 JSON" oninput="A.canvasModalValue('text',this.value)">${esc(m.text||'')}</textarea>${button('填入内置示例',"canvasFillImport()",'btn-ghost')}`;foot=cancel+button('导入为新项目',"canvasImport()",'btn-primary');}if(m.type==='image'){title='运行结果 · 本地演示';body=`${art(true)}<p class="cx-result-description">${esc(c.run.description||'')}</p><p>这是 CSS 绘制的构图示例，用来验证查看结果的操作。没有调用 AI，也没有生成图片文件。</p>`;foot=button('回到画布',"canvasModalClose()",'btn-primary');}return `<div class="cx-modal-shade"><section class="cx-modal ${m.type==='image'?'cx-result-modal':''}" role="dialog" aria-modal="true" aria-labelledby="cx-modal-title" tabindex="-1"><header><h2 id="cx-modal-title">${title}</h2>${button(ic('x'),"canvasModalClose()",'btn-ghost',false,'aria-label="关闭弹窗"')}</header><div class="cx-modal-body">${body}${m.error?`<p class="cx-error" role="alert">${esc(m.error)}</p>`:''}</div><footer>${foot}</footer></section></div>`;}
  canvasHtml=function(){const c=state();return `<div class="canvas-win cx-window" data-canvas-version="3" data-canvas-os="${S.os}" role="region" aria-label="星芒画布独立窗口演示"><div class="tb cx-titlebar">${S.os==='mac'?closeControl():''}${ic('inf')}<strong>星芒画布</strong><span class="cx-demo-label">独立窗口演示</span><span class="spacer"></span><small>${({win:'Windows',mac:'macOS',linux:'Linux'})[S.os]}</small>${S.os!=='mac'?closeControl():''}</div><div class="cx-content" ${c.modal?'inert':''}>${c.view==='editor'&&c.project?editor(c):overview(c)}</div>${modalHtml(c)}</div>`;};

/* Offline maintenance interactions. Loaded after 00-runtime / 40-tools / 50-platform.

(() => {

  const cap = () => XM.platformCapabilities?.() || { desktopAvailable: S.os !== 'linux', label: {win:'Windows',mac:'macOS',linux:'Linux'}[S.os], trayCapabilities: {available:S.os!=='linux'} };
  const provider = id => id === 'codexDesktop' ? 'codex' : id;
  const src = id => XM.toolSource?.(id) || S.tools[provider(id)]?.source;

  const resultRows = () => {
    const ids = liveTools(), cli = ids.some(id => id !== 'codexDesktop'), usingXM = ids.some(id => ['account','manual'].includes(src(id))), desktopReady=ids.includes('codexDesktop')&&S.tools.codexDesktop.configured;
    const rows = [];
    rows.push({k:'node',label:'命令行运行环境',st:envReady()?'ok':desktopReady?'optional':cli?'bad':'optional',detail:envReady()?`Node.js ${S.env.node} · npm ${S.env.npm}`:desktopReady?'Codex 桌面端可以独立使用。需要打开命令行工具时，再准备 Node.js 和 npm。':cli?'已安装的命令行工具需要 Node.js 和 npm，请先准备运行环境。':'目前没有使用命令行工具。需要时再准备 Node.js 和 npm。',target:'maintenance'});
    if (usingXM) rows.push({k:'service',label:'星芒连接',st:scenario('health')==='failed'?'bad':S.sim==='offline'?'bad':'ok',detail:scenario('health')==='failed'||S.sim==='offline'?'连接没有完成，请核对网络与代理后重试。':'当前示例连接正常。',target:'network'});
    rows.push({k:'download',label:'软件下载来源',st:scenario('health')==='warning'?'warn':'ok',detail:scenario('health')==='warning'?'当前来源响应不稳定，可切换下载来源后再次检查。':`当前选择：${{auto:'自动判断',cn:'国内镜像',official:'官方源'}[S.settings.mirror]||'自动判断'}。`,target:'network'});
    for(const id of ids){
      const t=S.tools[provider(id)], source=src(id), key=S.keys.find(k=>k.id===t.key);
      const official = XM.state('tools',()=>({running:{},official:{},jobs:{},failNext:null,lastResult:null})).official?.[provider(id)];
      let st='ok', detail='配置已准备好，可以回到首页打开工具。';
      if(source==='unknown'){st='warn';detail='发现已有配置，先确认账号来源再使用。';}

    return rows;
  };
  healthHtml = () => {

    const body=h.status==='idle'?emptyHtml('zap','还没检查过','只检查当前系统和已安装工具需要的项目。可选环境会单独提示，检查期间可以取消。',b('开始检查','A.healthRun()','primary')):`<div class="card-head"><h2>逐项结果</h2><span role="status">${h.status==='running'?'正在检查，结果会逐项显示':h.status==='cancelled'?'已保留完成的项目，可重新检查':`本次完成于 ${esc(h.finishedAt||'—')}`}</span><span class="right">${b('预览报告','A.reportPreview()')}</span></div>${h.items.map(x=>`<div class="it" data-health="${x.k}"><span class="m ${x.st}">${{ok:'✓',warn:'!',bad:'×',optional:'·',cancelled:'—'}[x.st]||''}</span><div><strong>${esc(x.label)}</strong><span class="d">${esc(x.detail||({wait:'等待检查',run:'检查中',cancelled:'本项未完成'}[x.st]||''))}</span>${x.st==='optional'?'<small class="faint">可选提示，不计为故障</small>':''}</div>${['bad','warn'].includes(x.st)?b('去处理',`A.healthFix('${x.k}')`):x.st==='ok'&&x.tool?b('查看配置',`A.healthFix('${x.k}')`,'ghost'):x.st==='optional'?b('查看安装说明',`A.healthFix('${x.k}')`,'ghost'):''}</div>`).join('')}`;

  DIALOGS.pickFolder=()=>dialogShell({title:'选择工作文件夹',sub:'填写工具打开时进入的文件夹',body:`<div class="field"><label for="xm-workdir">文件夹路径</label><input id="xm-workdir" class="input mono" data-autofocus value="${esc(S.form.dir??S.settings.workdir)}" oninput="F.set('dir',this.value)"><p class="xm-field-help">只选择你信任的项目。此处预览保存路径的交互，不会创建文件夹。</p></div>`,footer:b('取消','A.requestDialogClose()','ghost')+'<span class="spacer"></span>'+b('使用这个文件夹','A.settingsUseFolder()','primary')});

  DIALOGS.xmDataClear=()=>dialogShell({title:'清除本机数据',body:`<div class="callout warn">真实清除会移除本机登录记录、设置与索引。开始前应先导出备份，并确认哪些工具配置和项目文件仍会保留。</div><p>本次仅预览确认步骤，现有演示账号和对话保持可继续查看。</p><label class="check ${S.form.understood?'on':''}" onclick="F.set('understood',!S.form.understood);render()"><i></i>我了解清除范围，并已保存所需备份</label>`,footer:b('取消','A.closeDialog()','ghost')+'<span class="spacer"></span>'+b('演示确认清除',"A.closeDialog();A.toast('确认流程已演示，没有清除真实数据')",'danger',S.form.understood?'':'disabled')});

  DIALOGS.xmMigration=()=>dialogShell({title:'从旧版本迁移',body:`<p>先确认旧版本数据能读取，再创建迁移前快照。迁移完成后逐项检查设置和工具配置。</p><ol class="xm-instructions"><li>检查旧数据格式与可用空间。</li><li>保留旧数据快照，迁移到独立的新版本目录。</li><li>验证迁移结果；失败时保留旧数据，按提示重试。</li></ol><div class="callout ${ms().migration.phase==='failed'?'warn':'info'}">${ms().migration.phase==='failed'?'上次迁移没有完成，原设置与快照仍保留。':ms().migration.phase==='done'?'本次迁移示例已经完成，迁移前快照仍保留。':'尚未迁移真实数据。本次演示只记录设置快照和流程状态。'}</div>`,footer:b(ms().migration.phase==='running'?'取消迁移':'关闭',"A.settingsDataCancel('migration')",'ghost')+'<span class="spacer"></span>'+b(ms().migration.phase==='running'?'准备中…':ms().migration.phase==='done'?'本次已完成':'开始迁移演示','A.settingsMigrate()','primary',['running','done','rollingBack'].includes(ms().migration.phase)?'disabled':'')});
  A.settingsMigrate=()=>{const m=ms().migration;if(['running','rollingBack','done'].includes(m.phase))return;if(Object.values(ms().save).some(r=>r.phase==='saving'))return A.toast('请等待设置保存完成，再开始迁移','warn');const op=m.op={},dialogId=topDialog()?.id;m.phase='running';m.snapshot ||= {version:S.update.current,settings:JSON.parse(JSON.stringify(S.settings)),when:time()};render();XM.defer(()=>{if(m.op!==op||m.phase!=='running')return;m.phase=scenario('migration')==='failed'?'failed':'done';if(topDialog()?.id===dialogId)A.closeDialog();render();A.toast(m.phase==='done'?'迁移流程已演示，迁移前快照已保留':'迁移没有完成，可检查后重试',m.phase==='done'?undefined:'warn');},700);};
  DIALOGS.xmRollback=()=>dialogShell({title:'回滚前先保留新版数据',body:`<p>回滚会恢复迁移前的设置。先保留当前新版数据快照，之后仍可查看新版期间的内容。</p><div class="callout warn">回滚可能因为快照缺失、格式或权限问题失败。失败时保留现状与快照，不自动删除新版目录。</div>${ms().migration.newSnapshot?'<p>已保留新版设置快照；重复查看不会覆盖它。</p>':''}`,footer:b(ms().migration.phase==='rollingBack'?'取消回滚':'关闭',"A.settingsDataCancel('rollback')",'ghost')+'<span class="spacer"></span>'+b(ms().migration.phase==='rolledBack'?'本次已回滚':ms().migration.phase==='rollingBack'?'正在回滚…':'保留新版快照并演示回滚','A.settingsRollback()','primary',ms().migration.snapshot&&!['running','rollingBack','rolledBack'].includes(ms().migration.phase)?'':'disabled')});
  A.settingsRollback=()=>{const m=ms().migration;if(!m.snapshot||['running','rollingBack','rolledBack'].includes(m.phase))return;if(Object.values(ms().save).some(r=>r.phase==='saving'))return A.toast('请等待设置保存完成，再开始回滚','warn');const op=m.op={},dialogId=topDialog()?.id,snapshot={version:S.update.current,settings:JSON.parse(JSON.stringify(S.settings)),when:time()};m.newSnapshot ||= snapshot;m.newSnapshots ||= [];if(!m.newSnapshots.some(s=>JSON.stringify(s.settings)===JSON.stringify(snapshot.settings)))m.newSnapshots.push(snapshot);m.phase='rollingBack';render();XM.defer(()=>{if(m.op!==op||m.phase!=='rollingBack')return;m.phase=scenario('rollback')==='failed'?'rollbackFailed':'rolledBack';if(m.phase==='rolledBack'){S.settings=JSON.parse(JSON.stringify(m.snapshot.settings));S.theme=S.settings.themePref==='system'?(S.systemDark?'dark':'light'):S.settings.themePref;ms().save={};delete ms().proxyDraft;document.documentElement.style.setProperty('--motion',S.settings.reduceMotion?'0':'1');}if(topDialog()?.id===dialogId)A.closeDialog();render();A.toast(m.phase==='rolledBack'?'回滚流程已演示，新版设置快照仍保留':'回滚没有完成，当前设置与快照均保留',m.phase==='rolledBack'?undefined:'warn');},700);};
  DIALOGS.xmDataSnapshots=()=>{const m=ms().migration,snapshots=[...(m.snapshot?[{label:'迁移前设置快照',...m.snapshot}]:[]),...(m.newSnapshots||[]).map((s,i)=>({label:'新版设置快照 '+(i+1),...s}))];return dialogShell({title:'已保留的迁移快照',body:snapshots.length?`<p>以下是本次演示保留的设置快照，不含对话正文或账号凭据。每次回滚前有新改动时，会新增快照。</p><div class="status-list">${snapshots.map(s=>`<div class="it"><strong>${s.label}</strong><span class="v">${esc(s.when)} · ${esc(s.version)} · ${Object.keys(s.settings).length} 项设置</span></div>`).join('')}</div>`:'<p>还没有迁移快照。开始迁移前会先保留一份。</p>',footer:b('关闭','A.closeDialog()')});};
