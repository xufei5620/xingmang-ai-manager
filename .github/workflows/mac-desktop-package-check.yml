name: mac-desktop-package-check

# 临时检查（Mac 一键装 Codex 桌面端与 Claude Desktop）：只下载两家官方 Mac 包、读身份和签名，
# 不安装、不运行。yoyo 2026-10-03 选了「用 GitHub」；核完连同脚本一起删掉，不进 main。
on:
  push:
    branches:
      - claude/mac-desktop-codex-claude-install-8sk6wq
    paths:
      - .github/workflows/mac-desktop-package-check.yml
      - scripts/probe-mac-desktop-packages.cjs

permissions:
  contents: read

concurrency:
  group: mac-desktop-package-check
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.repository == 'xufei5620/xingmang-ai-manager' && github.ref == 'refs/heads/claude/mac-desktop-codex-claude-install-8sk6wq' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Download and inspect the official Mac packages
        run: node scripts/probe-mac-desktop-packages.cjs
