# 改更新目录上的 service-status.json：打开或关闭「服务正在维护」提示、撤回坏版本、
# 分批放量、最低版本（强制更新）、换线路时怎么改工具配置、星芒账号的分组对照、各工具的型号表。要把线上退回旧版本，用 rollback-release 工作流（它会顺带在这里撤回）。
# 客户端怎么读见 electron/service-status.ts，一步步的操作见 docs/SERVICE-STATUS.md。
#
# 只改这次选了或填了的那几项，其余字段照线上原样保留。凭据与正式发布共用
# release 环境（同一个 R2 前缀），所以每次运行都要产品所有者点一次 Approve。
name: service-status

on:
  workflow_dispatch:
    inputs:
      maintenance:
        description: 维护提示
        type: choice
        default: 'keep: 不改'
        options:
          - 'keep: 不改'
          - 'on: 打开（客户端显示「服务正在维护」）'
          - 'off: 关闭'
      message:
        description: 给用户看的一句话（只在打开时用，可留空；最多 200 字）
        type: string
        required: false
      until:
        description: 到这个北京时间自动当维护结束（可留空，例 2026-09-24 23:00）
        type: string
        required: false
      bad_versions:
        description: 撤回的版本（留空不改；写 0.2.10 加入名单，-0.2.10 移出，none 清空）
        type: string
        required: false
      rollout:
        description: 分批放量（留空不改；写「0.2.11 0」表示只给自己点「检查更新」的人，写「0.2.11 20」表示先给两成电脑，none 表示全部放开）
        type: string
        required: false
      minimum_version:
        description: 最低版本（留空不改；写 0.2.12 表示低于它的必须先更新，none 取消；不能高于线上正在发的版本）
        type: string
        required: false
      tool_route_rewrite:
        description: 换线路时怎么改工具配置（定点只改地址出问题时切回整份重写，0.2.18 起的客户端认）
        type: choice
        default: 'keep: 不改'
        options:
          - 'keep: 不改'
          - 'targeted: 只改地址（默认）'
          - 'merge: 整份重写（老办法）'
      account_groups:
        description: 分组对照（留空不改；写「codex=新名字|老名字; image=…」，可写 claude / codex / grok / image，codex=none 去掉一样，none 全部清空；0.2.19 起的客户端认）
        type: string
        required: false
      cli_models:
        description: 型号表（留空不改；写「codex.default=gpt-7; codex.previous=gpt-6-astra; codex.retired=gpt-5.5」，可写 claude / codex / grok 的 default 默认、previous 上一代、retired 已下架，几个名字用 | 隔开，codex=none 去掉一个工具，none 全部清空；0.2.20 起的客户端认）
        type: string
        required: false

permissions:
  contents: read

jobs:
  # 批准之前先跑这一段（#1114）：照这次填的算一遍「批了以后线上是什么样」，连同要看一眼的提示，
  # 写到运行页面上。release 环境的批准发生在 publish 开跑之前，只打在 publish 里的提示，批的人点下去
  # 以后才看得到。这一段不挂环境、不引用任何 secret，权限照全局只有 contents: read；读的只是客户端
  # 也在读的公开状态文件和更新清单，算出来的文件留在这台机器上，不上传。真正写线上的仍是下面的
  # publish，批准照旧；填错了（版本号写错、最低版本比线上还高）这一段就红，不用白批一次。
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 这一段只用 node 自带的模块，不装依赖。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve the address clients read the status file from
        id: feed
        run: |
          set -euo pipefail
          base=$(node -p "require('./scripts/update-release-utils.cjs').resolveUpdateUrlForVersion(require('./package.json').version)")
          echo "url=${base%/}/service-status.json" >> "$GITHUB_OUTPUT"

      # 线上那份读不到（404）就从空白开始；别的失败一律停下，免得用一份空白的
      # 覆盖掉线上别的开关。
      - name: Fetch the status file that is live now
        env:
          STATUS_URL: ${{ steps.feed.outputs.url }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/current.json" --write-out '%{http_code}' "$STATUS_URL")
          case "$code" in
            200) echo "线上现有内容："; cat "$RUNNER_TEMP/current.json"; echo ;;
            404) echo "线上还没有状态文件，从空白开始"; rm -f "$RUNNER_TEMP/current.json" ;;
            *) echo "::error::读取线上状态文件失败（HTTP $code），为免覆盖别的开关，这次不改"; exit 1 ;;
          esac

      # 最低版本不许高于线上正在发的版本，否则低于它的人找不到可装的新版本、被挡在门外。
      # 只在这次要设最低版本时读各平台的更新清单（Linux 两个架构各一份，没发过就 404 跳过）；
      # 读到的版本号交给脚本比较，出包时间（releaseDate）交给脚本判断要不要提醒（#1114）。
      - name: Read the versions the feed is publishing now
        id: published
        env:
          STATUS_URL: ${{ steps.feed.outputs.url }}
          MINIMUM_VERSION: ${{ inputs.minimum_version }}
        run: |
          set -euo pipefail
          versions=""
          dates=""
          trimmed=$(printf '%s' "$MINIMUM_VERSION" | tr -d '[:space:]')
          if [ -n "$trimmed" ] && [ "$(printf '%s' "$trimmed" | tr '[:upper:]' '[:lower:]')" != "none" ]; then
            base="${STATUS_URL%/*}"
            for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
              code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/$manifest" --write-out '%{http_code}' "$base/$manifest")
              case "$code" in
                200)
                  version=$(sed -n 's/^version:[[:space:]]*//p' "$RUNNER_TEMP/$manifest" | head -n 1 | tr -d "'\"[:space:]")
                  released=$(sed -n 's/^releaseDate:[[:space:]]*//p' "$RUNNER_TEMP/$manifest" | head -n 1 | tr -d "'\"[:space:]")
                  echo "线上 $manifest 的版本：$version（出包时间 ${released:-看不出}）"
                  versions="$versions $version"
                  dates="$dates $version=$released" ;;
                404) echo "线上没有 $manifest，跳过这个平台" ;;
                *) echo "::error::读取线上 $manifest 失败（HTTP $code），为免把客户挡在门外，这次不改"; exit 1 ;;
              esac
            done
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "dates=$dates" >> "$GITHUB_OUTPUT"

      # 输入一律经环境变量传给脚本，不拼进命令行：「给用户看的一句话」是自由文本。
      - name: Show the approver what this run would publish
        env:
          MAINTENANCE_CHOICE: ${{ inputs.maintenance }}
          MAINTENANCE_MESSAGE: ${{ inputs.message }}
          MAINTENANCE_UNTIL: ${{ inputs.until }}
          BAD_VERSIONS: ${{ inputs.bad_versions }}
          ROLLOUT: ${{ inputs.rollout }}
          MINIMUM_VERSION: ${{ inputs.minimum_version }}
          PUBLISHED_VERSIONS: ${{ steps.published.outputs.versions }}
          PUBLISHED_DATES: ${{ steps.published.outputs.dates }}
          TOOL_ROUTE_REWRITE: ${{ inputs.tool_route_rewrite }}
          ACCOUNT_GROUPS: ${{ inputs.account_groups }}
          CLI_MODELS: ${{ inputs.cli_models }}
        run: |
          set -euo pipefail
          node scripts/service-status.cjs \
            --current "$RUNNER_TEMP/current.json" \
            --output "$RUNNER_TEMP/service-status.json" \
            --maintenance "${MAINTENANCE_CHOICE%%:*}" \
            --message "$MAINTENANCE_MESSAGE" \
            --until "$MAINTENANCE_UNTIL" \
            --bad-versions "$BAD_VERSIONS" \
            --rollout "$ROLLOUT" \
            --minimum-version "$MINIMUM_VERSION" \
            --published-versions "$PUBLISHED_VERSIONS" \
            --published-dates "$PUBLISHED_DATES" \
            --tool-route-rewrite "${TOOL_ROUTE_REWRITE%%:*}" \
            --account-groups "$ACCOUNT_GROUPS" \
            --cli-models "$CLI_MODELS" \
            --summary "$GITHUB_STEP_SUMMARY"
          echo "批准以后将要发布（按现在线上那一份算）："
          cat "$RUNNER_TEMP/service-status.json"

  publish:
    # 等预览跑完才开始等批准：批的人点开运行时，页面上已经有这次要发布的内容和提示。
    needs: preview
    # 与 publish-release 的 publish 作业、rollback-release 共用一个并发组：三者都是
    # 「先读线上、再写回去」，交错执行会让后写的盖掉先写的（#492）。
    concurrency:
      group: update-feed
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      OBJECT_PREFIX: xingmang-manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --registry=https://registry.npmjs.org/

      - name: Fail early when the R2 credentials are not configured
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::release 环境缺少这些 secret：$missing（见 docs/SERVICE-STATUS.md）"
            exit 1
          fi

      - name: Resolve the address clients read the status file from
        id: feed
        run: |
          set -euo pipefail
          base=$(node -p "require('./scripts/update-release-utils.cjs').resolveUpdateUrlForVersion(require('./package.json').version)")
          echo "url=${base%/}/service-status.json" >> "$GITHUB_OUTPUT"

      # 线上那份读不到（404）就从空白开始；别的失败一律停下，免得用一份空白的
      # 覆盖掉线上别的开关。
      - name: Fetch the status file that is live now
        env:
          STATUS_URL: ${{ steps.feed.outputs.url }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/current.json" --write-out '%{http_code}' "$STATUS_URL")
          case "$code" in
            200) echo "线上现有内容："; cat "$RUNNER_TEMP/current.json"; echo ;;
            404) echo "线上还没有状态文件，从空白开始"; rm -f "$RUNNER_TEMP/current.json" ;;
            *) echo "::error::读取线上状态文件失败（HTTP $code），为免覆盖别的开关，这次不改"; exit 1 ;;
          esac

      # 最低版本不许高于线上正在发的版本，否则低于它的人找不到可装的新版本、被挡在门外。
      # 只在这次要设最低版本时读各平台的更新清单（Linux 两个架构各一份，没发过就 404 跳过）；
      # 读到的版本号交给脚本比较，出包时间（releaseDate）交给脚本判断要不要提醒（#1114）。
      - name: Read the versions the feed is publishing now
        id: published
        env:
          STATUS_URL: ${{ steps.feed.outputs.url }}
          MINIMUM_VERSION: ${{ inputs.minimum_version }}
        run: |
          set -euo pipefail
          versions=""
          dates=""
          trimmed=$(printf '%s' "$MINIMUM_VERSION" | tr -d '[:space:]')
          if [ -n "$trimmed" ] && [ "$(printf '%s' "$trimmed" | tr '[:upper:]' '[:lower:]')" != "none" ]; then
            base="${STATUS_URL%/*}"
            for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
              code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/$manifest" --write-out '%{http_code}' "$base/$manifest")
              case "$code" in
                200)
                  version=$(sed -n 's/^version:[[:space:]]*//p' "$RUNNER_TEMP/$manifest" | head -n 1 | tr -d "'\"[:space:]")
                  released=$(sed -n 's/^releaseDate:[[:space:]]*//p' "$RUNNER_TEMP/$manifest" | head -n 1 | tr -d "'\"[:space:]")
                  echo "线上 $manifest 的版本：$version（出包时间 ${released:-看不出}）"
                  versions="$versions $version"
                  dates="$dates $version=$released" ;;
                404) echo "线上没有 $manifest，跳过这个平台" ;;
                *) echo "::error::读取线上 $manifest 失败（HTTP $code），为免把客户挡在门外，这次不改"; exit 1 ;;
              esac
            done
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "dates=$dates" >> "$GITHUB_OUTPUT"

      # 输入一律经环境变量传给脚本，不拼进命令行：「给用户看的一句话」是自由文本。
      - name: Build the new status file
        env:
          MAINTENANCE_CHOICE: ${{ inputs.maintenance }}
          MAINTENANCE_MESSAGE: ${{ inputs.message }}
          MAINTENANCE_UNTIL: ${{ inputs.until }}
          BAD_VERSIONS: ${{ inputs.bad_versions }}
          ROLLOUT: ${{ inputs.rollout }}
          MINIMUM_VERSION: ${{ inputs.minimum_version }}
          PUBLISHED_VERSIONS: ${{ steps.published.outputs.versions }}
          PUBLISHED_DATES: ${{ steps.published.outputs.dates }}
          TOOL_ROUTE_REWRITE: ${{ inputs.tool_route_rewrite }}
          ACCOUNT_GROUPS: ${{ inputs.account_groups }}
          CLI_MODELS: ${{ inputs.cli_models }}
        run: |
          set -euo pipefail
          node scripts/service-status.cjs \
            --current "$RUNNER_TEMP/current.json" \
            --output "$RUNNER_TEMP/service-status.json" \
            --maintenance "${MAINTENANCE_CHOICE%%:*}" \
            --message "$MAINTENANCE_MESSAGE" \
            --until "$MAINTENANCE_UNTIL" \
            --bad-versions "$BAD_VERSIONS" \
            --rollout "$ROLLOUT" \
            --minimum-version "$MINIMUM_VERSION" \
            --published-versions "$PUBLISHED_VERSIONS" \
            --published-dates "$PUBLISHED_DATES" \
            --tool-route-rewrite "${TOOL_ROUTE_REWRITE%%:*}" \
            --account-groups "$ACCOUNT_GROUPS" \
            --cli-models "$CLI_MODELS"
          echo "将要发布："
          cat "$RUNNER_TEMP/service-status.json"

      - name: Upload the status file
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp "$RUNNER_TEMP/service-status.json" \
            "s3://$R2_BUCKET/$OBJECT_PREFIX/service-status.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache'

      - name: Verify clients now read exactly what was uploaded
        env:
          STATUS_URL: ${{ steps.feed.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/published.json" "$STATUS_URL"
          if ! cmp -s "$RUNNER_TEMP/service-status.json" "$RUNNER_TEMP/published.json"; then
            echo "::error::上传成功，但客户会用的地址读到的不是这一份（可能是缓存），请过几分钟重跑一次核对"
            exit 1
          fi
          echo "客户端下一次读取（最迟 15 分钟、维护期间 5 分钟）就会看到这一份"
