# 放量体检：正在分批放量时，拿新版本和还在旧版的电脑的每天打卡比一比，在运行摘要页第一行给出
# 「建议放开 / 建议停住 / 再等等」（怎么比见 scripts/rollout-health.cjs 开头，怎么用见
# docs/RELEASING.md「分批放量」）。没在放量时读一下状态文件就结束。
#
# 只读：状态文件和更新清单是客户端也在读的公开文件；打卡从 Cloudflare 的访问统计里数，令牌和
# update-feed-stats 是同一把（仓库 Secrets 里的 CLOUDFLARE_ANALYTICS_TOKEN，只有两项读权限）；
# 这一版发出去的时间读本仓库公开的 GitHub Release。不挂 release 环境，不用批准，也碰不到发布凭据
# 和更新目录。只给建议，放开、停住照旧在 service-status 那里批。
#
# 每天北京时间中午 12:17（UTC 4:17）跑：打卡按 UTC 分天，新版装上那天出的问题，要第二天北京时间
# 8 点以后开机时才报上来，早上 6:17 的版本统计赶在这之前，几乎看不到新版的打卡。
name: rollout-health

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # fork 里没有这个令牌，定时跑了也只会红。
    if: ${{ github.event_name != 'schedule' || github.repository == 'xufei5620/xingmang-ai-manager' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 脚本只用 Node 自带的模块，不用 npm ci。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve the address clients read the status file from
        id: feed
        run: |
          set -euo pipefail
          base=$(node -p "require('./scripts/update-release-utils.cjs').resolveUpdateUrlForVersion(require('./package.json').version)")
          echo "base=${base%/}" >> "$GITHUB_OUTPUT"

      # 状态文件 404 就是没在放量；别的读不到一律停下，免得把「读不到」说成「没在放量」。清单只取
      # 版本号和出包时间（releaseDate）两行，交给脚本判断放量的那一版是不是已经发出去了。
      - name: Read the rollout and the versions the feed is publishing now
        id: live
        env:
          PUBLIC_BASE: ${{ steps.feed.outputs.base }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/service-status.json" --write-out '%{http_code}' "$PUBLIC_BASE/service-status.json")
          case "$code" in
            200) ;;
            404) echo "线上还没有状态文件，没在放量"; rm -f "$RUNNER_TEMP/service-status.json" ;;
            *) echo "::error::读取线上状态文件失败（HTTP $code），看不出现在放没放量，过一会儿手动重跑"; exit 1 ;;
          esac
          dates=""
          for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            code=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/$manifest" --write-out '%{http_code}' "$PUBLIC_BASE/$manifest")
            case "$code" in
              200)
                version=$(sed -n 's/^version:[[:space:]]*//p' "$RUNNER_TEMP/$manifest" | head -n 1 | tr -d "'\"[:space:]")
                released=$(sed -n 's/^releaseDate:[[:space:]]*//p' "$RUNNER_TEMP/$manifest" | head -n 1 | tr -d "'\"[:space:]")
                dates="$dates $version=$released" ;;
              404) ;;
              *) echo "::error::读取线上 $manifest 失败（HTTP $code），过一会儿手动重跑"; exit 1 ;;
            esac
          done
          echo "dates=$dates" >> "$GITHUB_OUTPUT"
          echo "version=$(node scripts/rollout-health.cjs rollout-version --status "$RUNNER_TEMP/service-status.json")" >> "$GITHUB_OUTPUT"

      # 发布作业最后建的那个 Release 的时间就是这一版到客户手上的时间；查不到（还没建成、收尾那步红了）
      # 就留空，脚本改按出包时间算并写明。
      - name: Look up when the rolled-out version reached customers
        id: release
        if: ${{ steps.live.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.live.outputs.version }}
        run: |
          set -uo pipefail
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq '.published_at // ""' 2>/dev/null || true)
          # 查不到时 gh 可能把报错的 JSON 打出来，只认一行 ISO 时间。
          if ! [[ "$published" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$ ]]; then published=''; fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Compare the new version with the machines still on older ones
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          PUBLISHED_DATES: ${{ steps.live.outputs.dates }}
          RELEASED_AT: ${{ steps.release.outputs.published }}
        run: |
          set -euo pipefail
          node scripts/rollout-health.cjs check --status "$RUNNER_TEMP/service-status.json" \
            --published-dates "$PUBLISHED_DATES" --released-at "$RELEASED_AT" | tee -a "$GITHUB_STEP_SUMMARY"
