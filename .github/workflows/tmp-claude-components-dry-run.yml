# 临时：拿拆好的同步脚本原样空跑一遍五部分（真下官网安装包和组件、核大小和 SHA-256，桶换成只记账的假桶，
# 不碰 COS、不读任何 secret），核完就删。
name: tmp-claude-components-dry-run

on:
  push:
    branches: [claude/project-thread-30ihrb]

permissions:
  contents: read

jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        part: [vm-win32-x64, vm-win32-arm64, vm-unix-x64, vm-unix-arm64, code-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: node node_modules/typescript/bin/tsc -p tsconfig.electron.json

      - name: Run the sync with a bookkeeping-only bucket
        env:
          PART: ${{ matrix.part }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const sync = require('./scripts/sync-claude-components-cos.cjs')
          const common = require('./scripts/cos-sync-utils.cjs')
          const objects = new Map()
          const store = {
            async inspect(key) { return objects.get(key) || null },
            async publishFile(key, filePath, input) {
              sync.assertObjectKey(key)
              const hash = crypto.createHash('sha256')
              let bytes = 0
              for await (const chunk of fs.createReadStream(filePath)) { hash.update(chunk); bytes += chunk.length }
              const object = { key, bytes, sha256: hash.digest('hex'), etag: `"dry-${objects.size}"`, contentType: input.contentType }
              objects.set(key, object)
              console.log(`[dry-run] would upload ${key} ${bytes}`)
              return object
            },
          }
          sync.synchronizeClaudeComponents({ part: process.env.PART, store, dependencies: sync.createRuntimeDependencies(common), components: sync.loadComponents(),
            progress: (event) => { if (!['stage-progress', 'transfer'].includes(event.event)) console.log(`[claude-components-sync] ${JSON.stringify(event)}`) } })
            .then((result) => console.log('######## result ' + JSON.stringify(result)))
            .catch((error) => { console.error('######## failed ' + JSON.stringify(sync.safeComponentsSyncFailure(error)), error); process.exitCode = 1 })
          NODE
