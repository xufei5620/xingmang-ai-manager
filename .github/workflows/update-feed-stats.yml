# 看各版本的星芒各占多少电脑：按客户端读 service-status.json 时带的版本号，
# 从 Cloudflare 的访问统计里数（怎么数、哪些看不到见 scripts/update-feed-stats.cjs
# 开头和 docs/SERVICE-STATUS.md「看各版本有多少人在用」）。结果写在这次运行的摘要页里。
# 仓库公开，运行页谁都能看，所以摘要页只有占比，没有台数。
#
# 只读：令牌是仓库 Secrets 里的 CLOUDFLARE_ANALYTICS_TOKEN（只有 Zone Analytics 和 Zone 两项读权限，
# 限 shenfengwl.fun），不用 release 环境，所以不用批准，也碰不到发布凭据和更新目录。
#
# 每天北京时间早上 6:17（UTC 22:17，避开整点那一波排队）自动数一次最近 1 天：Cloudflare 只留最近一段，
# 没人点的那几天过了就再也数不到；1 天的窗口抽样也最少。结果和手动跑一样在那次运行的摘要页上，
# 日志里也有同样的一份。手动跑照旧，天数自己填。
name: update-feed-stats

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 统计最近几天（1~31；Cloudflare 留得更短时按它留的算）
        type: string
        default: '7'

permissions:
  contents: read

jobs:
  stats:
    # fork 里没有这个令牌，定时跑了也只会红。
    if: ${{ github.event_name != 'schedule' || github.repository == 'xufei5620/xingmang-ai-manager' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # 脚本只用 Node 自带的模块，不用 npm ci。来源 IP 只在脚本内存里去重，
      # 日志和摘要页里只有按版本汇总的占比。
      - name: Count clients per version from the status file requests
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          # 定时运行没有 inputs，固定数 1 天；手动跑用填的天数。
          DAYS: ${{ github.event_name == 'schedule' && '1' || inputs.days }}
        run: |
          set -euo pipefail
          node scripts/update-feed-stats.cjs --days "$DAYS" | tee -a "$GITHUB_STEP_SUMMARY"
